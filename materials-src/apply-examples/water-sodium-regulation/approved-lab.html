  {id:'raas',short:'RAAS',full:'腎素／醛固酮',side:'left',y:.59,anchor:[.39,.62],direction:'up'}],

 for(const o of organStates)svg.append(indicator(ox+o.a[0]*iw,oy+o.a[1]*ih,o.dir));
}
const GLOSSARY={"water": {"name": "水攝取三來源", "text": "水攝取包括喝入的液體、食物中的水，以及身體自己產生的代謝水。平衡示例中三者每日合計2500 mL，與排出量相等。"}, "thirst": {"name": "口渴", "text": "口渴是促使人喝水的感覺，主要控制水的攝取。水不足時，喝水增加攝取，和抗利尿激素（ADH）保水一起調節水量。"}, "adhUp": {"name": "抗利尿激素（ADH）", "text": "抗利尿激素（ADH）是幫助腎臟保水的激素。水不足時，腦下垂體後葉釋放ADH，讓集尿管更容易回收水。"}, "raas": {"name": "腎素－血管收縮素－醛固酮系統（RAAS）", "text": "腎素－血管收縮素－醛固酮系統（RAAS）是多器官接力升高血壓的路徑。保留狀態中，腎臟發動、肺臟轉化、腎上腺釋出醛固酮，幫助留鈉留水。"}, "anp": {"name": "心房利鈉尿肽（ANP）", "text": "心房利鈉尿肽（ANP）主要由心房分泌，回到心臟的血變多時會刺激它釋放。排出狀態中，它促進排鈉，也減少讓身體留住鈉水的激素訊號。"}, "renin": {"name": "腎素（Renin）", "text": "腎素（Renin）由腎臟近腎絲球細胞釋放，是升高血壓路徑的起點。排出狀態中，心房利鈉尿肽（ANP）抑制腎素分泌。"}, "angii": {"name": "血管收縮素II（AngII）", "text": "血管收縮素II（AngII）是會讓小動脈收縮、提高血壓的訊號。排出狀態中，心房利鈉尿肽（ANP）抑制它的分泌。"}, "aldosterone": {"name": "醛固酮（Aldosterone）", "text": "醛固酮（Aldosterone）由腎上腺皮質釋出，幫助腎臟回收鈉。排出狀態中，心房利鈉尿肽（ANP）降低醛固酮的釋放。"}, "adhDown": {"name": "抗利尿激素（ADH）", "text": "抗利尿激素（ADH）讓集尿管更容易回收水，幫助把水留回身體。排出狀態中，心房利鈉尿肽（ANP）抑制ADH分泌。"}};
const INTAKE={'state-1':[['液體',1500,'＝基準'],['食物水',800,'＝基準'],['代謝水',200,'＝基準']],'state-2':[['液體',1500,'↑攝取，未定量'],['食物水',800,'＝不變'],['代謝水',200,'＝不變']],'state-3':[['液體',1500,'＝不變'],['食物水',800,'＝不變'],['代謝水',200,'＝不變']]};
Object.assign(GLOSSARY,{"volumeUp": {"name": "回心血量增加", "text": "回心血量是回到心臟的血液量。回來的血增加時，會刺激心房壁的牽張接受器，帶動心房利鈉尿肽（ANP）分泌。"}, "stretch": {"name": "心房牽張", "text": "心房牽張是心房肌肉被拉長的狀態。回心血量增加讓牽張接受器興奮，刺激心房利鈉尿肽（ANP）分泌。"}, "hormonesDown": {"name": "四個激素下降", "text": "四個激素是腎素、血管收縮素II（AngII）、醛固酮和抗利尿激素（ADH）。排出狀態中，心房利鈉尿肽（ANP）抑制這些激素的分泌或釋放。"}, "excrete": {"name": "排鈉排水增加", "text": "排鈉排水是把鈉和水排出身體。心房利鈉尿肽（ANP）促進鈉排泄，抗利尿激素（ADH）受抑制則使水分排泄增加。"}, "volumeDown": {"name": "血容積下降", "text": "血容積是血管內的血液量，血漿是細胞外液的一部分。這條排出流程以排鈉排水減少體液量，表示減少血管內液體的回饋方向。"}, "deficit": {"name": "水不足或血壓下降", "text": "水不足時，口渴促進攝取，抗利尿激素（ADH）幫助保水。血壓下降也會啟動腎素－血管收縮素－醛固酮系統（RAAS）。"}, "retainSignals": {"name": "口渴、ADH與RAAS上升", "text": "口渴促進喝水，抗利尿激素（ADH）增加腎端保水。腎素－血管收縮素－醛固酮系統（RAAS）接力作用，幫助留住鈉和水。"}, "conserve": {"name": "喝水增加、保水保鈉", "text": "喝水讓進入身體的水增加，保水則讓腎臟少流失水。抗利尿激素（ADH）增加水回收，醛固酮促進鈉回收，水可隨滲透作用回收。"}, "waterOut": {"name": "每日排出2500 mL", "text": "水會經尿液、呼氣、皮膚及糞便排出。平衡時，每日總排出約2500 mL，與攝取量相等；各途徑的量仍可有範圍。"}});
const FLOWS={"state-1": [[["water", "攝取2500", "攝取2500", null]], "＝", [["waterOut", "排出2500", "排出2500", null]]], "state-2": [[["deficit", "水不足／血壓下降", "缺水/低壓", null]], "→", [["thirst", "口渴", "口渴/ADH/RAAS", "up"], ["adhUp", "ADH", "", "up"], ["raas", "RAAS", "", "up"]], "→", [["conserve", "喝水增加・保水保鈉", "飲水·保鈉水", null]]], "state-3": [[["volumeUp", "回心血量", "血量", "up"]], "→", [["stretch", "心房牽張", "牽張", null]], "→", [["anp", "ANP", "ANP", "up"]], "→", [["renin", "腎素", "四素", "down"], ["angii", "AngII", "", "down"], ["aldosterone", "醛固酮", "", "down"], ["adhDown", "ADH", "", "down"]], "→", [["excrete", "排鈉排水", "排", "up"]], "→", [["volumeDown", "血容積", "血量", "down"]]]};
function drawFlow(s){document.querySelector('#causal-flow').innerHTML=FLOWS[s].map(stage=>typeof stage==='string'?`<span class="causal-link" ${stage==='＝'?'data-equal':''} aria-hidden="true"><span class="flow-link-glyph">${stage}</span></span>`:`<div class="causal-stage">${stage.map(([key,label,short,dir],i)=>`<button type="button" class="causal-node ${short?'':'desktop-node'}" data-causal-term="${key}" data-compact-term="${s==='state-2'&&key==='thirst'?'retainSignals':s==='state-3'&&key==='renin'?'hormonesDown':key}" aria-label="${s==='state-2'&&key==='thirst'?'口渴、ADH與RAAS':s==='state-3'&&key==='renin'?'腎素、AngII、醛固酮與ADH':GLOSSARY[key].name}${dir==='up'?'上升':dir==='down'?'下降':''}" aria-pressed="false"><span class="flow-full">${label}</span><span class="flow-short">${short}</span>${dir?`<span class="solid-badge flow-badge badge-solid-${dir}">${dir==='up'?'↑':'↓'}</span>`:''}</button>`).join('')}</div>`).join('');}
// Fit real CSS text to the available flow area; no transforms shrink the text.
const flowMeasure=document.createElement('canvas').getContext('2d');
function fitFlow(){
 const flow=document.querySelector('#causal-flow');if(!flow||!flow.children.length)return;
 const compact=matchMedia('(max-width:767px) and (orientation:portrait), (max-height:500px) and (orientation:landscape)').matches;
 const stages=[...flow.querySelectorAll('.causal-stage')],links=[...flow.querySelectorAll('.causal-link')],W=flow.clientWidth,H=flow.clientHeight;
 const family=getComputedStyle(flow).fontFamily;
 const nodesFor=stage=>[...stage.querySelectorAll('.causal-node')].filter(b=>getComputedStyle(b).display!=='none');
 const natural=(node,f)=>{flowMeasure.font=`600 ${f}px ${family}`;const name=node.querySelector(compact?'.flow-short':'.flow-full').textContent;return flowMeasure.measureText(name).width+(node.querySelector('.flow-badge')?flowMeasure.measureText('↑').width+6+2:0)+2;};
 flow.dataset.layout=compact?'compact':'spread';
 if(compact){
  flow.style.removeProperty('grid-template-rows');
  const nodes=stages.flatMap(nodesFor);let font=20;
  while(font>14&&nodes.reduce((sum,n)=>sum+natural(n,font),0)+links.length*8>W)font--;
  const nodeH=Math.max(22,H*.9);
  stages.forEach(stage=>{const ns=nodesFor(stage);stage.style.width='auto';stage.style.height=`${nodeH}px`;ns.forEach(n=>{n.style.fontSize=`${font}px`;n.style.lineHeight='1.25';n.style.padding='0';n.style.height='100%';n.style.minWidth='0';n.style.flex='0 0 auto';n.querySelectorAll('.flow-badge').forEach(b=>{b.style.fontSize=`${font}px`})})});
 }else{
  const nodeH=Math.max(22,(H-(stages.length-1)*8)/stages.length*.7);
  flow.style.gridTemplateRows=[...flow.children].map(e=>e.classList.contains('causal-stage')?`${nodeH}px`:'minmax(8px,1fr)').join(' ');
  stages.forEach(stage=>{stage.style.width='100%';stage.style.height='100%';const ns=nodesFor(stage),slot=(W-(ns.length-1)*6)/ns.length;let font=Math.min(20,Math.max(14,Math.floor((nodeH-4)/1.25)));
   while(font>14&&Math.max(...ns.map(n=>natural(n,font)))+8>slot)font--;
   ns.forEach(n=>{n.style.fontSize=`${font}px`;n.style.lineHeight='1.25';n.style.height='100%';n.style.padding='0 4px';n.style.flex='1 1 0';n.style.minWidth='0';n.querySelectorAll('.flow-badge').forEach(b=>{b.style.fontSize=`${font}px`})});
  });
 }
 flow.dataset.fittedWidth=String(W);flow.dataset.fittedHeight=String(H);
}
new ResizeObserver(()=>requestAnimationFrame(fitFlow)).observe(document.querySelector('.causal-box'));
const ROW_TERMS={'state-1':[['water']],'state-2':[['thirst'],['adhUp'],['raas']],'state-3':[['anp'],['renin','angii'],['aldosterone'],['adhDown']]};
function selectTerm(key){document.querySelector('#term-description').textContent=GLOSSARY[key].text;document.querySelectorAll('.term-select').forEach(b=>{const selected=b.dataset.term===key;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',selected)});document.querySelectorAll('.factor-card').forEach(c=>c.classList.toggle('selected',!!c.querySelector('.term-select.active')));document.querySelector('.term-box').dataset.selected=key;document.querySelectorAll('.causal-node').forEach(b=>{const match=b.dataset.causalTerm===key||b.dataset.compactTerm===key;b.classList.toggle('active',match);b.setAttribute('aria-pressed',match)});}
function switchState(s){current=s;const d=STATES[s];document.querySelectorAll('.btn-tab').forEach(b=>{b.classList.toggle('active',b.dataset.state===s);b.setAttribute('aria-pressed',b.dataset.state===s)});document.querySelector('#p2p-banner').textContent=d.banner;document.querySelector('#p2p-changes-list').innerHTML=d.changes.map(([name,detail,type,badge],i)=>`<div role="group" data-default-term="${ROW_TERMS[s][i][0]}" class="factor-card ${type==='same'?'':type+'-card'}"><span class="shape-marker ${type==='same'?'':'marker-'+type}">${type==='up'?'↑':type==='down'?'↓':'＝'}</span><div class="factor-info"><div class="factor-name">${ROW_TERMS[s][i].map((key,j)=>`<button type="button" class="term-select" data-term="${key}" aria-pressed="false">${ROW_TERMS[s][i].length===1?name:(j===0?'腎素':'AngII')}</button>`).join('<span aria-hidden="true">／</span>')}</div><div class="factor-desc">${detail}</div></div><span class="solid-badge ${type==='same'?'':'badge-solid-'+type}">${badge}</span></div>`).join('');document.querySelector('#p2p-unchanged-tags').innerHTML=INTAKE[s].map(([name,value,status])=>`<div class="intake-row"><span>${name} ${value} mL</span><span>${status}</span></div>`).join('');document.querySelector('.teacher-note').classList.toggle('show',s==='state-3');drawFlow(s);fitFlow();selectTerm(ROW_TERMS[s][0][0]);draw()}
if(new URLSearchParams(location.search).get('teacher')==='1')document.body.classList.add('teacher-preview');
document.querySelectorAll('.btn-tab').forEach(b=>b.addEventListener('click',()=>switchState(b.dataset.state)));document.querySelector('#p2p-changes-list').addEventListener('click',e=>{const target=e.target.closest('.term-select');const row=e.target.closest('.factor-card');if(target)selectTerm(target.dataset.term);else if(row)selectTerm(row.dataset.defaultTerm)});document.querySelector('#causal-flow').addEventListener('click',e=>{const b=e.target.closest('.causal-node');if(b)selectTerm(matchMedia('(max-width:767px) and (orientation:portrait), (max-height:500px) and (orientation:landscape)').matches?b.dataset.compactTerm:b.dataset.causalTerm)});new ResizeObserver(draw).observe(document.querySelector('.figure-pane'));switchState(current);
