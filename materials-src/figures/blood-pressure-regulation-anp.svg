<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 494" role="img"><rect width="480" height="494" rx="20" fill="#f5f0fa"/><text x="240" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#17212b">排鈉、利尿如何影響血壓</text><rect x="24" y="58" width="432" height="90" rx="12" fill="#fff" stroke="#bba9cb"/><text x="240" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">心房 ANP／心室 BNP</text><text x="240" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">促進腎臟排鈉、排水</text><path d="M240 151v20m-8-8 8 8 8-8" stroke="#5b3b8c" fill="none" stroke-width="3"/><rect x="24" y="176" width="432" height="90" rx="12" fill="#e4eff9" stroke="#bba9cb"/><text x="240" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">尿量↑（利尿）</text><text x="240" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">細胞外液與血容量↓</text><path d="M240 269v20m-8-8 8 8 8-8" stroke="#5b3b8c" fill="none" stroke-width="3"/><rect x="24" y="294" width="432" height="60" rx="12" fill="#fff" stroke="#bba9cb"/><text x="240" y="326" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">回心血量↓</text><path d="M240 357v20m-8-8 8 8 8-8" stroke="#5b3b8c" fill="none" stroke-width="3"/><rect x="24" y="382" width="432" height="90" rx="12" fill="#e4eff9" stroke="#bba9cb"/><text x="240" y="414" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">心搏量、心輸出量傾向↓</text><text x="240" y="444" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">其他條件相同時血壓傾向↓</text></svg>