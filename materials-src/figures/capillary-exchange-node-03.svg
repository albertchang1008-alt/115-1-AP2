<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" role="img" aria-label="拔河：靜水壓把液體往外推"><title>拔河：靜水壓把液體往外推</title><style>text{font-family:system-ui,sans-serif;font-size:calc(18px * var(--font-scale,1))}.title{font-weight:700}</style><rect width="400" height="290" rx="14" fill="#fafbfd"/><text x="18" y="30" font-size="18" fill="#17212b" text-anchor="start">拔河：靜水壓把液體往外推</text><path d="M45 120H355" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="200" cy="120" r="9" fill="#17212b"/><path d="M65 145L100 120L65 95" fill="none" stroke="#8250a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M335 145L300 120L335 95" fill="none" stroke="#8250a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="20" y="70" font-size="18" fill="#8250a0" text-anchor="start">外推：靜水壓 ↑</text><text x="20" y="200" font-size="18" fill="#8250a0" text-anchor="start">內拉：膠體滲透壓 不變</text><text x="20" y="250" font-size="18" fill="#17212b" text-anchor="start">外推力量↑ → 濾出↑</text></svg>