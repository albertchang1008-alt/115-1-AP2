<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" role="img" aria-label="動脈到微血管到靜脈"><rect width="400" height="470" rx="18" fill="#f5f8fc"/><g class="outbound"><rect x="40" y="20" width="320" height="90" rx="15" fill="#ffe7e8"/><text x="60" y="55" font-size="18" font-family="system-ui">心臟 → 動脈 → 小動脈</text><text x="60" y="90" font-size="16" font-family="system-ui">厚壁輸送；小動脈調節阻力</text></g><text x="190" y="145" font-size="24">↓</text><g class="exchange"><rect x="40" y="170" width="320" height="90" rx="15" fill="#f0e5f6"/><text x="60" y="205" font-size="18" font-family="system-ui">微血管網：交換物質</text><text x="60" y="240" font-size="16" font-family="system-ui">薄壁、總截面積大、血流慢</text></g><text x="190" y="295" font-size="24">↓</text><g class="return"><rect x="40" y="320" width="320" height="90" rx="15" fill="#e4efff"/><text x="60" y="355" font-size="18" font-family="system-ui">小靜脈 → 靜脈 → 心臟</text><text x="60" y="390" font-size="16" font-family="system-ui">肢體瓣膜與骨骼肌協助回流</text></g></svg>
