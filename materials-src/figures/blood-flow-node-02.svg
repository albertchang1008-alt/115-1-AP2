  --airway:#33403B; --airway-in:#232C29;
  --deoxy:#5B8BD6; --oxy:#E5606B; --mixed:#A57DD0; --closed:#8E979F;
  --deoxy-soft:#2B3850; --oxy-soft:#4A2C31; --mixed-soft:#3A2F4A; --closed-soft:#3A4148;
  --btn:#5FA39A; --btn-ink:#0F1513; --chip:#26303A; --particle:#F4F6F8;
}
svg[data-blood-v2]{--surface:var(--card)}text{paint-order:stroke;stroke:var(--surface);stroke-width:4;stroke-linejoin:round}.organ{font-size:16.5px;fill:var(--muted);font-weight:500}.orient{font-size:16.5px;fill:var(--muted)}.chamber{font-size:16.5px;fill:var(--chamber);font-weight:500}.chamber.on{fill:var(--ink);font-weight:700}.only-on:not(.on){opacity:0}.callout{font-size:17px;font-weight:700;fill:var(--ink);opacity:0}.callout.on{opacity:1}.callout.muted{fill:var(--muted);font-weight:500}.base,.live{fill:none;stroke-linecap:round;stroke-linejoin:round}.valve{stroke:var(--card);stroke-width:3;stroke-linecap:round;opacity:0}.valve.on{opacity:1}.post-only{opacity:0}.after .pre-only{opacity:0}.after .post-only{opacity:1}text{font-family:system-ui,sans-serif}</style><g data-view="sys" data-viewbox="0 0 440 560" data-step-meta="{&quot;steps&quot;:[{&quot;t&quot;:&quot;左心房 → 左心室&quot;,&quot;d&quot;:&quot;經二尖瓣（僧帽瓣）&quot;,&quot;s&quot;:&quot;AB-05_11 p.11-6；AB-05_11 p.11-7&quot;,&quot;p&quot;:[&quot;s-mitral&quot;],&quot;l&quot;:[&quot;L-mitral&quot;],&quot;v&quot;:[&quot;v-mitral&quot;]},{&quot;t&quot;:&quot;左心室 → 升主動脈&quot;,&quot;d&quot;:&quot;經主動脈半月瓣；升主動脈根部分出左、右冠狀動脈&quot;,&quot;s&quot;:&quot;AB-05_11 p.11-7；AB-05_11 p.11-21；AB-05_11 p.11-22&quot;,&quot;p&quot;:[&quot;s-aorta&quot;,&quot;s-coronary-r&quot;,&quot;s-coronary-l&quot;],&quot;l&quot;:[&quot;L-aorta&quot;,&quot;L-cor&quot;],&quot;v&quot;:[&quot;v-aortic&quot;]},{&quot;t&quot;:&quot;主動脈弓三分支 → 頭頸與上肢&quot;,&quot;d&quot;:&quot;頭臂（分右頸總、右鎖骨下）、左頸總、左鎖骨下動脈&quot;,&quot;s&quot;:&quot;AB-05_11 p.11-22&quot;,&quot;p&quot;:[&quot;s-brachiocephalic&quot;,&quot;s-subclavian-r&quot;,&quot;s-carotid-l&quot;,&quot;s-subclavian-l&quot;],&quot;l&quot;:[&quot;L-bc&quot;,&quot;L-lcc&quot;,&quot;L-lsc&quot;]},{&quot;t&quot;:&quot;降主動脈 → 胸／腹主動脈 → 髂總動脈&quot;,&quot;d&quot;:&quot;第4胸椎起；第4腰椎分左右髂總動脈 → 骨盆與下肢&quot;,&quot;s&quot;:&quot;AB-05_11 p.11-21&quot;,&quot;p&quot;:[&quot;s-descending&quot;,&quot;s-iliac-r&quot;],&quot;l&quot;:[&quot;L-desc&quot;,&quot;L-cil&quot;]},{&quot;t&quot;:&quot;全身微血管&quot;,&quot;d&quot;:&quot;送出 O₂ 與養分、帶走 CO₂，顏色由紅轉藍&quot;,&quot;s&quot;:&quot;AB-05_11 p.11-21、p.11-20 圖11-13&quot;,&quot;p&quot;:[&quot;s-capillary-head-r&quot;,&quot;s-capillary-head-l&quot;,&quot;s-capillary-arm-r&quot;,&quot;s-capillary-arm-l&quot;,&quot;s-capillary-leg-r&quot;,&quot;s-capillary-leg-l&quot;],&quot;l&quot;:[&quot;L-cap&quot;],&quot;shift&quot;:[&quot;oxy&quot;,&quot;deoxy&quot;]},{&quot;t&quot;:&quot;上腔靜脈 → 右心房&quot;,&quot;d&quot;:&quot;收集頭頸、上肢（左右頭臂靜脈匯合）&quot;,&quot;s&quot;:&quot;AB-05_11 p.11-32&quot;,&quot;p&quot;:[&quot;s-bcv-r&quot;,&quot;s-bcv-l&quot;,&quot;s-arm-vein-r&quot;,&quot;s-arm-vein-l&quot;,&quot;s-svc&quot;],&quot;l&quot;:[&quot;L-bcv&quot;,&quot;L-svc&quot;]},{&quot;t&quot;:&quot;下腔靜脈 → 右心房&quot;,&quot;d&quot;:&quot;收集下肢、腹部與骨盆&quot;,&quot;s&quot;:&quot;AB-05_11 p.11-32&quot;,&quot;p&quot;:[&quot;s-iliac-vein-r&quot;,&quot;s-iliac-vein-l&quot;,&quot;s-ivc&quot;],&quot;l&quot;:[&quot;L-ivc&quot;]}]}" class="flow-anatomy"><g class="art">
