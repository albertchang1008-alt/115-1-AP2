<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" role="img" data-blood-v2="true"><style>
svg[data-blood-v2]{
  --page:#F4F2EE; --card:#FDFCFA; --ink:#1F2A33; --muted:#66727E; --line:#E3DED6;
  --skin:#F3EEE8; --skin-edge:#E2D7CB;
  --lung:#F6E3DE; --lung-edge:#DDB3AA; --heart:#F0CFC9; --heart-edge:#C98D85; --chamber:#9C6A63;
  --liver:#EBD3C4; --liver-edge:#CDA58E; --brain:#F3E1DC; --brain-edge:#D6B2A9; --placenta:#EBC9CF; --bladder:#F1E2C9; --bladder-edge:#D3BB91;
  --airway:#DCE4DF; --airway-in:#F1F4F2;
  --deoxy:#2E5FA8; --oxy:#C9333F; --mixed:#7B4FA6; --closed:#8E979F;
  --deoxy-soft:#D3DDEE; --oxy-soft:#F1D2D5; --mixed-soft:#E2D6EE; --closed-soft:#D9DDE0;
  --btn:#2D5C55; --btn-ink:#FFFFFF; --chip:#E8ECEA; --particle:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  svg[data-blood-v2]:not([data-theme="light"]){
    --page:#14191E; --card:#1B2229; --ink:#E9EDF0; --muted:#9AA6B1; --line:#2C353E;
    --skin:#222A31; --skin-edge:#333E48;
    --lung:#3A2B2B; --lung-edge:#6E4B47; --heart:#4A3130; --heart-edge:#8E5E58; --chamber:#D2AEA8;
    --liver:#3E2F27; --liver-edge:#6E5243; --brain:#3A2D2C; --brain-edge:#6B4F4A; --placenta:#4A2F36; --bladder:#3C3528; --bladder-edge:#6B5D42;
    --airway:#33403B; --airway-in:#232C29;
    --deoxy:#5B8BD6; --oxy:#E5606B; --mixed:#A57DD0; --closed:#8E979F;
    --deoxy-soft:#2B3850; --oxy-soft:#4A2C31; --mixed-soft:#3A2F4A; --closed-soft:#3A4148;
    --btn:#5FA39A; --btn-ink:#0F1513; --chip:#26303A; --particle:#F4F6F8;
  }
}
svg[data-blood-v2][data-theme="dark"]{
  --page:#14191E; --card:#1B2229; --ink:#E9EDF0; --muted:#9AA6B1; --line:#2C353E;
  --skin:#222A31; --skin-edge:#333E48;
  --lung:#3A2B2B; --lung-edge:#6E4B47; --heart:#4A3130; --heart-edge:#8E5E58; --chamber:#D2AEA8;
