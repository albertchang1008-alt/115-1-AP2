<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 435" role="img" aria-label="壓差推動血流"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5b3b8c"/></marker></defs><rect width="400" height="435" rx="18" fill="#f5f0fa"/><text x="200" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#17212b">壓差推動血流</text><rect x="24" y="56" width="352" height="52" rx="14" fill="#fff" stroke="#bba9cb"/><text x="200" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">入口壓力 P₁</text><path d="M200 110L200 126" fill="none" stroke="#5b3b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="129" width="352" height="52" rx="14" fill="#e2f1f7" stroke="#bba9cb"/><text x="200" y="161" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">壓差 ΔP = P₁ − P₂</text><path d="M200 183L200 199" fill="none" stroke="#5b3b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="202" width="352" height="52" rx="14" fill="#fff" stroke="#bba9cb"/><text x="200" y="234" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">阻力 R</text><path d="M200 256L200 272" fill="none" stroke="#5b3b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="275" width="352" height="52" rx="14" fill="#e2f1f7" stroke="#bba9cb"/><text x="200" y="307" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">出口壓力 P₂</text><path d="M200 329L200 345" fill="none" stroke="#5b3b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="348" width="352" height="52" rx="14" fill="#fff" stroke="#bba9cb"/><text x="200" y="380" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">流量 Q = ΔP／R</text></svg>
