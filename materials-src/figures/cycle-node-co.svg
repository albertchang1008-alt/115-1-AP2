<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="心輸出量公式與心跳加快時舒張期縮短"><rect width="800" height="500" fill="#fffaf8"/><text x="400" y="80" font-size="40" font-weight="bold" fill="#5b3b8c" text-anchor="middle" font-family="sans-serif">CO ＝ HR × SV</text><text x="400" y="125" font-size="20" fill="#17212b" text-anchor="middle" font-family="sans-serif">70 次/分 × 70 ml ≈ 4,900 ml/分（約 4.9 公升/分）</text><text x="40" y="222" font-size="18" font-family="sans-serif" fill="#17212b">安靜 75 次/分</text><rect x="200" y="200" width="252" height="34" fill="#be123c"/><rect x="452" y="200" width="308" height="34" fill="#0369a1"/><text x="326" y="223" font-size="15" fill="#fff" text-anchor="middle" font-family="sans-serif">收縮</text><text x="606" y="223" font-size="15" fill="#fff" text-anchor="middle" font-family="sans-serif">舒張</text><text x="40" y="302" font-size="18" font-family="sans-serif" fill="#17212b">運動 150 次/分</text><rect x="200" y="280" width="175" height="34" fill="#be123c"/><rect x="375" y="280" width="105" height="34" fill="#0369a1"/><text x="288" y="303" font-size="15" fill="#fff" text-anchor="middle" font-family="sans-serif">收縮</text><text x="428" y="303" font-size="15" fill="#fff" text-anchor="middle" font-family="sans-serif">舒張</text><text x="400" y="380" font-size="20" fill="#0369a1" text-anchor="middle" font-family="sans-serif" font-weight="bold">心跳變快時，縮短最多的是舒張期（充血時間）</text><text x="400" y="420" font-size="16" fill="#4e5964" text-anchor="middle" font-family="sans-serif">長條長度＝一次心動週期的時間（秒）</text></svg>
