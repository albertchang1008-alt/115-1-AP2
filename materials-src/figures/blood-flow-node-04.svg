右心室 → 肺動脈幹&quot;,&quot;d&quot;:&quot;約2/3（右心房血液）&quot;,&quot;s&quot;:&quot;CH05 p.5-76&quot;,&quot;p&quot;:[&quot;f-rv-flow-focus&quot;,&quot;f-fo-compare&quot;],&quot;l&quot;:[&quot;L-trunk&quot;,&quot;L-23&quot;,&quot;L-13&quot;],&quot;ch&quot;:[],&quot;v&quot;:[&quot;v-tri-f&quot;,&quot;v-pul-f&quot;],&quot;n&quot;:{&quot;f-rv-flow-focus&quot;:6,&quot;f-fo-compare&quot;:3},&quot;fade&quot;:[&quot;f-fo-compare&quot;]},{&quot;t&quot;:&quot;肺動脈幹 → 動脈導管 → 降主動脈&quot;,&quot;d&quot;:&quot;約90%；只有約10%到肺（肺動脈幹血液）&quot;,&quot;s&quot;:&quot;CH05 p.5-76&quot;,&quot;p&quot;:[&quot;f-duct-flow&quot;,&quot;f-pa-r&quot;,&quot;f-pa-l&quot;],&quot;l&quot;:[&quot;L-da&quot;,&quot;L-10&quot;],&quot;n&quot;:{&quot;f-duct-flow&quot;:9,&quot;f-pa-r&quot;:1,&quot;f-pa-l&quot;:1}},{&quot;t&quot;:&quot;左心房 → 左心室 → 主動脈 → 全身&quot;,&quot;d&quot;:&quot;由左心房進入體循環&quot;,&quot;s&quot;:&quot;AB-05_11 p.11-40；AB-05_11 p.11-6&quot;,&quot;p&quot;:[&quot;f-body-head-r&quot;,&quot;f-body-head-l&quot;,&quot;f-body-lower-r&quot;,&quot;f-body-lower-l&quot;],&quot;l&quot;:[&quot;L-ao&quot;],&quot;ch&quot;:[&quot;c-la&quot;,&quot;c-lv&quot;],&quot;v&quot;:[&quot;v-mitral-f&quot;,&quot;v-aortic-f&quot;]},{&quot;t&quot;:&quot;髂內動脈 → 兩條臍動脈 → 胎盤&quot;,&quot;d&quot;:&quot;帶缺氧血回胎盤&quot;,&quot;s&quot;:&quot;AB-05_11 p.11-39；AB-05_11 p.11-40&quot;,&quot;p&quot;:[&quot;f-return-r&quot;,&quot;f-return-l&quot;],&quot;l&quot;:[&quot;L-ua&quot;,&quot;L-iia&quot;]}],&quot;post&quot;:[{&quot;t&quot;:&quot;卵圓孔 → 卵圓窩&quot;,&quot;d&quot;:&quot;出生後左心房壓力增高而閉合&quot;,&quot;s&quot;:&quot;CH05 p.5-76&quot;,&quot;st&quot;:&quot;fo&quot;,&quot;l&quot;:[&quot;A-fo&quot;]},{&quot;t&quot;:&quot;動脈導管 → 動脈韌帶&quot;,&quot;d&quot;:&quot;動脈連接閉鎖&quot;,&quot;s&quot;:&quot;CH05 p.5-76&quot;,&quot;st&quot;:&quot;da&quot;,&quot;l&quot;:[&quot;A-da&quot;]},{&quot;t&quot;:&quot;靜脈導管 → 靜脈韌帶&quot;,&quot;d&quot;:&quot;臍靜脈與下腔靜脈連接閉鎖&quot;,&quot;s&quot;:&quot;CH05 p.5-76&quot;,&quot;st&quot;:&quot;dv&quot;,&quot;l&quot;:[&quot;A-dv&quot;]},{&quot;t&quot;