<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 406" role="img"><rect width="480" height="406" rx="20" fill="#f5f0fa"/><text x="240" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#17212b">分清神經與內分泌來源</text><rect x="24" y="58" width="432" height="90" rx="12" fill="#fff" stroke="#bba9cb"/><text x="240" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">交感節後神經末梢</text><text x="240" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">釋放正腎上腺素 NE</text><rect x="24" y="176" width="432" height="90" rx="12" fill="#e4eff9" stroke="#bba9cb"/><text x="240" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">腎上腺髓質（另一來源）</text><text x="240" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">腎上腺素 → 血液 → 心臟</text><rect x="24" y="294" width="432" height="90" rx="12" fill="#fff" stroke="#bba9cb"/><text x="240" y="326" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">相同前負荷下收縮力↑</text><text x="240" y="356" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">SV↑、ESV↓</text></svg>