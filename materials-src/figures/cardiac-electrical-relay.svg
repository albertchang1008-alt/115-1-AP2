<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-label="電訊號的接力賽"><title>電訊號的接力賽</title><style>text{font-family:system-ui,sans-serif;font-size:calc(18px * var(--font-scale,1))}.title{font-weight:700}</style><rect width="400" height="540" rx="14" fill="#fafbfd"/><text x="18" y="30" font-size="18" fill="#17212b" text-anchor="start">電訊號的接力賽</text><circle cx="40" cy="75" r="12" fill="#b77900"/><path d="M40 87V133" fill="none" stroke="#b77900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="65" font-size="18" fill="#17212b" text-anchor="start">竇房結起跑</text><text x="70" y="95" font-size="18" fill="#17212b" text-anchor="start">發出電訊號</text><circle cx="40" cy="160" r="12" fill="#b77900"/><path d="M40 172V218" fill="none" stroke="#b77900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="150" font-size="18" fill="#17212b" text-anchor="start">心房</text><text x="70" y="180" font-size="18" fill="#17212b" text-anchor="start">先去極化、隨後收縮</text><circle cx="40" cy="245" r="12" fill="#b77900"/><path d="M40 257V303" fill="none" stroke="#b77900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="235" font-size="18" fill="#17212b" text-anchor="start">房室結紅綠燈</text><text x="70" y="265" font-size="18" fill="#17212b" text-anchor="start">停一下，讓心房先送血</text><circle cx="40" cy="330" r="12" fill="#b77900"/><path d="M40 342V388" fill="none" stroke="#b77900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="320" font-size="18" fill="#17212b" text-anchor="start">希氏束／束支</text><text x="70" y="350" font-size="18" fill="#17212b" text-anchor="start">接棒，朝心尖前進</text><circle cx="40" cy="415" r="12" fill="#b77900"/><path d="M40 427V473" fill="none" stroke="#b77900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="405" font-size="18" fill="#17212b" text-anchor="start">浦金氏纖維</text><text x="70" y="435" font-size="18" fill="#17212b" text-anchor="start">快速分送到心室</text><text x="20" y="510" font-size="18" fill="#17212b" text-anchor="start">接力賽只是比喻：電先行，收縮隨後</text></svg>