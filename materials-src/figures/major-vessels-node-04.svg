<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" role="img" aria-label="腹主動脈分支｜由上而下"><title>腹主動脈分支｜由上而下</title><style>text{font-family:system-ui,sans-serif;font-size:calc(18px * var(--font-scale,1))}.title{font-weight:700}</style><rect width="400" height="380" rx="14" fill="#fafbfd"/><text x="18" y="30" font-size="18" fill="#17212b" text-anchor="start">腹主動脈分支｜由上而下</text><path d="M200 60V350M200 105H130L90 80M130 105L80 125M130 105L110 155M200 185H290M200 240H95M200 240H315M200 300H285" fill="none" stroke="#a71930" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><text x="230" y="90" font-size="18" fill="#a71930" text-anchor="start">腹腔幹</text><path d="M230 96H190V105" fill="none" stroke="#a71930" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="190" cy="105" r="3" fill="#a71930"/><text x="20" y="50" font-size="18" fill="#17212b" text-anchor="start">胃、肝、脾</text><text x="225" y="170" font-size="18" fill="#a71930" text-anchor="start">上腸繫膜</text><path d="M225 176H272V185" fill="none" stroke="#a71930" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="272" cy="185" r="3" fill="#a71930"/><text x="25" y="220" font-size="18" fill="#a71930" text-anchor="start">成對腎動脈</text><path d="M25 226H110V240" fill="none" stroke="#a71930" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="110" cy="240" r="3" fill="#a71930"/><text x="215" y="330" font-size="18" fill="#a71930" text-anchor="start">下腸繫膜</text><path d="M215 336H275V300" fill="none" stroke="#a71930" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="275" cy="300" r="3" fill="#a71930"/></svg>