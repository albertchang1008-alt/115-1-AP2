<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 455" role="img" aria-label="骨骼肌擠壓與單向瓣膜"><defs><marker id="pumpArrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#176b45"/></marker></defs><rect width="400" height="455" rx="18" fill="#f5f0fa"/><text x="200" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#17212b">骨骼肌擠壓與單向瓣膜</text><text x="200" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">回流方向 →</text><rect x="34" y="125" width="332" height="110" rx="20" fill="#e1f2ef" stroke="#176b45" stroke-width="3"/><path d="M135 127L160 162M135 233L160 198M245 127L270 162M245 233L270 198" fill="none" stroke="#176b45" stroke-width="5"/><path d="M57 180H331" stroke="#176b45" stroke-width="4" fill="none" marker-end="url(#pumpArrow)"/><rect x="96" y="90" width="205" height="25" rx="12" fill="#d991a0"/><rect x="96" y="245" width="205" height="25" rx="12" fill="#d991a0"/><path d="M70 96V130" stroke="#a71930" stroke-width="4" fill="none" marker-end="url(#pumpArrow)"/><path d="M70 264V233" stroke="#a71930" stroke-width="4" fill="none" marker-end="url(#pumpArrow)"/><text x="200" y="307" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">骨骼肌收縮 → 擠壓淋巴管</text><text x="200" y="345" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">瓣葉向回流方向開啟</text><text x="200" y="383" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">若有逆流，瓣葉合攏防倒流</text><text x="200" y="425" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">瓣膜防倒流；肌肉提供推力</text></svg>
