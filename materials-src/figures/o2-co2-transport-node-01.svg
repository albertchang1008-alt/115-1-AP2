<svg xmlns="http://www.w3.org/2000/svg" id="o2-co2-transport-node-01" viewBox="0 0 1700 1904" role="img" font-family="PingFang TC,Noto Sans CJK TC,Noto Sans TC,sans-serif" aria-label="氧與二氧化碳的運輸"><style>#o2-co2-transport-node-01 .label{font-size:calc(66px * var(--font-scale,1));fill:#17212b;stroke:white;stroke-width:8;paint-order:stroke;stroke-linejoin:round}#o2-co2-transport-node-01 .focus{fill:#b4233a;color:#b4233a;font-weight:700}#o2-co2-transport-node-01 .lead{fill:none;stroke:#444;stroke-width:3}#o2-co2-transport-node-01 .halo{stroke:white;stroke-width:10}#o2-co2-transport-node-01 .dot{fill:#444;stroke:white;stroke-width:3}#o2-co2-transport-node-01 .data-card{font-size:calc(66px * var(--font-scale,1));line-height:1.3;color:#17212b;background:#f5f7f8;padding:20px 30px;border-radius:20px;line-break:strict;word-break:normal;overflow-wrap:normal;hanging-punctuation:allow-end}</style><rect width="100%" height="100%" fill="white"/><text class="label " data-label="氧的運送形式（%）" aria-label="氧的運送形式（%）" x="850" y="111" text-anchor="middle"><tspan x="850" dy="0">氧的運送形式（%）</tspan></text><text class="label focus" data-label="與血紅素結合約97%" aria-label="與血紅素結合約97%" x="70" y="236" text-anchor="start"><tspan x="70" dy="0">與血紅素結合約97%</tspan></text><rect x="80" y="285" width="1500" height="95" fill="#f1f3f5"/><rect class="data-bar" data-value="97" data-max="100" x="80" y="285" width="1455.0" height="95" fill="#D55E00"/><text class="label focus" data-label="溶於血漿約3%" aria-label="溶於血漿約3%" x="70" y="511" text-anchor="start"><tspan x="70" dy="0">溶於血漿約3%</tspan></text><rect x="80" y="560" width="1500" height="95" fill="#f1f3f5"/><rect class="data-bar" data-value="3" data-max="100" x="80" y="560" width="45.0" height="95" fill="#E6A073"/><foreignObject x="50" y="720" width="1600" height="153"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="血紅素" class=""><span style="white-space:nowrap">血紅素</span></span></div></foreignObject><foreignObject x="50" y="898" width="1600" height="153"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="血漿" class="">血漿</span></div></foreignObject><foreignObject x="50" y="1076" width="1600" height="153"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="每克血紅素約攜1.34 mL氧" class="">每克<span style="white-space:nowrap">血紅素</span>約攜<span style="white-space:nowrap">1.34 mL</span>氧</span></div></foreignObject><foreignObject x="50" y="1254" width="1600" height="153"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="溶解係數約0.003 mL/dL/mmHg" class="">溶解係數約<span style="white-space:nowrap">0.003 mL/dL/mmHg</span></span></div></foreignObject><foreignObject x="50" y="1432" width="1600" height="417"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="約 97% 與血紅素結合、3% 直接溶於血漿；每克血紅素約攜 1.34 mL 氧；溶解氧隨 PO₂ 增加（溶解係數約 0.003 mL/dL/mmHg）。" class="">約 <span style="white-space:nowrap">97%</span> 與<span style="white-space:nowrap">血紅素</span>結合、<span style="white-space:nowrap">3%</span> 直接溶於血漿；每克<span style="white-space:nowrap">血紅素</span>約攜 <span style="white-space:nowrap">1.34 mL</span> 氧；溶解氧隨 PO₂ 增加（溶解係數約 <span style="white-space:nowrap">0.003 mL/dL/mmHg</span>）。</span></div></foreignObject></svg>