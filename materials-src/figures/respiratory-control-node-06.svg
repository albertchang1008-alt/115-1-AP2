<svg xmlns="http://www.w3.org/2000/svg" id="respiratory-control-node-06" viewBox="0 0 1700 2610" role="img" font-family="PingFang TC,Noto Sans CJK TC,Noto Sans TC,sans-serif" aria-label="呼吸調節"><style>#respiratory-control-node-06 .label{font-size:calc(66px * var(--font-scale,1));fill:#17212b;stroke:white;stroke-width:8;paint-order:stroke;stroke-linejoin:round}#respiratory-control-node-06 .focus{fill:#b4233a;color:#b4233a;font-weight:700}#respiratory-control-node-06 .lead{fill:none;stroke:#444;stroke-width:3}#respiratory-control-node-06 .halo{stroke:white;stroke-width:10}#respiratory-control-node-06 .dot{fill:#444;stroke:white;stroke-width:3}#respiratory-control-node-06 .data-card{font-size:calc(66px * var(--font-scale,1));line-height:1.3;color:#17212b;background:#f5f7f8;padding:20px 30px;border-radius:20px;line-break:strict;word-break:normal;overflow-wrap:normal;hanging-punctuation:allow-end}</style><rect width="100%" height="100%" fill="white"/><rect x="65.0" y="80" width="720" height="125" rx="15" fill="#f5f7f8" stroke="#aaa" stroke-width="2"/><text class="label " data-label="運動" aria-label="運動" x="425" y="160" text-anchor="middle"><tspan x="425" dy="0">運動</tspan></text><text class="label focus" data-label="潮氣量增加" aria-label="潮氣量增加" x="480" y="430" text-anchor="middle"><tspan x="480" dy="0">潮氣量增加</tspan></text><text class="label focus" data-label="呼吸頻率增加" aria-label="呼吸頻率增加" x="480" y="660" text-anchor="middle"><tspan x="480" dy="0">呼吸頻率增加</tspan></text><defs><marker id="respiratory-control-node-06-signal-4" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#444"/></marker></defs><path class="flow-arrow" d="M425,250L120,250L120,408L200,408" fill="none" stroke="#444" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#respiratory-control-node-06-signal-4)"/><defs><marker id="respiratory-control-node-06-signal-5" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#444"/></marker></defs><path class="flow-arrow" d="M120,408L120,638L200,638" fill="none" stroke="#444" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#respiratory-control-node-06-signal-5)"/><rect x="65.0" y="900" width="720" height="125" rx="15" fill="#f5f7f8" stroke="#aaa" stroke-width="2"/><text class="label " data-label="體溫升高" aria-label="體溫升高" x="425" y="980" text-anchor="middle"><tspan x="425" dy="0">體溫升高</tspan></text><defs><marker id="respiratory-control-node-06-signal-8" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#444"/></marker></defs><path class="flow-arrow" d="M425,1070L425,1200" fill="none" stroke="#444" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#respiratory-control-node-06-signal-8)"/><text class="label " data-label="促進呼吸" aria-label="促進呼吸" x="425" y="1330" text-anchor="middle"><tspan x="425" dy="0">促進呼吸</tspan></text><path d="M850 60V1900" stroke="#ddd" stroke-width="4"/><rect x="915.0" y="80" width="720" height="125" rx="15" fill="#f5f7f8" stroke="#aaa" stroke-width="2"/><text class="label " data-label="初到高山" aria-label="初到高山" x="1275" y="160" text-anchor="middle"><tspan x="1275" dy="0">初到高山</tspan></text><defs><marker id="respiratory-control-node-06-signal-13" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#444"/></marker></defs><path class="flow-arrow" d="M1275,245L1275,310" fill="none" stroke="#444" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#respiratory-control-node-06-signal-13)"/><rect x="915.0" y="350" width="720" height="125" rx="15" fill="#f5f7f8" stroke="#aaa" stroke-width="2"/><text class="label " data-label="大氣壓降低" aria-label="大氣壓降低" x="1275" y="430" text-anchor="middle"><tspan x="1275" dy="0">大氣壓降低</tspan></text><defs><marker id="respiratory-control-node-06-signal-16" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#444"/></marker></defs><path class="flow-arrow" d="M1275,515L1275,580" fill="none" stroke="#444" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#respiratory-control-node-06-signal-16)"/><rect x="915.0" y="620" width="720" height="125" rx="15" fill="#f5f7f8" stroke="#aaa" stroke-width="2"/><text class="label focus" data-label="吸入氧分壓下降" aria-label="吸入氧分壓下降" x="1275" y="700" text-anchor="middle"><tspan x="1275" dy="0">吸入氧分壓下降</tspan></text><defs><marker id="respiratory-control-node-06-signal-19" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#444"/></marker></defs><path class="flow-arrow" d="M1275,785L1275,850" fill="none" stroke="#444" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#respiratory-control-node-06-signal-19)"/><rect x="915.0" y="890" width="720" height="125" rx="15" fill="#f5f7f8" stroke="#aaa" stroke-width="2"/><text class="label focus" data-label="周邊化學受器" aria-label="周邊化學受器" x="1275" y="970" text-anchor="middle"><tspan x="1275" dy="0">周邊化學受器</tspan></text><defs><marker id="respiratory-control-node-06-signal-22" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#444"/></marker></defs><path class="flow-arrow" d="M1275,1055L1275,1120" fill="none" stroke="#444" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#respiratory-control-node-06-signal-22)"/><rect x="915.0" y="1160" width="720" height="125" rx="15" fill="#f5f7f8" stroke="#aaa" stroke-width="2"/><text class="label focus" data-label="換氣增加" aria-label="換氣增加" x="1275" y="1240" text-anchor="middle"><tspan x="1275" dy="0">換氣增加</tspan></text><defs><marker id="respiratory-control-node-06-signal-25" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#444"/></marker></defs><path class="flow-arrow" d="M1275,1325L1275,1390" fill="none" stroke="#444" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#respiratory-control-node-06-signal-25)"/><rect x="915.0" y="1430" width="720" height="125" rx="15" fill="#f5f7f8" stroke="#aaa" stroke-width="2"/><text class="label " data-label="CO₂排出增加" aria-label="CO₂排出增加" x="1275" y="1510" text-anchor="middle"><tspan x="1275" dy="0">CO₂排出增加</tspan></text><defs><marker id="respiratory-control-node-06-signal-28" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#444"/></marker></defs><path class="flow-arrow" d="M1275,1595L1275,1660" fill="none" stroke="#444" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#respiratory-control-node-06-signal-28)"/><rect x="915.0" y="1700" width="720" height="125" rx="15" fill="#f5f7f8" stroke="#aaa" stroke-width="2"/><text class="label " data-label="pH上升" aria-label="pH上升" x="1275" y="1780" text-anchor="middle"><tspan x="1275" dy="0">pH上升</tspan></text><foreignObject x="50" y="2050" width="1600" height="505"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="運動時潮氣量與頻率增加以配合需求，體溫升高也可促進呼吸；高海拔大氣壓降低使吸入氧分壓下降，刺激周邊化學受器而換氣增加，CO₂ 排出增加，可朝呼吸性鹼中毒方向；焦慮也是課本所列情境。" class="">運動時潮氣量與頻率增加以配合需求，體溫升高也可促進呼吸；高海拔大氣壓降低使吸入氧分壓下降，刺激<span style="white-space:nowrap">周邊化學受器</span>而換氣增加，CO₂ 排出增加，可朝<span style="white-space:nowrap">呼吸性鹼中毒</span>方向；焦慮也是課本所列情境。</span></div></foreignObject></svg>