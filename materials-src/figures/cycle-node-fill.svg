<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="左心房、左心室與主動脈的瓣膜狀態，依心動週期時期切換"><style>.wall{fill:#fbe3e3;stroke:#7a2e38;stroke-width:6}.label{font:19px sans-serif;fill:#17212b}.small{font:16px sans-serif;fill:#4e5964}.open{stroke:#176b45;stroke-width:9;stroke-linecap:round}.shut{stroke:#a71930;stroke-width:10;stroke-linecap:round}.arrow{fill:none;stroke:#a71930;stroke-width:8;marker-end:url(#m)}.snd{font:bold 28px sans-serif;fill:#5b3b8c}.st{display:none}.cap{font:bold 19px sans-serif;fill:#5b3b8c}.tag{font:bold 15px sans-serif}</style><defs><marker id="m" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="12" refY="11" orient="auto"><path d="M0,0 L22,11 L0,22z" fill="#a71930"/></marker></defs>
<rect class="wall" x="150" y="50" width="250" height="135" rx="40"/><text class="label" x="240" y="125">左心房</text>
<path class="wall" d="M150 235H400V255H470V305H400L385 395Q275 465 165 395Z"/><text class="label" x="240" y="340">左心室</text>
<rect class="wall" x="470" y="45" width="110" height="265" rx="28"/><text class="label" x="490" y="35">主動脈</text>
<text class="small" x="20" y="216">二尖瓣</text><text class="small" x="20" y="238">（房室瓣）</text>
<text class="small" x="600" y="276">主動脈瓣</text><text class="small" x="600" y="298">（半月瓣）</text>
<g class="st fill" style="display:block"><path class="open" d="M185 200l-15 32M365 200l15 32"/><path class="shut" d="M470 258v44"/><path class="arrow" d="M275 150v125"/><text class="tag" x="130" y="265" fill="#176b45">開</text><text class="tag" x="625" y="325" fill="#a71930">關</text><text class="cap" x="400" y="475" text-anchor="middle">心室充血期：房室瓣開、半月瓣關；約 70% 血液被動流入心室</text></g>
<g class="st ivc"><path class="shut" d="M165 210H385"/><path class="shut" d="M470 258v44"/><text class="snd" x="200" y="285">S1</text><text class="tag" x="130" y="265" fill="#a71930">關</text><text class="tag" x="625" y="325" fill="#a71930">關</text><text class="cap" x="400" y="475" text-anchor="middle">等容心室收縮期：兩組瓣膜都關閉，容積不變、壓力急升（S1）</text></g>
<g class="st eject"><path class="shut" d="M165 210H385"/><path class="open" d="M470 258l24-14M470 302l24 14"/><path class="arrow" d="M300 330Q330 280 420 280H525V80"/><text class="tag" x="130" y="265" fill="#a71930">關</text><text class="tag" x="625" y="325" fill="#176b45">開</text><text class="cap" x="400" y="475" text-anchor="middle">心室射血期：心室壓＞主動脈壓，半月瓣開，射出心搏量（約 70 ml）</text></g>
<g class="st ivr"><path class="shut" d="M165 210H385"/><path class="shut" d="M470 258v44"/><text class="snd" x="420" y="240">S2</text><text class="tag" x="130" y="265" fill="#a71930">關</text><text class="tag" x="625" y="325" fill="#a71930">關</text><text class="cap" x="400" y="475" text-anchor="middle">等容心室舒張期：兩組瓣膜都關閉，心室壓快速下降（S2）</text></g>
</svg>
