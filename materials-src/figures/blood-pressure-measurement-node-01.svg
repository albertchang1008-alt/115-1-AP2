<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 345" role="img" aria-label="澆花水管比喻"><title>澆花水管比喻</title><style>text{font-family:system-ui,sans-serif;font-size:calc(18px * var(--font-scale,1))}.title{font-weight:700}</style><rect width="400" height="345" rx="14" fill="#fafbfd"/><text x="18" y="30" font-size="18" fill="#17212b" text-anchor="start">澆花水管比喻</text><text x="20" y="65" font-size="18" fill="#17212b" text-anchor="start">捏死 → 沒水</text><path d="M30 95H165l20 10 20-10" fill="none" stroke="#1769aa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="" fill="none" stroke="#1769aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="20" y="160" font-size="18" fill="#17212b" text-anchor="start">稍放鬆 → 斷續噴</text><path d="M30 190H165l20 10 20-10" fill="none" stroke="#1769aa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M215 155h25m15 0h25m15 0h25" fill="none" stroke="#1769aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="20" y="255" font-size="18" fill="#17212b" text-anchor="start">完全放開 → 平順</text><path d="M30 285H165l20 10 20-10" fill="none" stroke="#1769aa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M215 250H355" fill="none" stroke="#1769aa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></svg>