<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-label="胎兒旁路與出生後轉換"><rect width="400" height="450" rx="18" fill="#f5f8fc"/><text x="20" y="32" font-family="system-ui,sans-serif" font-size="18" fill="#17324d">胎兒旁路與出生後轉換</text><text x="25" y="80" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">右心房 ─ 卵圓孔 → 左心房</text><text x="25" y="115" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">出生後：卵圓孔 → 卵圓窩</text><path d="M70 220H160V285H310V220" fill="none" stroke="#bc9135" stroke-width="5" stroke-dasharray="8 5"/><text x="20" y="200" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">肺動脈幹</text><text x="270" y="200" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">主動脈</text><text x="165" y="315" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">動脈導管</text><text x="25" y="365" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">出生後：動脈導管 → 動脈韌帶</text><text x="25" y="410" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">靜脈導管繞過肝臟，不是肺臟</text></svg>
