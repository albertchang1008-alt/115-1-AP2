<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 700" role="img" aria-label="脈搏點位｜圖左＝人體右"><title>脈搏點位｜圖左＝人體右</title><style>text{font-family:system-ui,sans-serif;font-size:calc(18px * var(--font-scale,1))}.title{font-weight:700}</style><rect width="400" height="700" rx="14" fill="#fafbfd"/><text x="18" y="30" font-size="18" fill="#17212b" text-anchor="start">脈搏點位｜圖左＝人體右</text><circle cx="200" cy="82" r="25" fill="#e2e8f0"/><path d="M155 130H245L320 310M155 130L80 310M200 150V350M200 350L150 565M200 350L250 565" fill="none" stroke="#e2e8f0" stroke-width="35" stroke-linecap="round" stroke-linejoin="round" /><text x="20" y="55" font-size="18" fill="#a71930" text-anchor="start">顳動脈</text><path d="M20 61H180V75" fill="none" stroke="#a71930" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="180" cy="75" r="3" fill="#a71930"/><text x="245" y="122" font-size="18" fill="#a71930" text-anchor="start">頸動脈</text><path d="M245 128H215V120" fill="none" stroke="#a71930" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="215" cy="120" r="3" fill="#a71930"/><text x="15" y="205" font-size="18" fill="#a71930" text-anchor="start">肱動脈</text><path d="M15 211H125V200" fill="none" stroke="#a71930" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="125" cy="200" r="3" fill="#a71930"/><text x="245" y="290" font-size="18" fill="#a71930" text-anchor="start">橈動脈</text><path d="M245 296H305V290" fill="none" stroke="#a71930" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="305" cy="290" r="3" fill="#a71930"/><text x="15" y="375" font-size="18" fill="#a71930" text-anchor="start">股動脈</text><path d="M15 381H190V380" fill="none" stroke="#a71930" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="190" cy="380" r="3" fill="#a71930"/><text x="245" y="470" font-size="18" fill="#a71930" text-anchor="start">膕動脈</text><path d="M245 476H233V465" fill="none" stroke="#a71930" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="233" cy="465" r="3" fill="#a71930"/><text x="20" y="590" font-size="18" fill="#a71930" text-anchor="start">足背動脈</text><path d="M20 596H153V560" fill="none" stroke="#a71930" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="153" cy="560" r="3" fill="#a71930"/><text x="15" y="640" font-size="18" fill="#17212b" text-anchor="start">頸：緊急評估；肱：量血壓</text><text x="15" y="670" font-size="18" fill="#17212b" text-anchor="start">橈：常規脈搏；足背：末梢循環</text></svg>