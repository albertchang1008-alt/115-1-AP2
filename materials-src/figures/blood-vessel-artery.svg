<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 505" role="img" aria-label="動脈：擴張、回彈與管徑"><rect width="400" height="505" rx="18" fill="#f5f8fc"/><text x="20" y="32" font-family="system-ui,sans-serif" font-size="18" fill="#17324d">動脈：擴張、回彈與管徑</text><text x="20" y="75" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">大動脈：心室射血時擴張</text><rect x="45" y="95" width="310" height="75" rx="32" fill="#ffe4e5" stroke="#b62d48" stroke-width="8"/><text x="20" y="210" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">心室舒張時回彈，維持血流</text><rect x="45" y="230" width="310" height="45" rx="18" fill="#ffe4e5" stroke="#b62d48" stroke-width="8"/><text x="20" y="320" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">小動脈：平滑肌調節管腔大小</text><circle cx="115" cy="390" r="45" fill="#b62d48"/><circle cx="115" cy="390" r="28" fill="#fff"/><circle cx="285" cy="390" r="45" fill="#b62d48"/><circle cx="285" cy="390" r="12" fill="#fff"/><text x="65" y="465" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">舒張：管腔大</text><text x="230" y="465" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">收縮：管腔小</text></svg>
