<svg xmlns="http://www.w3.org/2000/svg" id="lung-function-node-04" viewBox="0 0 1700 2498" role="img" font-family="PingFang TC,Noto Sans CJK TC,Noto Sans TC,sans-serif" aria-label="肺容積與肺功能"><style>#lung-function-node-04 .label{font-size:calc(66px * var(--font-scale,1));fill:#17212b;stroke:white;stroke-width:8;paint-order:stroke;stroke-linejoin:round}#lung-function-node-04 .focus{fill:#b4233a;color:#b4233a;font-weight:700}#lung-function-node-04 .lead{fill:none;stroke:#444;stroke-width:3}#lung-function-node-04 .halo{stroke:white;stroke-width:10}#lung-function-node-04 .dot{fill:#444;stroke:white;stroke-width:3}#lung-function-node-04 .data-card{font-size:calc(66px * var(--font-scale,1));line-height:1.3;color:#17212b;background:#f5f7f8;padding:20px 30px;border-radius:20px;line-break:strict;word-break:normal;overflow-wrap:normal;hanging-punctuation:allow-end}</style><rect width="100%" height="100%" fill="white"/><text class="label " data-label="每次容積（mL／次）" aria-label="每次容積（mL／次）" x="850" y="111" text-anchor="middle"><tspan x="850" dy="0">每次容積（mL／次）</tspan></text><text class="label " data-label="TV 500 mL" aria-label="TV 500 mL" x="70" y="236" text-anchor="start"><tspan x="70" dy="0">TV 500 mL</tspan></text><rect x="80" y="285" width="1500" height="95" fill="#f1f3f5"/><rect class="data-bar" data-value="500" data-max="500" x="80" y="285" width="1500.0" height="95" fill="#777777"/><text class="label focus" data-label="VD 150 mL" aria-label="VD 150 mL" x="70" y="511" text-anchor="start"><tspan x="70" dy="0">VD 150 mL</tspan></text><rect x="80" y="560" width="1500" height="95" fill="#f1f3f5"/><rect class="data-bar" data-value="150" data-max="500" x="80" y="560" width="450.0" height="95" fill="#999999"/><text class="label " data-label="到達肺泡350 mL" aria-label="到達肺泡350 mL" x="70" y="786" text-anchor="start"><tspan x="70" dy="0">到達肺泡350 mL</tspan></text><rect x="80" y="835" width="1500" height="95" fill="#f1f3f5"/><rect class="data-bar" data-value="350" data-max="500" x="80" y="83