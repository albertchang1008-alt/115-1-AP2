<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 625" role="img" aria-label="動作電位 × 心電圖對齊"><title>動作電位 × 心電圖對齊</title><style>text{font-family:system-ui,sans-serif;font-size:calc(18px * var(--font-scale,1))}.title{font-weight:700}</style><rect width="400" height="625" rx="14" fill="#fafbfd"/><text x="18" y="30" font-size="18" fill="#17212b" text-anchor="start">動作電位 × 心電圖對齊</text><text x="20" y="65" font-size="18" fill="#17212b" text-anchor="start">竇房結節律細胞</text><path d="M30 165Q50 162 85 120L100 90L115 165H380" fill="none" stroke="#b77900" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 120H130" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="135" y="130" font-size="18" fill="#17212b" text-anchor="start">閾值；去極化在 P 之前</text><text x="20" y="210" font-size="18" fill="#17212b" text-anchor="start">心室工作心肌：phase 0–4</text><path d="M30 330H180L190 240L215 255H275L325 330H380" fill="none" stroke="#b77900" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="158" y="310" font-size="18" fill="#17212b" text-anchor="start">0</text><text x="206" y="241" font-size="18" fill="#17212b" text-anchor="start">1</text><text x="245" y="241" font-size="18" fill="#17212b" text-anchor="start">2</text><text x="300" y="285" font-size="18" fill="#17212b" text-anchor="start">3</text><text x="355" y="315" font-size="18" fill="#17212b" text-anchor="start">4</text><text x="20" y="390" font-size="18" fill="#17212b" text-anchor="start">心電圖：同一示意時間軸</text><path d="M30 480H115q12-35 25 0H176l7 20 7-65 7 83 8-38H275q25-45 50 0H380" fill="none" stroke="#b77900" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="120" y="425" font-size="18" fill="#17212b" text-anchor="start">P</text><text x="168" y="420" font-size="18" fill="#17212b" text-anchor="start">QRS</text><text x="235" y="462" font-size="18" fill="#17212b" text-anchor="start">ST</text><text x="297" y="430" font-size="18" fill="#17212b" text-anchor="start">T</text><path d="M190 230V520" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M250 230V520" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><path d="M310 230V520" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="20" y="565" font-size="18" fill="#17212b" text-anchor="start">phase 0 ↔ QRS；phase 2 ↔ ST</text><text x="20" y="595" font-size="18" fill="#17212b" text-anchor="start">phase 3 ↔ T；示意圖，非實測比例</text></svg>