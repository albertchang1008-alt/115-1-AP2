<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 475" role="img" aria-label="靜脈瓣膜與骨骼肌幫浦"><rect width="400" height="475" rx="18" fill="#f5f8fc"/><text x="20" y="32" font-family="system-ui,sans-serif" font-size="18" fill="#17324d">靜脈瓣膜與骨骼肌幫浦</text><text x="105" y="70" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">↑ 血液朝心臟前進</text><rect x="155" y="95" width="90" height="260" fill="#e4efff" stroke="#2d70a7" stroke-width="4"/><path d="M155 245Q190 240 185 190M245 245Q210 240 215 190" fill="none" stroke="#2d70a7" stroke-width="6"/><rect x="70" y="125" width="55" height="190" rx="26" fill="#90b797"/><rect x="275" y="125" width="55" height="190" rx="26" fill="#90b797"/><text x="78" y="345" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">肌肉</text><text x="282" y="345" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">肌肉</text><text x="25" y="400" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">瓣葉向心臟方向開啟，讓血液通過</text><text x="25" y="435" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">肌肉擠壓靜脈；瓣膜減少逆流</text></svg>
