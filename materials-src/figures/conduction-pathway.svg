<text class="cap sa" x="400" y="496" text-anchor="middle">① 竇房結自發放電，衝動擴散到左右心房</text>
<text class="cap av" x="400" y="496" text-anchor="middle">② 房室結傳導最慢（約 0.1 秒延遲），心房先把血擠入心室</text>
<text class="cap ventricle" x="400" y="496" text-anchor="middle">③ 房室束→左右束支→浦金埃氏纖維（最快），心室同步收縮</text>
