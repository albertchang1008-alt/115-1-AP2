<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" style="font-family:system-ui,sans-serif"><rect width="480" height="300" rx="22" fill="#f7f3fa"/><text x="240" y="36" font-size="24" fill="#17212b" text-anchor="middle">Rh 系統</text><rect x="28" y="62" width="424" height="90" rx="12" fill="#fff" stroke="#d8cce5"/><text x="240.0" y="94" font-size="22" fill="#17212b" text-anchor="middle">有 D 抗原 → Rh 陽性</text><text x="240.0" y="124" font-size="22" fill="#17212b" text-anchor="middle">無 D 抗原 → Rh 陰性</text><path d="M240 157 v18" fill="none" stroke="#65428b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M232 168 l8 12 l8 -12" fill="#65428b"/><rect x="28" y="188" width="424" height="90" rx="12" fill="#e4f0f6" stroke="#d8cce5"/><text x="240.0" y="220" font-size="22" fill="#17212b" text-anchor="middle">Rh 陰性通常不天生帶抗 D</text><text x="240.0" y="250" font-size="22" fill="#17212b" text-anchor="middle">接觸 Rh 陽性血後才產生</text></svg>