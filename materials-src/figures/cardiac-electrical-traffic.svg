<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-label="房室結：先等一下再傳下去"><title>房室結：先等一下再傳下去</title><style>text{font-family:system-ui,sans-serif;font-size:calc(18px * var(--font-scale,1))}.title{font-weight:700}</style><rect width="400" height="430" rx="14" fill="#fafbfd"/><text x="18" y="30" font-size="18" fill="#17212b" text-anchor="start">房室結：先等一下再傳下去</text><rect x="25" y="60" width="90" height="235" rx="8" fill="#17212b" stroke="#17212b"/><circle cx="70" cy="105" r="25" fill="#a71930"/><circle cx="70" cy="175" r="25" fill="#b77900"/><circle cx="70" cy="245" r="25" fill="#176b45"/><text x="140" y="100" font-size="18" fill="#17212b" text-anchor="start">紅燈：房室結短暫延遲</text><text x="140" y="135" font-size="18" fill="#17212b" text-anchor="start">心房先把血送進心室</text><text x="140" y="215" font-size="18" fill="#17212b" text-anchor="start">綠燈：接著啟動心室</text><path d="M25 355H375" fill="none" stroke="#b77900" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="25" y="335" font-size="18" fill="#17212b" text-anchor="start">PR 間隔：心房到心室前傳導</text><text x="25" y="400" font-size="18" fill="#17212b" text-anchor="start">紅綠燈只是比喻</text></svg>