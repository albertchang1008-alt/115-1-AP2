<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" role="img" aria-label="拔河：比較外推與內拉"><title>拔河：比較外推與內拉</title><style>text{font-family:system-ui,sans-serif;font-size:calc(18px * var(--font-scale,1))}.title{font-weight:700}</style><rect width="400" height="550" rx="14" fill="#fafbfd"/><text x="18" y="30" font-size="18" fill="#17212b" text-anchor="start">拔河：比較外推與內拉</text><path d="M45 120H355" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="200" cy="120" r="9" fill="#17212b"/><path d="M65 145L100 120L65 95" fill="none" stroke="#8250a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M335 145L300 120L335 95" fill="none" stroke="#8250a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="20" y="70" font-size="18" fill="#8250a0" text-anchor="start">外推：靜水壓 35</text><text x="20" y="200" font-size="18" fill="#8250a0" text-anchor="start">內拉：膠體滲透壓 25</text><text x="20" y="250" font-size="18" fill="#17212b" text-anchor="start">動脈端：向外 10（示意 mmHg）</text><g transform="translate(0 250)"><path d="M45 120H355" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="200" cy="120" r="9" fill="#17212b"/><path d="M65 145L100 120L65 95" fill="none" stroke="#8250a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M335 145L300 120L335 95" fill="none" stroke="#8250a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="20" y="70" font-size="18" fill="#8250a0" text-anchor="start">外推：靜水壓 18</text><text x="20" y="200" font-size="18" fill="#8250a0" text-anchor="start">內拉：膠體滲透壓 25</text><text x="20" y="250" font-size="18" fill="#17212b" text-anchor="start">靜脈端：向內 7（示意 mmHg）</text></g></svg>