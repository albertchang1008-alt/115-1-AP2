<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1270" role="img"><style>text{font-family:system-ui,sans-serif;fill:#24354a;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round} .secondary-response{display:none} [data-state="secondary"] .secondary-response{display:inline}</style><rect width="1200" height="1270" rx="24" fill="#fff"/><path d="M150 150V780H1140" fill="none" stroke="#516b83" stroke-width="5"/><text x="40" y="65" font-size="46" text-anchor="start" >抗體濃度</text><text x="1040" y="850" font-size="46" text-anchor="middle" >時間（天）</text><path d="M240 780V170M655 780V170" stroke="#9eabb8" stroke-dasharray="8 12" stroke-width="3"/><text x="240" y="920" font-size="46" text-anchor="middle" >第一次接觸抗原</text><text x="750" y="990" font-size="46" text-anchor="middle" >第二次接觸同一抗原</text><path class="igm-primary" d="M240 776L280 776C300 776 312 640 355 642S398 773 600 776" fill="none" stroke="#b97529" stroke-width="9" stroke-dasharray="18 12"/><path class="igg-primary" d="M240 776L322 776C350 776 385 665 420 673S480 768 610 775" fill="none" stroke="#24669e" stroke-width="9"/><text x="280" y="600" font-size="46" text-anchor="start" fill="#8b5519">IgM</text><text x="465" y="625" font-size="46" text-anchor="start" fill="#18568c">IgG</text><g class="secondary-response"><path class="igm-secondary" d="M655 775C670 775 685 655 735 648S790 772 1120 774" fill="none" stroke="#b97529" stroke-width="9" stroke-dasharray="18 12"/><path class="igg-secondary" d="M655 775C675 770 690 185 790 175S1010 200 1120 285" fill="none" stroke="#24669e" stroke-width="9"/><text x="925" y="160" font-size="46" text-anchor="start" >IgG</text><text x="780" y="630" font-size="46" text-anchor="start" >IgM</text></g><path class="time-cursor" d="M240 170V780" stroke="#64748b" stroke-width="3" stroke-dasharray="3 7"/><text x="35" y="1110" font-size="46" text-anchor="start" class="time-readout">拖動時間軸：觀察潛伏期與高峰</text><foreignObject x="80" y="1150" width="1040" height="80"><div xmlns="http://www.w3.org/1999/xhtml"><input aria-label="拖動免疫反應時間軸" type="range" min="0" max="100" value="0" style="width:100%;height:60px;accent-color:#24669e" oninput="const s=this.closest(&#x27;svg&#x27;),x=240+8.8*Number(this.value);s.querySelector(&#x27;.time-cursor&#x27;).setAttribute(&#x27;d&#x27;,&#x27;M&#x27;+x+&#x27; 170V780&#x27;);const state=s.closest(&#x27;[data-state]&#x27;)?.dataset.state;s.querySelector(&#x27;.time-readout&#x27;).textContent=x&lt;300?&#x27;潛伏期&#x27;:x&lt;380?&#x27;主要抗體：IgM&#x27;:x&lt;610?&#x27;主要抗體：IgG&#x27;:state===&#x27;secondary&#x27;?(x&lt;685?&#x27;再次反應：潛伏期&#x27;:x&lt;840?&#x27;再次反應：IgG 高峰&#x27;:&#x27;再次反應：IgG 維持&#x27;):&#x27;抗體濃度下降&#x27;;"/></div></foreignObject></svg>