<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 426" role="img" style="font-family:system-ui,sans-serif"><rect width="480" height="426" rx="22" fill="#f7f3fa"/><text x="240" y="36" font-size="24" fill="#17212b" text-anchor="middle">自主神經與心率</text><rect x="28" y="62" width="424" height="90" rx="12" fill="#fff" stroke="#d8cce5"/><text x="240.0" y="94" font-size="22" fill="#17212b" text-anchor="middle">交感作用 → 心率 ↑</text><text x="240.0" y="124" font-size="22" fill="#17212b" text-anchor="middle">迷走／乙醯膽鹼 → 心率 ↓</text><path d="M240 157 v18" fill="none" stroke="#65428b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M232 168 l8 12 l8 -12" fill="#65428b"/><rect x="28" y="188" width="424" height="90" rx="12" fill="#e4f0f6" stroke="#d8cce5"/><text x="240.0" y="220" font-size="22" fill="#17212b" text-anchor="middle">安靜時迷走作用較強</text><text x="240.0" y="250" font-size="22" fill="#17212b" text-anchor="middle">心率低於竇房結自身頻率</text><path d="M240 283 v18" fill="none" stroke="#65428b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M232 294 l8 12 l8 -12" fill="#65428b"/><rect x="28" y="314" width="424" height="90" rx="12" fill="#fff" stroke="#d8cce5"/><text x="240.0" y="346" font-size="22" fill="#17212b" text-anchor="middle">心率極快 → 舒張期縮短</text><text x="240.0" y="376" font-size="22" fill="#17212b" text-anchor="middle">充血時間減少</text></svg>