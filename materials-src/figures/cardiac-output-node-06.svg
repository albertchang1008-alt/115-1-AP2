<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-label="自主神經：油門／煞車"><title>自主神經：油門／煞車</title><style>text{font-family:system-ui,sans-serif;font-size:calc(18px * var(--font-scale,1))}.title{font-weight:700}</style><rect width="400" height="450" rx="14" fill="#fafbfd"/><text x="18" y="30" font-size="18" fill="#17212b" text-anchor="start">自主神經：油門／煞車</text><rect x="20" y="65" width="360" height="105" rx="8" fill="#edf8f0" stroke="#cbd5e1"/><path d="M50 135L70 90H110L130 135Z" fill="none" stroke="#176b45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="145" y="100" font-size="18" fill="#17212b" text-anchor="start">油門：交感節後 NE</text><text x="145" y="133" font-size="18" fill="#176b45" text-anchor="start">心率↑、收縮力↑</text><rect x="20" y="185" width="360" height="105" rx="8" fill="#fff6e8" stroke="#cbd5e1"/><rect x="55" y="220" width="65" height="25" rx="8" fill="#9a5a00" stroke="#9a5a00"/><text x="145" y="220" font-size="18" fill="#17212b" text-anchor="start">煞車：迷走節後 ACh</text><text x="145" y="255" font-size="18" fill="#9a5a00" text-anchor="start">心率↓</text><text x="20" y="325" font-size="18" fill="#17212b" text-anchor="start">另一條油門：腎上腺髓質</text><text x="20" y="353" font-size="18" fill="#17212b" text-anchor="start">腎上腺素經血液 → 心臟</text><text x="20" y="395" font-size="18" fill="#17212b" text-anchor="start">心率過快 → 舒張期縮短</text><text x="20" y="425" font-size="18" fill="#17212b" text-anchor="start">充血不足 → EDV↓ → 心搏量↓</text></svg>