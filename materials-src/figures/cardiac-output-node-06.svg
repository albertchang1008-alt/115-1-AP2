<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 406" role="img"><rect width="480" height="406" rx="20" fill="#f5f0fa"/><text x="240" y="36" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#17212b">自主神經的節後傳導物質</text><rect x="24" y="58" width="432" height="90" rx="12" fill="#fff" stroke="#bba9cb"/><text x="240" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">交感節後末梢 → NE</text><text x="240" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">心率↑、收縮力↑</text><rect x="24" y="176" width="432" height="90" rx="12" fill="#e4eff9" stroke="#bba9cb"/><text x="240" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">副交感／迷走節後末梢 → ACh</text><text x="240" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">主要使心率↓</text><rect x="24" y="294" width="432" height="90" rx="12" fill="#fff" stroke="#bba9cb"/><text x="240" y="326" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">安靜時迷走作用較強</text><text x="240" y="356" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">心率低於竇房結自身頻率</text></svg>