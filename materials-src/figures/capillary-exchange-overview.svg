<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 475" role="img" aria-label="Starling 力量沿微血管變化"><title>Starling 力量沿微血管變化</title><style>text{font-family:system-ui,sans-serif;font-size:calc(18px * var(--font-scale,1))}.title{font-weight:700}</style><rect width="400" height="475" rx="14" fill="#fafbfd"/><text x="18" y="30" font-size="18" fill="#17212b" text-anchor="start">Starling 力量沿微血管變化</text><path d="M55 105L243 165H55Z" fill="#e3f3e7"/><path d="M243 165L375 207V165Z" fill="#edf0f7"/><path d="M55 65V260H375" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="10" y="58" font-size="18" fill="#17212b" text-anchor="start">mmHg</text><path d="M55 105L375 207" fill="none" stroke="#8250a0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M55 165H375" fill="none" stroke="#8250a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 5"/><text x="65" y="90" font-size="18" fill="#8250a0" text-anchor="start">35</text><text x="330" y="237" font-size="18" fill="#8250a0" text-anchor="start">18</text><text x="280" y="153" font-size="18" fill="#8250a0" text-anchor="start">25</text><text x="60" y="290" font-size="18" fill="#17212b" text-anchor="start">動脈端 → 微血管 → 靜脈端</text><text x="65" y="130" font-size="18" fill="#8250a0" text-anchor="start">靜水壓</text><text x="70" y="192" font-size="18" fill="#8250a0" text-anchor="start">膠體滲透壓（虛線）</text><path d="M243 70V260" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="245" y="65" font-size="18" fill="#17212b" text-anchor="start">約 59%</text><g class="arterial"><rect x="20" y="310" width="170" height="65" rx="8" fill="#edf8f0" stroke="#cbd5e1"/><text x="30" y="335" font-size="18" fill="#17212b" text-anchor="start">淨濾出區 ↑</text><text x="30" y="362" font-size="18" fill="#17212b" text-anchor="start">35−25＝外 10</text></g><g class="venous"><rect x="210" y="310" width="170" height="65" rx="8" fill="#edf4ff" stroke="#cbd5e1"/><text x="220" y="335" font-size="18" fill="#17212b" text-anchor="start">淨回收區 ↓</text><text x="220" y="362" font-size="18" fill="#17212b" text-anchor="start">18−25＝內 7</text></g><g class="lymph"><text x="20" y="410" font-size="18" fill="#17212b" text-anchor="start">濾出略多於回收 → 淋巴收走多餘液體</text></g><text x="20" y="450" font-size="18" fill="#17212b" text-anchor="start">示意數值（OpenStax 模型）</text><style>[data-state="state-1"] .venous,[data-state="state-1"] .lymph,[data-state="state-2"] .arterial,[data-state="state-2"] .lymph,[data-state="state-3"] .arterial,[data-state="state-3"] .venous{opacity:.25}</style></svg>