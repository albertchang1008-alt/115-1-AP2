  --deoxy:#5B8BD6; --oxy:#E5606B; --mixed:#A57DD0; --closed:#8E979F;
  --deoxy-soft:#2B3850; --oxy-soft:#4A2C31; --mixed-soft:#3A2F4A; --closed-soft:#3A4148;
  --btn:#5FA39A; --btn-ink:#0F1513; --chip:#26303A; --particle:#F4F6F8;
}
svg[data-blood-v2]{--surface:var(--card)}text{paint-order:stroke;stroke:var(--surface);stroke-width:4;stroke-linejoin:round}.organ{font-size:16.5px;fill:var(--muted);font-weight:500}.orient{font-size:16.5px;fill:var(--muted)}.chamber{font-size:16.5px;fill:var(--chamber);font-weight:500}.chamber.on{fill:var(--ink);font-weight:700}.only-on:not(.on){opacity:0}.callout{font-size:17px;font-weight:700;fill:var(--ink);opacity:0}.callout.on{opacity:1}.callout.muted{fill:var(--muted);font-weight:500}.base,.live{fill:none;stroke-linecap:round;stroke-linejoin:round}.valve{stroke:var(--card);stroke-width:3;stroke-linecap:round;opacity:0}.valve.on{opacity:1}.post-only{opacity:0}.after .pre-only{opacity:0}.after .post-only{opacity:1}text{font-family:system-ui,sans-serif}</style><g data-view="pulm" data-viewbox="0 0 440 470" data-step-meta="{&quot;steps&quot;:[{&quot;t&quot;:&quot;全身 → 右心房&quot;,&quot;d&quot;:&quot;缺氧血經上、下腔靜脈回流（銜接段，淡灰）&quot;,&quot;s&quot;:&quot;AB-05_11 p.11-32&quot;,&quot;p&quot;:[&quot;p-svc&quot;,&quot;p-ivc&quot;],&quot;l&quot;:[&quot;L-svc&quot;,&quot;L-ivc&quot;],&quot;ch&quot;:[&quot;c-ra&quot;]},{&quot;t&quot;:&quot;右心房 → 右心室&quot;,&quot;d&quot;:&quot;經三尖瓣&quot;,&quot;s&quot;:&quot;AB-05_11 p.11-6&quot;,&quot;p&quot;:[&quot;p-ra-rv&quot;],&quot;l&quot;:[&quot;L-tri&quot;],&quot;ch&quot;:[&quot;c-ra&quot;,&quot;c-rv&quot;],&quot;v&quot;:[&quot;v-tri&quot;]},{&quot;t&quot;:&quot;右心室 → 肺動脈幹&quot;,&quot;d&quot;:&quot;經肺動脈半月瓣；動脈裡是缺氧血&quot;,&quot;s&quot;:&quot;AB-05_11 p.11-7；AB-05_11 p.11-19&quot;,&quot;p&quot;:[&quot;p-trunk&quot;],&quot;l&quot;:[&quot;L-trunk&quot;],&quot;ch&quot;:[&quot;c-rv&quot;],&quot;v&quot;:[&quot;v-pul&quot;]},{&quot;t&quot;:&quot;肺動脈幹 → 左、右肺動脈 → 肺臟&quot;,&quot;d&quot;:&quot;肺動脈幹分成左、右肺動脈&quot;,&quot;s&quot;:&quot;AB-05_11 p.11-19&quot;,&quot;p&quot;:[&quot;p-rpa&quot;,&quot;p-rpa-lower&quot;,&quot;p-lpa&quot;,&quot;p-lpa-lower&quot;],&quot;l&quot;:[&quot;L-rpa&quot;,&quot;L-lpa&quot;],&quot;ch&quot;:[]},{&quot;t&quot;:&quot;肺泡周圍微血管&quo