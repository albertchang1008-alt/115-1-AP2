<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" role="img" data-blood-v2="true"><style>
svg[data-blood-v2]{
  --page:#F4F2EE; --card:#FDFCFA; --ink:#1F2A33; --muted:#66727E; --line:#E3DED6;
  --skin:#F3EEE8; --skin-edge:#E2D7CB;
  --lung:#F6E3DE; --lung-edge:#DDB3AA; --heart:#F0CFC9; --heart-edge:#C98D85; --chamber:#9C6A63;
  --liver:#EBD3C4; --liver-edge:#CDA58E; --brain:#F3E1DC; --brain-edge:#D6B2A9; --placenta:#EBC9CF; --bladder:#F1E2C9; --bladder-edge:#D3BB91;
  --airway:#DCE4DF; --airway-in:#F1F4F2;
  --deoxy:#2E5FA8; --oxy:#C9333F; --mixed:#7B4FA6; --closed:#8E979F;
  --deoxy-soft:#D3DDEE; --oxy-soft:#F1D2D5; --mixed-soft:#E2D6EE; --closed-soft:#D9DDE0;
  --btn:#2D5C55; --btn-ink:#FFFFFF; --chip:#E8ECEA; --particle:#FFFFFF;
}
@media (prefers-color-scheme: dark){
