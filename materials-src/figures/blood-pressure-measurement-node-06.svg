<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 435" role="img" aria-label="血液柱高度與判讀"><title>血液柱高度與判讀</title><style>text{font-family:system-ui,sans-serif;font-size:calc(18px * var(--font-scale,1))}.title{font-weight:700}</style><rect width="400" height="435" rx="14" fill="#fafbfd"/><text x="18" y="30" font-size="18" fill="#17212b" text-anchor="start">血液柱高度與判讀</text><circle cx="65" cy="160" r="7" fill="#a71930"/><path d="M65 160L100 90" fill="none" stroke="#8250a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="30" y="295" font-size="18" fill="#17212b" text-anchor="start">高於</text><text x="30" y="325" font-size="18" fill="#9a5a00" text-anchor="start">偏低 ↓</text><circle cx="195" cy="160" r="7" fill="#a71930"/><path d="M195 160L230 170" fill="none" stroke="#8250a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="160" y="295" font-size="18" fill="#17212b" text-anchor="start">等於</text><text x="160" y="325" font-size="18" fill="#176b45" text-anchor="start">正確</text><circle cx="325" cy="160" r="7" fill="#a71930"/><path d="M325 160L360 250" fill="none" stroke="#8250a0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="290" y="295" font-size="18" fill="#17212b" text-anchor="start">低於</text><text x="290" y="325" font-size="18" fill="#9a5a00" text-anchor="start">偏高 ↑</text><path d="M15 160H385" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><text x="15" y="55" font-size="18" fill="#17212b" text-anchor="start">手臂相對心臟高度影響讀值</text><text x="15" y="370" font-size="18" fill="#17212b" text-anchor="start">120／80 → 脈壓＝40 mmHg</text><text x="15" y="405" font-size="18" fill="#17212b" text-anchor="start">MAP ≈ 80＋40÷3 ≈ 93 mmHg</text></svg>