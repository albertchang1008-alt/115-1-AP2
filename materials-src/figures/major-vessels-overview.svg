"18" fill="#17212b" text-anchor="start">胃的回程先經肝門靜脈 → 肝臟</text><circle cx="265" cy="300" r="13" fill="#9a5a00"/><text x="285" y="307" font-size="18" fill="#17212b" text-anchor="start">肝臟</text><style>[data-state="right-hand"] .route:not(.right-hand){opacity:.13}[data-state="left-hand"] .route:not(.left-hand){opacity:.13}[data-state="left-foot"] .route:not(.left-foot){opacity:.13}[data-state="stomach"] .route:not(.stomach){opacity:.13}</style></svg>