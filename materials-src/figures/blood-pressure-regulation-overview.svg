<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-label="血壓的調控｜情境比較"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5b3b8c"/></marker></defs><rect width="400" height="460" rx="18" fill="#f5f0fa"/><text x="200" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#17212b">血壓的調控｜情境比較</text><g data-panel="high"><rect x="25" y="58" width="350" height="52" rx="16" fill="#fff" stroke="#bba9cb"/><text x="200" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">血壓 ↑</text><path d="M200 112L200 130" fill="none" stroke="#5b3b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="134" width="350" height="52" rx="16" fill="#e4eff9" stroke="#bba9cb"/><text x="200" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">受器訊號 ↑</text><path d="M200 188L200 206" fill="none" stroke="#5b3b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="210" width="350" height="52" rx="16" fill="#fff" stroke="#bba9cb"/><text x="200" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">延腦 → 交感 ↓</text><path d="M200 264L200 282" fill="none" stroke="#5b3b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="286" width="350" height="52" rx="16" fill="#e4eff9" stroke="#bba9cb"/><text x="200" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">心率 ↓／血管舒張</text><path d="M200 340L200 358" fill="none" stroke="#5b3b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="362" width="350" height="52" rx="16" fill="#fff" stroke="#bba9cb"/><text x="200" y="394" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">負回饋：血壓回降</text></g><g data-panel="low"><rect x="25" y="58" width="350" height="52" rx="16" fill="#fff" stroke="#bba9cb"/><text x="200" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">血壓 ↓</text><path d="M200 112L200 130" fill="none" stroke="#5b3b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="134" width="350" height="52" rx="16" fill="#e4eff9" stroke="#bba9cb"/><text x="200" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">受器訊號 ↓</text><path d="M200 188L200 206" fill="none" stroke="#5b3b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="210" width="350" height="52" rx="16" fill="#fff" stroke="#bba9cb"/><text x="200" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">延腦 → 交感 ↑</text><path d="M200 264L200 282" fill="none" stroke="#5b3b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="286" width="350" height="52" rx="16" fill="#e4eff9" stroke="#bba9cb"/><text x="200" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">心輸出量 ↑／阻力 ↑</text><path d="M200 340L200 358" fill="none" stroke="#5b3b8c" stroke-width="3" marker-end="url(#arrow)"/><rect x="25" y="362" width="350" height="52" rx="16" fill="#fff" stroke="#bba9cb"/><text x="200" y="394" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">負回饋：血壓回升</text></g><g data-panel="volume"><text x="200" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#17212b">體液調節：兩個相反方向</text><rect x="12" y="90" width="178" height="250" rx="14" fill="#fff" stroke="#bba9cb"/><text x="101" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#17212b">保留體液</text><text x="101" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">醛固酮保鈉</text><text x="101" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">ADH 保水</text><text x="101" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">尿中流失減少</text><text x="101" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">血容量維持／↑</text><rect x="210" y="90" width="178" height="250" rx="14" fill="#fff" stroke="#bba9cb"/><text x="299" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#17212b">排出體液</text><text x="299" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">ANP／BNP</text><text x="299" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">排鈉、利尿↑</text><text x="299" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">血容量↓</text><text x="299" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">回心血量↓</text><text x="200" y="377" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">排出方向：回心血量↓ → CO↓</text><text x="200" y="410" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#17212b">血壓傾向↓；仍有其他補償機制</text></g></svg>
