<svg xmlns="http://www.w3.org/2000/svg" id="breathing-mechanics-node-05" viewBox="0 0 1700 5828" role="img" font-family="PingFang TC,Noto Sans CJK TC,Noto Sans TC,sans-serif" aria-label="肺通氣與呼吸力學"><style>#breathing-mechanics-node-05 .label{font-size:calc(66px * var(--font-scale,1));fill:#17212b;stroke:white;stroke-width:8;paint-order:stroke;stroke-linejoin:round}#breathing-mechanics-node-05 .focus{fill:#b4233a;color:#b4233a;font-weight:700}#breathing-mechanics-node-05 .lead{fill:none;stroke:#444;stroke-width:3}#breathing-mechanics-node-05 .halo{stroke:white;stroke-width:10}#breathing-mechanics-node-05 .dot{fill:#444;stroke:white;stroke-width:3}#breathing-mechanics-node-05 .data-card{font-size:calc(66px * var(--font-scale,1));line-height:1.3;color:#17212b;background:#f5f7f8;padding:20px 30px;border-radius:20px;line-break:strict;word-break:normal;overflow-wrap:normal;hanging-punctuation:allow-end}</style><rect width="100%" height="100%" fill="white"/><text class="label " data-label="正常" aria-label="正常" x="850" y="111" text-anchor="middle"><tspan x="850" dy="0">正常</tspan></text><svg x="425" y="192.88" width="850.0" height="1275.7191201353637" viewBox="0 0 591 887" overflow="hidden"><use href="#breathing-mechanics-plate-05"/></svg><text class="label " data-label="肺氣腫" aria-label="肺氣腫" x="850" y="1614.5991201353636" text-anchor="middle"><tspan x="850" dy="0">肺氣腫</tspan></text><svg x="425" y="1696.4791201353637" width="850.0" height="1275.7191201353637" viewBox="591 0 591 887" overflow="hidden"><use href="#breathing-mechanics-plate-05"/></svg><foreignObject x="50" y="3052.198240270727" width="1600" height="153"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="順應性增加" class="focus">順應性增加</span></div></foreignObject><foreignObject x="50" y="3230.198240270727" width="1600" height="153"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="回縮變差" class="focus">回縮變差</span></div></foreignObject><foreignObject x="50" y="3408.198240270727" width="1600" height="153"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="氣體滯留" class="">氣體滯留</span></div></foreignObject><foreignObject x="50" y="3586.198240270727" width="1600" height="153"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="肺餘容積增加" class="">肺餘容積增加</span></div></foreignObject><text class="label " data-label="纖維化" aria-label="纖維化" x="850" y="3830.198240270727" text-anchor="middle"><tspan x="850" dy="0">纖維化</tspan></text><svg x="425" y="3912.0782402707273" width="850.0" height="1273.5641891891892" viewBox="1182 0 592 887" overflow="hidden"><use href="#breathing-mechanics-plate-05"/></svg><foreignObject x="50" y="5265.6424294599165" width="1600" height="153"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="順應性降低" class="focus">順應性降低</span></div></foreignObject><foreignObject x="50" y="5443.6424294599165" width="1600" height="329"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="肺氣腫肺泡壁破壞，順應性增加但回縮變差，盡力呼氣後氣體滯留、肺餘容積增加；纖維化順應性降低，需要較大壓力才能擴張。" class="">肺氣腫肺泡壁破壞，順應性增加但回縮變差，盡力呼氣後氣體滯留、肺餘容積增加；纖維化順應性降低，需要較大壓力才能擴張。</span></div></foreignObject></svg>