<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Frank-Starling：彈簧三格"><title>Frank-Starling：彈簧三格</title><style>text{font-family:system-ui,sans-serif;font-size:calc(18px * var(--font-scale,1))}.title{font-weight:700}</style><rect width="400" height="500" rx="14" fill="#fafbfd"/><text x="18" y="30" font-size="18" fill="#17212b" text-anchor="start">Frank-Starling：彈簧三格</text><text x="20" y="65" font-size="18" fill="#17212b" text-anchor="start">1. 拉一點</text><path d="M35 90 L45.8 77 L56.7 103 L67.5 77 L78.3 103 L89.2 77 L100.0 103 L110.8 77 L121.7 103 L132.5 77 L143.3 103 L154.2 77 L165.0 103" fill="none" stroke="#176b45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="20" y="135" font-size="18" fill="#17212b" text-anchor="start">回彈小：收縮較弱</text><text x="20" y="200" font-size="18" fill="#17212b" text-anchor="start">2. 拉多一點</text><path d="M35 225 L55.8 212 L76.7 238 L97.5 212 L118.3 238 L139.2 212 L160.0 238 L180.8 212 L201.7 238 L222.5 212 L243.3 238 L264.2 212 L285.0 238" fill="none" stroke="#176b45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="20" y="270" font-size="18" fill="#17212b" text-anchor="start">回彈大：心搏量↑</text><text x="20" y="335" font-size="18" fill="#17212b" text-anchor="start">3. 拉過頭</text><path d="M185 342l18 36m-18 0 18-36" fill="none" stroke="#9a5a00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M35 360l25-13 25 26 25-26 25 26 25-13 M225 360l20-13 20 26 20-26 20 13" fill="none" stroke="#9a5a00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="20" y="405" font-size="18" fill="#17212b" text-anchor="start">像被拉斷，彈不回來</text><text x="20" y="475" font-size="18" fill="#9a5a00" text-anchor="start">超出生理範圍，收縮反而變弱</text></svg>