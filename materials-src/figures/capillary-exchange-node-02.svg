<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 345" role="img" aria-label="通過管壁的三種情形"><title>通過管壁的三種情形</title><style>text{font-family:system-ui,sans-serif;font-size:calc(18px * var(--font-scale,1))}.title{font-weight:700}</style><rect width="400" height="345" rx="14" fill="#fafbfd"/><text x="18" y="30" font-size="18" fill="#17212b" text-anchor="start">通過管壁的三種情形</text><rect x="40" y="100" width="140" height="70" rx="8" fill="#fdeaea" stroke="#cbd5e1"/><rect x="200" y="100" width="160" height="70" rx="8" fill="#fdeaea" stroke="#cbd5e1"/><text x="45" y="92" font-size="18" fill="#17212b" text-anchor="start">內皮細胞</text><text x="45" y="200" font-size="18" fill="#17212b" text-anchor="start">脂溶性 ↓ 穿過細胞</text><path d="M85 60V180" fill="none" stroke="#176b45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M190 65V220" fill="none" stroke="#1769aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="180" y="247" font-size="18" fill="#17212b" text-anchor="start">水、小分子 ↓</text><text x="180" y="275" font-size="18" fill="#17212b" text-anchor="start">走細胞間隙</text><circle cx="310" cy="65" r="13" fill="#8250a0"/><path d="M300 84l20 20m-20 0 20-20" fill="none" stroke="#9a5a00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="30" y="320" font-size="18" fill="#17212b" text-anchor="start">血漿蛋白：通常留在血管內</text></svg>