<svg xmlns="http://www.w3.org/2000/svg" id="lung-function-node-05" viewBox="0 0 1700 3076" role="img" font-family="PingFang TC,Noto Sans CJK TC,Noto Sans TC,sans-serif" aria-label="肺容積與肺功能"><style>#lung-function-node-05 .label{font-size:calc(66px * var(--font-scale,1));fill:#17212b;stroke:white;stroke-width:8;paint-order:stroke;stroke-linejoin:round}#lung-function-node-05 .focus{fill:#b4233a;color:#b4233a;font-weight:700}#lung-function-node-05 .lead{fill:none;stroke:#444;stroke-width:3}#lung-function-node-05 .halo{stroke:white;stroke-width:10}#lung-function-node-05 .dot{fill:#444;stroke:white;stroke-width:3}#lung-function-node-05 .data-card{font-size:calc(66px * var(--font-scale,1));line-height:1.3;color:#17212b;background:#f5f7f8;padding:20px 30px;border-radius:20px;line-break:strict;word-break:normal;overflow-wrap:normal;hanging-punctuation:allow-end}</style><rect width="100%" height="100%" fill="white"/><foreignObject x="50" y="45" width="1600" height="153"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="淺快150×40" class="">淺快150×40</span></div></foreignObject><text class="label " data-label="每分鐘通氣量（mL/min）" aria-label="每分鐘通氣量（mL/min）" x="850" y="289" text-anchor="middle"><tspan x="850" dy="0">每分鐘通氣量（mL/min）</tspan></text><text class="label " data-label="總通氣6000 mL/min" aria-label="總通氣6000 mL/min" x="70" y="414" text-anchor="start"><tspan x="70" dy="0">總通氣6000 mL/min</tspan></text><rect x="80" y="463" width="1500" height="95" fill="#f1f3f5"/><rect class="data-bar" data-value="6000" data-max="6000" x="80" y="463" width="1500.0" height="95" fill="#333333"/><text class="label focus" data-label="肺泡通氣0 mL/min" aria-label="肺泡通氣0 mL/min" x="70" y="689" text-anchor="start"><tspan x="70" dy="0">肺泡通氣0 mL/min</tspan></text><rect x="80" y="738" width="1500" height="95" fill="#f1f3f5"/><rect class="data-bar" data-value="0" data-max="6000" x="80" y="738" width="0.0" height="95" fill="#777777"/><foreignObject x="50" y="898" width="1600