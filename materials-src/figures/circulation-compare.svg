<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 295" role="img" aria-label="雙循環的比較"><rect width="400" height="295" rx="18" fill="#f5f8fc"/><text x="20" y="32" font-family="system-ui,sans-serif" font-size="18" fill="#17324d">雙循環的比較</text><g><rect x="40" y="58" width="320" height="50" rx="12" fill="#ffe9e9"/><text x="55" y="89" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">體循環：壓力與阻力較高</text><text x="188" y="128" font-family="system-ui,sans-serif" font-size="20" fill="#17324d">↓</text></g><g><rect x="40" y="133" width="320" height="50" rx="12" fill="#e8effa"/><text x="55" y="164" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">肺循環：壓力與阻力較低</text><text x="188" y="203" font-family="system-ui,sans-serif" font-size="20" fill="#17324d">↓</text></g><g><rect x="40" y="208" width="320" height="50" rx="12" fill="#ffe9e9"/><text x="55" y="239" font-family="system-ui,sans-serif" font-size="16" fill="#17324d">兩者串聯，穩定狀態總流量相同</text></g></svg>
