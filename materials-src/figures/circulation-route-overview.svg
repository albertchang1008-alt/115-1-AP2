<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900" role="img" aria-label="肺體循環與肝門脈冠狀支線"><rect width="400" height="900" rx="18" fill="#f5f8fc"/>
<g class="pulmonary"><rect x="90" y="20" width="220" height="70" rx="18" fill="#e7f3ee"/><text x="145" y="60" font-family="system-ui" font-size="16" fill="#17324d">肺泡微血管</text><path data-route="pulmonary-artery" d="M90 278H65V55H90" fill="none" stroke="#3175ad" stroke-width="5"/><path data-route="pulmonary-vein" d="M310 55H335V170H300" fill="none" stroke="#bc304c" stroke-width="5"/><text x="12" y="120" font-family="system-ui" font-size="16" fill="#17324d">肺動脈 ↑</text><text x="272" y="120" font-family="system-ui" font-size="16" fill="#17324d">肺靜脈 ↓</text></g>
<rect x="90" y="140" width="220" height="150" rx="15" fill="#ffe7e8" stroke="#b75465" stroke-width="3"/><path d="M200 140V290M90 215H310" stroke="#b75465" stroke-width="2"/><text x="105" y="180" font-family="system-ui" font-size="16" fill="#17324d">右心房</text><text x="215" y="180" font-family="system-ui" font-size="16" fill="#17324d">左心房</text><text x="105" y="255" font-family="system-ui" font-size="16" fill="#17324d">右心室</text><text x="215" y="255" font-family="system-ui" font-size="16" fill="#17324d">左心室</text>
<path d="M145 190V230M255 190V230" fill="none" stroke="#17324d" stroke-width="3"/><text x="137" y="222" font-size="18">↓</text><text x="247" y="222" font-size="18">↓</text>
<g class="systemic"><path d="M255 265V345H335V440H310" fill="none" stroke="#bc304c" stroke-width="5"/><path d="M90 440H35V170H105" fill="none" stroke="#3175ad" stroke-width="5"/><text x="270" y="390" font-family="system-ui" font-size="16" fill="#17324d">主動脈 ↓</text><text x="44" y="390" font-family="system-ui" font-size="16" fill="#17324d">腔靜脈 ↑</text><rect x="90" y="415" width="220" height="60" rx="16" fill="#e7f3ee"/><text x="123" y="451" font-family="system-ui" font-size="16" fill="#17324d">全身組織微血管</text></g>
<g class="special"><path data-route="coronary-artery" d="M255 310H350V275H310" fill="none" stroke="#bc304c" stroke-width="5"/><text x="30" y="365" font-family="system-ui" font-size="16" fill="#17324d">冠狀動脈由主動脈根部分布到心肌</text><rect x="30" y="510" width="340" height="65" rx="15" fill="#fff0d9"/><text x="50" y="548" font-family="system-ui" font-size="16" fill="#17324d">消化道微血管：吸收養分</text><path d="M200 575V615" stroke="#3175ad" stroke-width="5"/><text x="215" y="605" font-family="system-ui" font-size="16" fill="#17324d">肝門靜脈 ↓</text><rect x="90" y="620" width="220" height="65" rx="15" fill="#e5d2b9"/><text x="140" y="657" font-family="system-ui" font-size="16" fill="#17324d">肝臟微血管</text><path d="M200 685V730" stroke="#3175ad" stroke-width="5"/><text x="215" y="715" font-family="system-ui" font-size="16" fill="#17324d">肝靜脈 ↓</text><rect x="80" y="735" width="240" height="60" rx="15" fill="#e4efff"/><text x="100" y="770" font-family="system-ui" font-size="16" fill="#17324d">下腔靜脈 → 右心房</text></g><text x="25" y="835" font-family="system-ui" font-size="16" fill="#17324d">紅：充氧血　藍：缺氧血</text><text x="25" y="870" font-family="system-ui" font-size="16" fill="#17324d">路線示意；各箭頭表示血流方向</text></svg>
