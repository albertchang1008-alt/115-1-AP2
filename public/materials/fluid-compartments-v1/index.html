}
html,
body {

}
body {

}
button {

  border: 1px solid #adc8d6;
  border-radius: 10px;
  background: #fff;
  padding: 10px 14px;
  cursor: pointer;
  min-width: 0;
  overflow-wrap: anywhere;
}
button:hover {
  border-color: #317c99;
}
button:focus-visible {
  outline: 3px solid #d4a428;
  outline-offset: 2px;
}
button:disabled {
  opacity: 0.6;

}
.selected {

}
.wrong {

}
h1 {

  line-height: 1.35;
}
h2 {
  font-size: 22px;
  line-height: 1.4;
}
.student-screen {
  height: 100dvh;
  min-height: 0;
  max-width: 1440px;
  margin: auto;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 10px;
  padding: 14px;
}
.student-header {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.heading-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.heading-row h1 {
  flex: 1;
}
.heading-row button {
  flex: none;
  font-size: 16px;
  padding: 6px 10px;
}
.recognition {
  background: #e5f2f7;
  border-left: 4px solid #669bac;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 15px;
  line-height: 1.45;
  display: grid;
  gap: 4px;
}
.hint-box {
  background: #fff6d9;
  border: 1px solid #e2ca7e;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 17px;
  line-height: 1.4;
}
.student-main {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  gap: 14px;
}
.diagram-region {
  min-height: 0;
  min-width: 0;
  background: #fff;
  border: 1px solid #d1e1e9;
  border-radius: 16px;
  padding: 12px;
  display: flex;
  align-items: stretch;
  justify-content: center;
}
.response-region {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 16px;
  padding: 8px 8px 90px;
}
.response-region:empty {
  display: none;
}
.student-main:has(.response-region:empty) {
  grid-template-columns: 1fr;
}
.student-footer {
  min-height: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding-right: 90px;
  font-size: 17px;
}
.student-footer button,
#start,
#enter-assessment {
  background: #19576d;
  color: #fff;
  font-weight: 700;
  padding: 10px 26px;
}
.match-layout {
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 10px;
  width: 100%;
  min-height: 0;
}
.match-board {
  position: relative;
  min-height: 0;
}
.student-svg {
  width: 100%;
  height: 100%;
  display: block;
  position: absolute;
  inset: 0;
}
.work-slot {
  position: absolute;
  left: 5%;
  width: 90%;
  display: flex;
  align-items: center;
  justify-content: space-around;
  gap: 12px;
  background: transparent;
  border: 1px dashed #a3c3d0;
  font-size: 17px;
  padding: 8px;
  line-height: 1.35;
}
.work-slot strong {
  color: #166783;
  font-weight: 700;

}
.card-tray {
  display: flex;

  justify-content: center;
}
.card-tray button {

}
.answer-options {

}

}
.script-feedback {

}
.script-feedback.error {

  background: #fff1f4;
}
.script-feedback.success {

}
.science-board {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 0;
}
.science-label {
  position: absolute;
  left: 35%;
  top: 40%;
  width: 30%;

}
.science-control {

  left: 12%;

  text-align: center;
}

  width: 100%;
}
.column-labels {
  position: absolute;
  top: 3%;
  left: 1%;
  right: 1%;

  grid-template-columns: 29fr 30fr 29fr;
  gap: 5%;

}
.reaction-labels {

  grid-template-columns: 1fr 1fr;
  align-items: center;
  text-align: center;
  font-weight: 700;
  font-size: 20px;
}
[data-arrow] {
  cursor: pointer;
}
.arrow-wrong rect {
  fill: #fff0f4;
  stroke: #c32b49;
  stroke-width: 0.6;
}
[data-svg-label] {
  paint-order: stroke;
  stroke: #fff;
  stroke-width: 1.1;
  stroke-linejoin: round;
  fill: #174b60;
  pointer-events: none;
}
.thick {
  stroke-width: 3;
}
.animate-flow {
  stroke-dasharray: 3 1;
  animation: s-flow 0.8s linear 1;
}
@keyframes s-flow {
  from {
    stroke-dashoffset: 15;
  }
  to {
    stroke-dashoffset: 0;
  }
}
.arrow-hint-ring {
  fill: none;
  stroke: #267991;
  stroke-width: 1.2;
  animation: ringPulse 1.5s ease-out infinite;
  pointer-events: none;
}
@keyframes ringPulse {
  0% {
    r: 3;
    opacity: 1;
    stroke-width: 1.5;
  }
  100% {
    r: 8;
    opacity: 0;
    stroke-width: 0.5;
  }
}
.arrow-badge-bg {
  pointer-events: none;
}
.quiz-note {
  font-size: 16px;
  line-height: 1.4;
  font-weight: 700;
  color: #175260;
  background: #eaf5f8;
  border: 1px solid #b8dbe5;
  border-radius: 9px;

}
.student-dock {

.script-map {
  position: relative;

  height: 100%;

}
.script-map svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.intro-screen {

}
.reaction-labels.formed {

.reaction-form {

/* Matching: compact role rows, explicit menus, no drag-and-drop or answer exposure. */
.matching-ui {
  display: grid;
  gap: 8px;
  min-width: 0;
}
.matching-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: calc(14px * var(--font-scale, 1));
}
.matching-tools button {
  padding: 6px 9px;
}
.matching-row {
  display: grid;
  grid-template-columns: minmax(72px, 0.45fr) minmax(0, 1.55fr);
  gap: 6px;
  padding: 5px;
  border: 1px solid #c1d6df;
  border-radius: 10px;
  background: #fff;
}
.matching-row button {
  min-height: 44px;
  padding: 6px;
  font-size: calc(15px * var(--font-scale, 1));
  text-align: left;
}
.matching-rows {
  display: grid;
  gap: 6px;
}
.matching-row small {
  grid-column: 1/-1;
  font-size: calc(14px * var(--font-scale, 1));
}
.matching-row.fixed {
  border-color: #27836a;
  background: #edf8f2;
}
.active-row {
  outline: 3px solid #b58920;
}
.matching-reference {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-around;
  gap: 8px;
}
.reference-block {
  flex: 1;
  border: 2px solid #a7c8d6;
  border-radius: 18px;
  padding: 20px 6px;
  text-align: center;
  background: #eff6fa;
  font-size: calc(16px * var(--font-scale, 1));
}
.reference-block.lit {
  background: #dcf5df;
  border-color: #27836a;
  box-shadow: 0 0 12px #6bbb86;
}
.matching-guide {
  background: #fff5d5;
  border: 2px solid #c79826;
  border-radius: 10px;
  padding: 8px;
  font-size: calc(14px * var(--font-scale, 1));
}
.matching-guide > div {
  display: flex;
  gap: 6px;
  margin-top: 5px;
}
.matching-guide button {
  padding: 5px 8px;
}
.guide-1 .matching-row > button:first-child {
  outline: 2px solid #b58920;
}
.guide-1 .matching-row > button:nth-child(2) {
  opacity: 0.6;
}
.match-overlay {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: #163a4c88;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
}
.matching-menu {
  width: min(560px, 100%);
  display: grid;
  gap: 8px;
  background: white;
  border-radius: 14px;
  border: 2px solid #397b91;
  padding: 14px;
}
.matching-menu button {
  text-align: left;
  font-size: calc(16px * var(--font-scale, 1));
  min-height: 44px;
}
.matching-menu small {
  display: block;
  font-size: calc(14px * var(--font-scale, 1));
  color: #596f7b;
}
.matching-instruction {
  font-size: calc(16px * var(--font-scale, 1));
  font-weight: bold;
}

.matching-swap {
  grid-column: 1 / -1;
  padding: 4px;
  background: #fff9e7;
  border-radius: 8px;
}

/* In-page choice menus: the active row expands, so phones keep the reference diagram. */
.matching-row .matching-menu, .matching-feedback { grid-column: 1 / -1; width: 100%; }
.matching-row .matching-menu { padding: 6px; gap: 5px; }
.matching-rows.picking .matching-row:not(.active-row) { display: none; }
.matching-feedback { font-size: 14px; line-height: 1.25; }
.matching-screen .diagram-region { flex-shrink: 0; }

.matching-row.wrong > small { display: none; }
.matching-row.wrong > [data-match-open] { display:none; }
.matching-row.wrong > .matching-feedback { grid-column:2;grid-row:1;align-self:center; }

.acid-teacher-reference {position:relative;flex:1;min-height:0;width:100%;}
.acid-teacher-reference .teacher-svg {position:absolute;inset:0;width:100%;height:100%;}
.diagram-region:has(.acid-teacher-reference) {display:flex;flex-direction:column;gap:6px;}

    .map((id, row) => {
      const fixed = m.locked.includes(row),
        value = m.values[row],
        active = ui.openRow === row;
      const menu =
        active && !ui.pendingSwap
          ? `<section class="matching-menu" aria-label="選擇工作說明">${m.order
              .map((value) => {
                const used = n.unique === false ? -1 : m.values.findIndex((v) => v === value);
                return `<button data-match-choice="${value}">${txt(n.slots[value])}${used >= 0 && used !== row ? `<small>${mi('used')} ${txt(n.cards[used])}</small>` : ''}</button>`;
              })
              .join('')}${button('match-close', mi('cancel'))}</section>`
          : '';
      return `<div class="matching-row ${errors.includes(row) ? 'wrong' : ''} ${fixed ? 'fixed' : ''} ${active ? 'active-row' : ''}">
      <button data-match-role="${row}" ${fixed ? 'disabled' : ''} aria-expanded="${active}">${txt(id)}</button>
      <button data-match-open="${row}" ${fixed ? 'disabled' : ''} aria-expanded="${active}">${value === null ? mi('pick') : txt(n.slots[value])}</button>
      ${errors.includes(row) ? `<small>${mi('wrong')}</small><p class="matching-feedback" data-row-feedback="${row}">${(m.feedback?.[row] || []).map(txt).join(' ')}</p>` : ''}${menu}
      ${ui.pendingSwap?.row === row ? `<div class="matching-swap" role="status"><p>${mi('used')} ${txt(n.cards[ui.pendingSwap.other])}</p>${button('match-swap', mi('swap'))}${button('match-cancel', mi('cancel'))}</div>` : ''}</div>`;
    })
    .join('');
  return `<section class="matching-ui"><div class="matching-tools">${mi('progress' + count)}${button('match-help', mi('help'))}</div>${guide}<div class="matching-rows guide-${ui.guideStep || 0} ${ui.openRow !== null && !ui.pendingSwap ? 'picking' : ''}">${rows}</div>${!m.complete && !retry ? `<button id="match-check" ${count < n.cards.length ? 'disabled' : ''}>${mi('check')}</button>` : m.complete ? `<p role="status">${mi('correct')}</p>` : ''}</section>`;
}
function bindStudentMatching({ n, m, ui, render, save, closeGuide, onCheck }) {
  const by = (id) => document.getElementById(id);
  const close = () => {
    ui.pendingSwap = null;
    ui.openRow = null;
    if (ui.guideStep === 2) ui.guideStep = 1;
    render();
  };
  document.querySelectorAll('[data-match-role],[data-match-open]').forEach(
    (b) =>
      (b.onclick = () => {
        const row = Number(b.dataset.matchRole ?? b.dataset.matchOpen);
        if (m.locked.includes(row)) return;
        ui.openRow = row;
        ui.pendingSwap = null;
        if (ui.guideStep === 1) ui.guideStep = 2;
        render();
        by('match-close')?.focus();
      }),
  );
  document.querySelectorAll('[data-match-choice]').forEach(
    (b) =>
      (b.onclick = () => {
        const value = Number(b.dataset.matchChoice),
          other = n.unique === false ? -1 : m.values.findIndex((v) => v === value);
        if (other >= 0 && other !== ui.openRow) {
          ui.pendingSwap = { row: ui.openRow, other, value };
          render();
          by('match-swap')?.focus();
          return;
        }
        m.values[ui.openRow] = value;
        ui.openRow = null;
        if (ui.guideStep === 2) ui.guideStep = 3;
        save();
        render();
      }),
  );
  if (by('match-swap'))
    by('match-swap').onclick = () => {
      const { row, other, value } = ui.pendingSwap;
      if (m.locked.includes(other)) return;
      m.values[other] = m.values[row];
      m.values[row] = value;
      ui.pendingSwap = null;
      ui.openRow = null;
      if (ui.guideStep === 2) ui.guideStep = 3;
      save();
      render();
    };
  for (const id of ['match-cancel', 'match-close']) if (by(id)) by(id).onclick = close;
  if (by('match-help'))
    by('match-help').onclick = () => {
      ui.guideStep = m.complete ? 3 : 1;
      render();
    };
  for (const id of ['match-skip', 'match-understood']) if (by(id)) by(id).onclick = closeGuide;
  if (by('match-check'))
    by('match-check').onclick = () => {
      if (m.values.some((v) => v === null)) return;
      const wrong = m.values
        .map((v, row) => (v !== (n.expected?.[row] ?? row) ? row : -1))
        .filter((v) => v >= 0);
      m.complete = !wrong.length;
      m.locked = m.complete ? n.cards.map((_, row) => row) : [];
      ui.guideStep = null;
      onCheck(wrong);
    };
  document.querySelector('.matching-menu')?.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') close();
  });
}

// All coordinates use the original raster frame, then project through the crop.
function teacherPoint(asset, label, index) {
  const aliases = {'環較長':'長環','環較短':'短環','足細胞（鮑氏囊臟層）':'足細胞','腎盂交接處':'腎盂交接','髂外動脈及靜脈交叉處':'髂外血管交叉','進入膀胱處':'進入膀胱','粒子多的一邊':'粒子較多','粒子少的一邊':'粒子較少','打開 ANP 開關，觀察腎臟的變化。':'ANP'};
  const point = asset.positions?.[index] || asset.anchors[aliases[label] || label];
  if (!point) throw Error('Unmapped teacher hotspot: '+asset.key+' '+label);
  const [x,y] = point, [cx,cy] = asset.crop;
  return [x/100*asset.width-cx,y/100*asset.height-cy];
}
function renderTeacherFigure(asset, {state={},step={},txt}={}) {

  if(asset.bodyClip) {

  }
  if(asset.slug==='urine-concentration' && asset.src.endsWith('-90.png')) {
    const sx=asset.width/100,sy=asset.height/100;
    overlays+='<path data-cortex-boundary d="M20 '+35*sy+'H'+(asset.width-20)+'" stroke="#765348" stroke-width="2" stroke-dasharray="6 5" fill="none"/>';
    overlays+=[48,62,76,90].map((y,i)=>`<path data-gradient-tick d="M${(14-i*2)*sx} ${y*sy}H${17*sx}" stroke="#765348" stroke-width="3"/>`).join('');

    if(visible&&asset.current==='loop-up')overlays+=[48,62,76].map(y=>transport(63,73,y,'NaCl')).join('');
    if(visible&&asset.current==='adh')overlays+=[48,62,76].map(y=>`<rect data-water-channel x="${77*sx}" y="${y*sy-9}" width="${8*sx}" height="18" rx="6" fill="#8ed5e1" stroke="#276981" stroke-width="3"/>`+transport(77,69,y,'water')).join('');

function renderSpatialFigure({node,step,state,txt,controls=true,order}) {

function layoutSpatialStamps() {

   const target=targets[Number(stamp.dataset.target)];if(!target)continue;
   const x=target.x+target.w/2,y=target.y+target.h/2,w=stamp.offsetWidth,h=stamp.offsetHeight;
   const candidates=[];
   for(const gap of [28,56,84,112,150])for(const [dx,dy]of [[-w/2,gap],[-w/2,-h-gap],[gap,-h/2],[-w-gap,-h/2],[-w-gap,gap],[gap,gap],[-w-gap,-h-gap],[gap,-h-gap]]){
     const r={x:Math.max(2,Math.min(frame.width-w-2,x+dx)),y:Math.max(2,Math.min(frame.height-h-2,y+dy)),w,h};

   }

}

          render();
        }),
    );
    if (by('micro-submit')) {
      by('micro-submit').disabled = c.microAnswer === null;
      by('micro-submit').onclick = () => {
        const ok = c.microAnswer === node.micro.answer;
        emit('answer', `${S.slug}-node-0${c.node + 1}-micro`, ok);
        if (ok) passNode();
        else fail('node', [node.micro.feedback[c.microAnswer] || node.micro.defaultFeedback]);
      };
    }
    if (by('next-node'))
      by('next-node').onclick = () => {
        if (c.node < 5) enterNode(c.node + 1);
        else {
          c.screen = 'trace';
          c.traceIndex = 0;
          c.feedback = [];
          c.errors = [];
          save();
          render();
        }
      };
    if (by('return-review'))
      by('return-review').onclick = () => {
        c.screen = 'assessment';
        c.reviewed = true;
        c.review = false;
        c.feedback = [];
        c.errors = [];
        c.retry = null;
        save();
        render();
      };
  }
  function traceHtml() {
    const j = c.traceIndex;
    return `<section class="student-screen scripted-course" data-screen="trace"><header class="student-header"><h1>${common('結尾')}</h1>${S.endCopy ? `<h2>${txt(S.endCopy)}</h2>` : ''}</header><main class="student-main"><section class="diagram-region ${j === 0 ? 'map-covered' : ''}" id="student-figure">${j === 0 ? '' : mapHtml(true)}</section><section class="response-region">${j < 3 ? `<h2>${txt(S.trace[j].question)}</h2>${choiceButtons(S.trace[j].options, 'trace')}` : `<p>${txt(S.final)}</p>`}${feedbackHtml()}</section></main><footer class="student-footer">${c.retry ? retryButton() : j === 3 ? button('enter-assessment', common('下一步 →')) : ''}</footer></section>`;
  }
  function bindTrace() {
    document.querySelectorAll('[data-trace]').forEach(
      (b) =>
        (b.onclick = () => {
          if (Number(b.dataset.trace) === 0) {
            c.traceIndex++;
            c.feedback = [];
            c.errors = [];
            if (c.traceIndex === 3) c.tracePassed = true;
            save();
            render();
          } else fail('trace', [S.final]);
        }),
    );
    const b = document.getElementById('enter-assessment');
    if (b)
      b.onclick = () => {
        c.screen = 'transition';
        save();
        render();
      };
  }
  function assessmentHtml() {
    const q = config.questions[c.quizStage][c.quizIndex];
    if (c.assessmentPassed)
      return `<section class="student-screen scripted-course"><main class="intro-region"><h1>${authorized('pass')}</h1><p>${txt(S.final)}</p></main></section>`;
    return `<section class="student-screen scripted-course" data-screen="assessment"><header class="student-header"><h1><span data-original>${esc(q.stem)}</span></h1></header><main class="quiz-region"><div class="answer-options">${core
      .order('quiz.' + q.id, q.options.length)
      .map(
        (i) =>
          `<button data-pool="${i}" class="${c.quizAnswer === i ? 'selected' : ''}"><span data-original>${esc(q.options[i])}</span></button>`,
      )
      .join(
        '',
      )}</div>${c.quizWrong ? `<div class="script-feedback error">${authorized('retry')}<p data-original>${esc(c.moreGuide ? q.explain : q.hint)}</p></div>${!c.moreGuide ? button('more-guide', common('看第二層引導')) : button('review-node', common('回看對應節點'))}${c.reviewed ? button('retry-assessment', authorized('step')) : ''}` : button('pool-submit', common('送出'))}</main></section>`;
  }
  function bindAssessment() {
    const by = (id) => document.getElementById(id),
      q = config.questions[c.quizStage][c.quizIndex];
    document.querySelectorAll('[data-pool]').forEach((b) => {
      b.disabled = !!c.quizWrong;
      b.onclick = () => {
        c.quizAnswer = Number(b.dataset.pool);
        save();
        render();
      };
    });
    if (by('pool-submit')) {
      by('pool-submit').disabled = c.quizAnswer === null;
      by('pool-submit').onclick = () => {
        const ok = c.quizAnswer === q.answer;
        emit('answer', q.id, ok);
        if (!ok) {
          c.quizWrong = true;
          c.moreGuide = false;
          c.reviewed = false;
        } else {
          c.quizAnswer = null;
          c.quizIndex++;
          if (c.quizIndex === config.questions[c.quizStage].length) {
            if (c.quizStage === 'foundation') {
              c.quizStage = 'cases';
              c.quizIndex = 0;
            } else {
              c.assessmentPassed = true;
              if (c.done.length === 6 && c.tracePassed && !c.sent) {
                c.sent = true;
                emit('complete');
              }
            }
          }
        }
        save();
        render();
      };
    }
    if (by('more-guide'))
      by('more-guide').onclick = () => {
        c.moreGuide = true;
        save();
        render();
      };
    if (by('review-node'))
      by('review-node').onclick = () =>
        enterNode(Math.max(0, config.nodeIds.indexOf(q.nodeId)), true);
    if (by('retry-assessment'))
      by('retry-assessment').onclick = () => {
        c.quizIndex = 0;
        c.quizWrong = false;
        c.moreGuide = false;
        c.reviewed = false;
        c.quizAnswer = null;
        core.reshuffle();
        save();
        render();
      };
  }
  function render() {
    const oldFrame=document.querySelector('[data-spatial-scroll]'),oldScreen=document.querySelector('[data-screen="node"]');
    const scroll=oldFrame&&Number(oldScreen?.dataset.node)===c.node&&Number(oldScreen?.dataset.step)===c.step?{top:oldFrame.scrollTop,left:oldFrame.scrollLeft}:null;
    let html;
    if (c.screen === 'intro')
      html = `<section class="student-screen intro-screen scripted-course"><header class="student-header"><h1>${txt(S.title)}</h1></header><main class="intro-region"><h2>${txt(S.intro)}</h2>${button('start', txt(S.introButton))}</main></section>`;
    else if (c.screen === 'node') html = nodeHtml();
    else if (c.screen === 'trace') html = traceHtml();
    else if (c.screen === 'transition')
      html = `<section class="student-screen scripted-course" data-screen="transition"><header class="student-header"><h1>${common('準備考核')}</h1></header><main class="intro-region"><h2>${authorized('transition')}</h2>${button('start-quiz', common('開始考核'))}</main></section>`;
    else html = assessmentHtml();
    document.body.innerHTML = html;
    const by = (id) => document.getElementById(id);
    if (by('start')) by('start').onclick = () => enterNode(0);
    if (c.screen === 'node') bindNode();
    if (c.screen === 'trace') bindTrace();
    if (c.screen === 'assessment' && !c.assessmentPassed) bindAssessment();
    if (by('start-quiz'))
      by('start-quiz').onclick = () => {
        c.screen = 'assessment';
        save();
        render();
      };
    if (c.phase === 'step-passed' || c.phase === 'passed')
      document
        .querySelectorAll('[data-operation],[data-sign],[data-arrow],#glucose-slider')
        .forEach((b) => (b.disabled = true));
    if (c.retry) {
      document
        .querySelectorAll('button:not(#strict-retry):not(#hint-toggle),input')
        .forEach((b) => (b.disabled = true));
      if (by('strict-retry')) by('strict-retry').onclick = retry;
      else
        setTimeout(
          () => {
            if (c.retry) render();
          },
          Math.max(1, c.retryAt - Date.now()),
        );
    }
    positionFigureControls();
    layoutSpatialStamps();
    const newFrame=document.querySelector('[data-spatial-scroll]');if(scroll&&newFrame){newFrame.scrollTop=scroll.top;newFrame.scrollLeft=scroll.left;}
    window.StudentScriptUI = {
      getState: () => ({ course: c }),
      reset: () => {
        localStorage.removeItem(storageKey);
        location.reload();
      },
    };
  }
  function positionFigureControls() {
    const root = document.querySelector('.scripted-figure');
    const svg = root?.querySelector('svg');
    if (!svg) return;
    const m = svg.getScreenCTM(),
      bounds = root.getBoundingClientRect();
    if (!m) return;
    root.querySelector('.teacher-leaders')?.remove();
    const callouts = [...root.querySelectorAll('.diagram-hotspot:not(.blind-hotspot)')];
    const leaderLines=[];
    root.querySelectorAll('[data-figure-control]').forEach((button) => {
      const x = Number(button.dataset.x),
        y = Number(button.dataset.y);
      let px = m.a * x + m.c * y + m.e - bounds.left;
      let py = m.b * x + m.d * y + m.f - bounds.top;
      if(root.dataset.figureKind==='anatomy' && callouts.length>1 && callouts.includes(button)) {
        const index=Number(button.dataset.operation), rows=Math.ceil(callouts.length/2);
        const bx=index%2 ? bounds.width-button.offsetWidth/2-8 : button.offsetWidth/2+8;
        const by=24+Math.floor(index/2)*Math.max(40,(bounds.height-76)/Math.max(1,rows-1));
        leaderLines.push(`<path d="M${px} ${py}L${bx} ${by}"/><circle cx="${px}" cy="${py}" r="3"/>`);
        px=bx;py=by;
      }
      button.style.left =
        Math.max(
          button.offsetWidth / 2 + 2,
          Math.min(bounds.width - button.offsetWidth / 2 - 2, px),
        ) + 'px';
      button.style.top =
        Math.max(
          button.offsetHeight / 2 + 2,
          Math.min(bounds.height - button.offsetHeight / 2 - 2, py),
        ) + 'px';
    });
    if(leaderLines.length)root.insertAdjacentHTML('beforeend',`<svg class="teacher-leaders" viewBox="0 0 ${bounds.width} ${bounds.height}" preserveAspectRatio="none" aria-hidden="true">${leaderLines.join('')}</svg>`);
  }
  window.addEventListener('resize', ()=>{positionFigureControls();layoutSpatialStamps();});
  window.addEventListener('message', (event) => {
    if (
      event.source !== window.parent ||
      event.data?.type !== 'init' ||
      event.data.protocolVersion !== 1 ||
      !/^[-\w]{16,100}$/.test(event.data.guideScope || '')
    )
      return;
    guideScope = event.data.guideScope;
    if(c.screen==='node' && step()?.type==='locate'){c.locateGuide=!c.retry&&!seenGuide();render();}
    if (c.screen === 'node' && step()?.type === 'matching') {
      ui.guideStep = c.retry || seenGuide() ? null : 1;
      render();
    }
  });
  if (window.parent !== window) window.parent.postMessage({ type: 'ready' }, '*');
  if (c.screen === 'node' && step()?.type === 'matching') {
    if (!c.match?.values) clearStep();
    ui.guideStep = c.retry || seenGuide() ? null : 1;
  }
  render();
}

ments-node-01","sources":["body-fluid-compartments；physiology/CH09 p.28, physiology/CH09 p.29, physiology/CH09 p.33, physiology/CH09 p.37"]},{"id":"fluid-compartments-foundation-q02","stem":"先把全身的水當成一整份，細胞內液和細胞外液各分到多少？","options":["細胞內一半，細胞外一半","細胞內三分之二，細胞外三分之一","細胞內三分之一，細胞外三分之二","細胞內五分之四，細胞外五分之一"],"answer":1,"hint":"先想想：全身的水分三份，細胞裡拿兩份還是一份？","explain":"因為全身總水量約三分之二在細胞裡、三分之一在外面，所以選「細胞內三分之二，細胞外三分之一」。選「細胞內三分之一，細胞外三分之二」的同學，把細胞內與細胞外的份量交換了。","nodeId":"fluid-compartments-node-02","sources":["body-fluid-compartments；physiology/CH09 p.28, physiology/CH09 p.29, physiology/CH09 p.33, physiology/CH09 p.37"]},{"id":"fluid-compartments-foundation-q03","stem":"血漿占20%、細胞之間的組織間液占80%，這兩個比例是在分哪一整份水？","options":["全身總水量","細胞內液","細胞外液","全身體重"],"answer":2,"hint":"先想想：血管裡的血漿和細胞之間的水，都在細胞外嗎？","explain":"因為血漿和組織間液都是細胞外液的一部分，所以選「細胞外液」。選「全身體重」的同學，把「占細胞外液」誤當成「占體重」。","nodeId":"fluid-compartments-node-03","sources":["body-fluid-compartments；physiology/CH09 p.28, physiology/CH09 p.29, physiology/CH09 p.33, physiology/CH09 p.37"]},{"id":"fluid-compartments-foundation-q04","stem":"同一個標準例子說血漿占體重4%、組織間液占體重16%，把兩項合起來是什麼？","options":["先加成20%，再多加一次外液20%","合起來就是細胞內液","兩項都改說成占血漿的比例","合起來是占體重20%的細胞外液"],"answer":3,"hint":"先想想：小份加起來已是整份，還要把整份再加一次嗎？","explain":"因為血漿和組織間液已經組成細胞外液，所以4%加16%就是外液20%，選「合起來是占體重20%的細胞外液」。選「先加成20%，再多加一次外液20%」的同學，又加一次外液20%，把同一份水重複算了。","nodeId":"fluid-compartments-node-04","sources":["body-fluid-compartments；physiology/CH09 p.28, physiology/CH09 p.29, physiology/CH09 p.33, physiology/CH09 p.37"]},{"id":"fluid-compartments-foundation-q05","stem":"血漿在血管內，組織間液在細胞之間，兩邊的重要差別是什麼？","options":["血漿的蛋白質比較多","組織間液沒有小離子","組織間液的蛋白質比較多","兩邊的蛋白質差不多"],"answer":0,"hint":"先想想：蛋白質比較容易留在血管裡，還是跑到細胞之間？","explain":"因為微血管壁讓蛋白質較多留在血漿，所以選「血漿的蛋白質比較多」。選「組織間液的蛋白質比較多」的同學，把蛋白質較多的一邊寫成了組織間液。","nodeId":"fluid-compartments-node-05","sources":["body-fluid-compartments；physiology/CH09 p.28, physiology/CH09 p.29, physiology/CH09 p.33, physiology/CH09 p.37","electrolyte-osmolarity；physiology/CH09 p.32, physiology/CH09 p.31, physiology/CH09 p.33"]},{"id":"fluid-compartments-foundation-q06","stem":"課本說女性全身水量約占體重55%、男性約65%，使用這些比例時要注意什麼？","options":["脂肪多少不會影響身體含水比例","男女的條件會影響身體含水比例","每個人都用標準60%就好","55%和65%是拿水和細胞外液相比"],"answer":1,"hint":"先想想：課本已給男女不同數字，還能用同一個60%嗎？","explain":"因為課本的男女含水比例不同，所以要把性別與脂肪差異算進去，選「男女的條件會影響身體含水比例」。選「每個人都用標準60%就好」的同學，把標準60%當成每個人的固定比例。","nodeId":"fluid-compartments-node-06","sources":["body-fluid-compartments；physiology/CH09 p.28, physiology/CH09 p.29, physiology/CH09 p.33, physiology/CH09 p.37"]}],"cases":[{"id":"fluid-compartments-case-q01","stem":"知道一個人的體重，並採用「全身水約占體重60%」的例子，想分出細胞內外各有多少水，第一步要算什麼？","options":["把整個體重當成細胞裡的水","把血漿比例當成全身水比例","先用體重算出全身共有多少水","直接把體重當成血漿的量"],"answer":2,"hint":"先想想：要把水分成內外兩份，先要知道哪個總量？","explain":"因為要先知道全身有多少水，才有一整份水能分配，所以先用體重乘60%，選「先用體重算出全身共有多少水」。選「把整個體重當成細胞裡的水」的同學，把整個體重都當成細胞內的水，少了先算總水量這一步。","nodeId":"fluid-compartments-node-01","sources":["body-fluid-compartments；physiology/CH09 p.28, physiology/CH09 p.29, physiology/CH09 p.33, physiology/CH09 p.37"]},{"id":"fluid-compartments-case-q02","stem":"血漿雖然在血管裡，但以「在不在細胞裡」來分，它屬於哪一類？","options":["細胞內液","腎小管內液","紅血球裡的液體","細胞外液"],"answer":3,"hint":"先想想：血管裡面，和細胞裡面，是同一個地方嗎？","explain":"因為血漿在血管內、卻在細胞外面，所以屬於細胞外液，選「細胞外液」。選「細胞內液」的同學，把「血管裡面」當成「細胞裡面」了。","nodeId":"fluid-compartments-node-02","sources":["body-fluid-compartments；physiology/CH09 p.28, physiology/CH09 p.29, physiology/CH09 p.33, physiology/CH09 p.37"]},{"id":"fluid-compartments-case-q03","stem":"這個例子用全身水占體重60%、血漿占體重4%、組織間液占16%，另一份資料卻用不同數字，應怎麼整理？","options":["保留本例的比較基準和比例，另一例另外列","把4%和16%改說成占細胞外液的比例","把4%和16%改說成細胞內液的兩部分","把4%改說成占全身總水量的比例"],"answer":0,"hint":"先想想：這些百分比原本都是拿哪一個整體來比較？","explain":"因為4%和16%都是本例占體重的比例，所以要和本例的60%一起使用，選「保留本例的比較基準和比例，另一例另外列」。選「把4%和16%改說成占細胞外液的比例」的同學，換了比較的整份水，數字就不再是同一個意思。","nodeId":"fluid-compartments-node-04","sources":["body-fluid-compartments；physiology/CH09 p.28, physiology/CH09 p.29, physiology/CH09 p.33, physiology/CH09 p.37"]},{"id":"fluid-compartments-case-q04","stem":"兩位成年男女體重一樣，要估算身體有多少水，還要把什麼差異算進去？","options":["主要看年齡，男女差異可以省略","男女與脂肪比例的差異","男女都用60%，不再看其他條件","把女性的含水比例設得比男性高"],"answer":1,"hint":"先想想：體重相同，就表示男女的含水比例也相同嗎？","explain":"因為含水比例會隨性別等條件改變，所以估算時要看男女與脂肪差異，選「男女與脂肪比例的差異」。選「主要看年齡，男女差異可以省略」的同學，雖想到年齡，卻把題目要比較的男女差異省略了。","nodeId":"fluid-compartments-node-06","sources":["body-fluid-compartments；physiology/CH09 p.28, physiology/CH09 p.29, physiology/CH09 p.33, physiology/CH09 p.37"]},{"id":"fluid-compartments-case-q05","stem":"正常血漿和組織間液都有小離子，為什麼血漿通常有比較多蛋白質？","options":["微血管壁會主動把外面的蛋白質搬回血漿","微血管壁讓蛋白質自由通過，兩邊應一樣多","微血管壁不太讓蛋白質通過，較多留在血漿","微血管壁擋住小離子，卻讓蛋白質容易通過"],"answer":2,"hint":"先想想：微血管壁比較容易擋住蛋白質，還是小離子？","explain":"因為微血管壁限制蛋白質通過，所以較多蛋白質保留在血漿，選「微血管壁不太讓蛋白質通過，較多留在血漿」。選「微血管壁擋住小離子，卻讓蛋白質容易通過」的同學，把蛋白質與小離子的通過情形交換了。","nodeId":"fluid-compartments-node-05","sources":["body-fluid-compartments；physiology/CH09 p.28, physiology/CH09 p.29, physiology/CH09 p.33, physiology/CH09 p.37","electrolyte-osmolarity；physiology/CH09 p.32, physiology/CH09 p.31, physiology/CH09 p.33"]}],"predict":{"question":"切換到「外液細分」，血漿20%的分母應選哪一個？","options":["細胞內液","血漿本身","細胞外液","體重"],"answer":2,"feedback":"血漿與組織間液共同構成細胞外液，兩項分別佔外液20%與80%。","sources":["body-fluid-compartments；physiology/CH09 p.28, physiology/CH09 p.29, physiology/CH09 p.33, physiology/CH09 p.37"]}},"nodeIds":["fluid-compartments-node-01","fluid-compartments-node-02","fluid-compartments-node-03","fluid-compartments-node-04","fluid-compartments-node-05","fluid-compartments-node-06"]});</script></body></html>
