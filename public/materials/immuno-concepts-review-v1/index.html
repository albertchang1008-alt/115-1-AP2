// 教學互動不持有 SDK，只有「看相關節點」沿用既有閱讀入口。
const Heart2 = (() => {
  const e = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const button = (id,label) => `<button type="button" data-factor="${e(id)}" aria-pressed="false" aria-describedby="factor-explain">${e(label)}<span class="factor-direction"></span></button>`;
  function tree(data) {
    const rootLabel = data.root.includes('心輸出量') ? '心輸出量' : '組織液量';
    const direction = sign => `與${rootLabel}${sign === -1 ? '反向（−）' : '同向（＋）'}`;
    return `<section class="factor-tree supplemental" aria-labelledby="factor-title"><h2 id="factor-title">${e(data.title)}</h2><div class="factor-controls"><button data-factor-change="1" aria-pressed="true">這個因素增加 ↑</button><button data-factor-change="-1" aria-pressed="false">這個因素減少 ↓</button><button data-factor-reset>重設</button></div><div class="factor-root">${button('root',data.root)}</div><div class="factor-branches">${data.branches.map(b=>`<div class="factor-branch" data-branch="${e(b.id)}"><p class="tree-edge">${direction(b.sign)}</p>${button(b.id,b.label)}<div class="factor-leaves">${b.children.map(c=>`<div><span class="tree-edge">${direction(c.sign * b.sign)}</span>${button(c.id,c.label)}</div>`).join('')}</div></div>`).join('')}</div>${(data.specials||[]).map(s=>`<div class="factor-special">${button(s.id,s.label)}<span>HR 心率↑ ⋯→ SV 心搏量↓</span></div>`).join('')}<p id="factor-explain" aria-live="polite">點選因素，沿箭頭看變化如何傳到${e(data.root)}。</p><button data-factor-node hidden>看相關節點</button></section>`;
  }
  function mountTree(root,data,reveal) {
    let selected=null,change=1;
    const leaves=data.branches.flatMap(b=>b.children.map(c=>({...c,branch:b}))),specials=data.specials||[];
    const render=()=>{
      root.querySelectorAll('[data-factor]').forEach(b=>{
        const id=b.dataset.factor,active=selected&&(id===selected.id||id===selected.branch?.id||id==='root'||selected.special&&['hr','sv'].includes(id));
        b.classList.toggle('factor-active',!!active);b.classList.toggle('factor-dim',!!selected&&!active);
        b.setAttribute('aria-pressed',String(!!active));b.querySelector('.factor-direction').textContent='';
      });
      root.querySelectorAll('[data-branch]').forEach(b=>{b.classList.toggle('branch-active',!!selected&&(selected.special||b.dataset.branch===selected.branch?.id));});
      root.querySelectorAll('[data-factor-change]').forEach(b=>{b.setAttribute('aria-pressed',String(+b.dataset.factorChange===change));b.disabled=!!selected?.special});
      const link=root.querySelector('[data-factor-node]');link.hidden=!selected;
      if(!selected){root.querySelector('#factor-explain').textContent=`點選因素，沿箭頭看變化如何傳到${data.root}。`;return;}
      const mark=(id,dir)=>root.querySelector(`[data-factor="${id}"] .factor-direction`).textContent=' '+dir;
      if(selected.special){mark(selected.id,'↑');mark('root','不一定↑');root.querySelector('#factor-explain').textContent=selected.explainUp;}
      else {
        const branch=change*selected.sign,net=branch*(selected.branch.sign??1),arrow=n=>n>0?'↑ 增加':'↓ 減少';
        mark(selected.id,arrow(change));mark(selected.branch.id,arrow(branch));mark('root',arrow(net));
        root.querySelector('#factor-explain').textContent=`${selected.label}${arrow(change)} → ${selected.branch.label}${arrow(branch)} → ${data.root}${arrow(net)}。${change===1?selected.explainUp:selected.explainDown}`;
      }
    };
    root.addEventListener('click',event=>{
      const b=event.target.closest('button');if(!b)return;
      if(b.hasAttribute('data-factor-reset')){selected=null;change=1;}
      else if(b.hasAttribute('data-factor-change'))change=+b.dataset.factorChange;
      else if(b.hasAttribute('data-factor-node')){reveal(selected.nodeId);return;}
      else if(b.hasAttribute('data-factor')){const id=b.dataset.factor;selected=leaves.find(c=>c.id===id)||specials.find(c=>c.id===id)&&{...specials.find(c=>c.id===id),special:true}||null;}
      render();
    });render();
  }
  const aorta = {
    segments: [
      ['ascending', '升主動脈', '主動脈根部 → 頭臂動脈起點'],
      ['arch', '主動脈弓', '頭臂動脈起點 → 左鎖骨下動脈起點之後'],
      ['thoracic', '胸主動脈（降主動脈）', '左鎖骨下動脈之後 → 橫膈'],
      ['abdominal', '腹主動脈', '穿過橫膈後 → 約第 4 腰椎分為左右髂總動脈'],
    ],
    html() { return `<div class="aorta-segment-controls" data-aorta-widget><div class="state-controls">${this.segments.map(([id, label]) => `<button type="button" data-aorta-select="${id}" aria-pressed="false">${label}</button>`).join('')}</div><p class="aorta-definition" aria-live="polite">預設顯示全部；點選一段看起訖，再點一次恢復全部。</p></div>`; },
    mount(root) {
      let selected = null;
      root.addEventListener('click', event => {
        const button = event.target.closest('[data-aorta-select]'); if (!button) return;
        selected = selected === button.dataset.aortaSelect ? null : button.dataset.aortaSelect;
        root.querySelectorAll('[data-aorta-select]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.aortaSelect === selected)));

      });

  const cuff={
    html:()=>`<div class="bp-cuff"><label for="cuff-pressure">壓脈帶壓力：<output id="cuff-value">150</output> mmHg（示意數值 120／80）</label><input id="cuff-pressure" type="range" min="60" max="160" value="150" step="1" aria-describedby="cuff-sound"><div class="cuff-controls"><button data-cuff-play aria-pressed="false">自動放氣</button><button data-cuff-reset>重設 150</button></div><svg viewBox="0 0 400 300" role="img" aria-label="動脈壓與壓脈帶壓力的時間圖"><g fill="#17212b" font-size="18"><text x="12" y="24">mmHg</text><text x="315" y="285">時間 →</text><text x="6" y="112">120</text><text x="12" y="200">80</text><text x="65" y="250">120：第一聲＝收縮壓</text><text x="65" y="275">80：聲音消失＝舒張壓</text></g><path d="M55 40V220H385" stroke="#64748b" fill="none"/><path d="M55 195L70 105Q87 135 108 195L123 105Q140 135 161 195L176 105Q193 135 214 195L229 105Q246 135 267 195L282 105Q299 135 320 195L335 105Q352 135 373 195" stroke="#8250a0" stroke-width="3" fill="none"/><path class="cuff-line" d="M55 40H385" stroke="#5d327a" stroke-width="4" stroke-dasharray="8 5"/><g class="cuff-notes" fill="#8250a0" font-size="24"><text x="65" y="90">♪</text><text x="171" y="90">♪</text><text x="277" y="90">♪</text></g></svg><svg class="cuff-section" viewBox="0 0 400 140" role="img" aria-label="壓脈帶下的肱動脈剖面"><rect x="155" y="10" width="90" height="115" rx="15" fill="#eee6f5" stroke="#8250a0"/><path class="cuff-lumen" fill="#fde8e8" stroke="#a71930" stroke-width="4"/><path class="cuff-flow" fill="none" stroke="#a71930" stroke-width="4"/><text x="12" y="135" font-size="18">肱動脈：紅色箭頭表示流動 →</text></svg><p id="cuff-sound" aria-live="polite"></p></div>`,
    mount(root){root=root.querySelector('.bp-cuff');let timer=null;const slider=root.querySelector('input'),play=root.querySelector('[data-cuff-play]');
      const stop=()=>{clearInterval(timer);timer=null;play.textContent='自動放氣';play.setAttribute('aria-pressed','false');};
      const update=()=>{const p=+slider.value,closed=p>120,turbulent=p>80&&!closed;root.dataset.phase=closed?'closed':turbulent?'turbulent':'open';root.querySelector('output').textContent=p;root.querySelector('.cuff-line').setAttribute('d',`M55 ${195-(p-80)*2.25}H385`);root.querySelector('.cuff-notes').style.display=turbulent?'':'none';root.querySelector('.cuff-lumen').setAttribute('d',closed?'M15 40H155L200 67L245 40H385V95H245L200 68L155 95H15Z':turbulent?'M15 40H155L190 60H210L245 40H385V95H245L210 78H190L155 95H15Z':'M15 40H385V95H15Z');root.querySelector('.cuff-flow').setAttribute('d',closed?'':turbulent?'M25 68H165q15-20 25 0t25 0t25 0H355l-12-8m12 8-12 8':'M25 68H355l-12-8m12 8-12 8');root.querySelector('#cuff-sound').textContent=closed?'無聲：壓脈帶高於收縮壓，動脈壓閉。':turbulent?'♪ 柯氏音（斷續）：收縮期血液衝過受壓動脈，形成亂流。':'聲音消失：壓脈帶 ≤80 mmHg，血液平順通過。';};
      slider.addEventListener('input',()=>{stop();update();});play.addEventListener('click',()=>{if(timer)return stop();if(+slider.value<=60)slider.value=150;play.textContent='暫停放氣';play.setAttribute('aria-pressed','true');timer=setInterval(()=>{slider.value=Math.max(60,+slider.value-1);update();if(+slider.value===60)stop();},1000/3);});root.querySelector('[data-cuff-reset]').addEventListener('click',()=>{stop();slider.value=150;update();});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});window.addEventListener('pagehide',stop);update();
    }
  };
  function misconceptions(rows){return `<section class="misconceptions supplemental"><h2>常見誤解</h2>${rows.map(r=>`<div class="misconception"><p><strong>✗ ${e(r.wrong)}</strong></p><p>✓ ${e(r.correct)}</p></div>`).join('')}</section>`;}
  function extras(rows,figures){return rows.map(r=>`<section class="extras supplemental"><h2>${e(r.title)}</h2><div class="extra-figure">${figures[r.figure]}</div><p>${e(r.caption||'')}</p></section>`).join('');}
  return {tree,mountTree,aorta,cuff,misconceptions,extras};
})();

// 教材元件庫：由 content.json 產生單檔互動教材（六節點＋兩關題目＋SDK 回報）。
// 擴充點：lab.widget（例如 "ecg-sim"）與題型 type（例如 "label"），由 materials-src/widgets/ 提供。
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Fisher–Yates 洗牌（無偏差）
const shuffle = rows => {
  const a = [...rows];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const WIDGETS = { 'ecg-sim': () => window.EcgSim, 'bp-cuff': () => Heart2.cuff };
const QUESTION_TYPES = { label: () => window.EcgLabel };

function renderLab(lab, figures) {
  const widget = lab.widget && WIDGETS[lab.widget]?.();
  const prediction = lab.predict ? `<h3>${esc(lab.predict.question)}</h3><div class="options predict">${shuffle(lab.predict.options.map((text,answer)=>({text,answer}))).map(o=>`<button data-answer="${o.answer}">${esc(o.text)}</button>`).join('')}</div><p class="feedback" aria-live="polite"></p>` : '';
  const visual = lab.widget ? `<div class="lab-widget" data-widget="${esc(lab.widget)}">${widget ? widget.html(lab) : ''}</div>`
    : `<div class="state-figure${lab.figure==='major-vessels-overview.svg'?' anatomy-lab':''}" data-lab-state="${lab.states[0].id}" data-state="${lab.states[0].id}"><div class="anatomy-main">${figures[lab.figure]}</div>${figures['major-vessels-portal.svg']?`<div class="portal-inset">${figures['major-vessels-portal.svg']}</div>`:''}</div><div class="state-controls">${lab.states.map((x,i)=>`<button data-lab-state="${x.id}" aria-pressed="${!i}">${esc(x.label)}</button>`).join('')}${figures['major-vessels-portal.svg']?'<button type="button" data-anatomy-overview aria-pressed="false">總覽</button><button type="button" data-replay-flow>重播血流</button>':''}</div><p class="state-explain" aria-live="polite">${esc(lab.states[0].explain)}</p>`;
  return `<section class="lab"><h2>${esc(lab.title)}</h2><p>${esc(lab.intro)}</p>${visual}${prediction}</section>`;
}

function renderQuestion(q) {
  const type = q.type && q.type !== 'mcq' ? QUESTION_TYPES[q.type]?.() : null;
  if (type) return `<h3>${esc(q.stem)}</h3><div class="q-widget" data-type="${esc(q.type)}">${type.html(q)}</div>`;
  return `<h3>${esc(q.stem)}</h3><div class="options">${shuffle(q.options.map((text, answer) => ({ text, answer }))).map(o => `<button data-answer="${o.answer}">${esc(o.text)}</button>`).join('')}</div><p class="feedback" aria-live="polite"></p>`;
}

// Normalize punctuation before comparison; split compound points to retain only new clauses.
function summaryClauses(text) {
  return text.split(/[。；;\n]+/).map(s=>s.trim()).filter(Boolean);
}
function summaryKey(text) { return text.replace(/[\s，、：:（）()「」『』]/g,''); }
function summaryRow(row) {
  const seen=[];
  return row.map((cell,i)=>{
    if(i===0)return cell;
    const keep=[];
    for(const clause of summaryClauses(cell)) {
      const key=summaryKey(clause);
      if(!key || seen.some(s=>s===key || (s.length>=6 && key.length>=6 && (s.includes(key)||key.includes(s)))))continue;
      seen.push(key);keep.push(clause);
    }
    return keep.join('；') || '—';
  });
}
function renderSummary(content) {
  const table = content.summaryTable || {headers:['主題','關鍵概念','整理重點'], rows:content.nodes.map(n => [n.title,n.summary,n.points.join('；')])};
  const rows=table.rows.map(summaryRow);
  return `<section class="learning-summary" aria-labelledby="summary-title"><h2 id="summary-title">重點整理表</h2><p>把相關概念放在一起比較；回到知識節點可看完整圖解。</p><table><caption>${esc(content.title)}｜概念比較</caption><thead><tr>${table.headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((cell,i)=>i?`<td${cell==='—'?' class="summary-empty-cell"':''} data-label="${esc(table.headers[i])}">${esc(cell)}</td>`:`<th scope="row">${esc(cell)}</th>`).join('')}</tr>`).join('')}</tbody></table></section>`;
}

function render(content, figures) {
  const stage = (rows, kind) => rows.map((q, i) => `<article class="stage" data-kind="${kind}" data-question-id="${q.id}" data-index="${i}" ${i ? 'hidden' : ''}>${renderQuestion(q)}</article>`).join('');
  return `<main class="kit" data-slug="${content.slug}">`
    + `<header class="hero"><p>${esc(content.label)}</p><h1>${esc(content.title)}</h1><p>${esc(content.subtitle)}</p></header>`
    + (content.experience === 'guided' ? '<div class="prefs-bar"><label>字級 <select data-pref="font"><option value="1">標準</option><option value="1.15">較大</option><option value="1.3">最大</option></select></label></div><button type="button" data-go-quiz>兩階段隨堂診斷</button>' : '')
    + `<section class="stats">${content.stats.map(x => `<div class="tile"><strong>${esc(x.value)}</strong>${esc(x.label)}</div>`).join('')}</section>`
    + renderLab(content.lab, figures)
    + `<section><h2>知識節點</h2><div class="nodes">${content.nodes.map(n => `<button class="node-button" data-node="${n.id}" aria-expanded="false" aria-controls="detail-${n.id}"><strong>${esc(n.title)}</strong><br>${esc(n.summary)}</button>`).join('')}`
    + content.nodes.map(n => `<article class="node-detail" id="detail-${n.id}" data-node-id="${n.id}" hidden><div class="node-figure" role="img" aria-label="${esc(n.title)} 示意圖">${figures[n.figure]}</div>${n.figure==='major-vessels-node-01.svg'?Heart2.aorta.html():''}${n.caption?`<p class="figure-caption">${esc(n.caption)}</p>`:''}<h2>${esc(n.title)}</h2><p>${esc(n.concept)}</p><ul>${n.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul><div class="clinical"><strong>${esc(n.clinical.title)}</strong><br>${esc(n.clinical.text)}</div>${n.reference?`<p class="material-reference">${esc(n.reference)}</p>`:''}<button type="button" data-close-node="${n.id}">收合</button></article>`).join('')
    + `</div></section>`
    + (content.overview?.type === 'factor-tree' ? Heart2.tree(content.overview) : '')
    + (content.extras ? Heart2.extras(content.extras, figures) : '')
    + (content.misconceptions ? Heart2.misconceptions(content.misconceptions) : '')
    + renderSummary(content)
    + `<section class="quiz"><h2>第一關｜先備知識</h2>${stage(content.foundation, 'foundation')}<h2>第二關｜情境應用</h2>${stage(content.cases, 'case').replace('data-index="0"', 'data-index="0" hidden')}</section>`
    + '<p class="complete-banner" hidden role="status">本輪第二關五題全對，已通關！</p>'
    + `<footer class="credits">${(content.credits || []).map(esc).join('<br>')}</footer></main>`;
}

// Pure visual controls: no learning events or changes to completion counts.
function updateAnatomy(figure) {
  const state = figure.dataset.state;
  figure.querySelectorAll('.vessel,.blood-arrow').forEach(path => path.classList.toggle('route-active', state === 'overview' || (path.dataset.routes || '').split(' ').includes(state)));
  figure.querySelectorAll('.vessel').forEach(path => { path.dataset.baseWidth ||= path.getAttribute('stroke-width'); path.style.strokeWidth = +path.dataset.baseWidth * (path.classList.contains('route-active') ? 1.15 : 1); });
  figure.querySelectorAll('[data-label-state]').forEach(label => label.style.display = label.dataset.labelState === state ? 'block' : 'none');
  figure.querySelectorAll('svg').forEach(svg => svg.setCurrentTime?.(0));
}

function mount(content, figures) {
  document.body.innerHTML = render(content, figures);
  document.querySelectorAll('[data-aorta-widget]').forEach(root => Heart2.aorta.mount(root));
  const guided = content.experience === 'guided';
  document.querySelector('[data-go-quiz]')?.addEventListener('click', () => document.querySelector('.quiz').scrollIntoView({ behavior: 'smooth', block: 'start' }));
  document.querySelector('[data-pref="font"]')?.addEventListener('change', e => document.documentElement.style.setProperty('--font-scale', e.target.value));
  document.querySelector('[data-pref="theme"]')?.addEventListener('change', e => document.documentElement.dataset.theme = e.target.value);
  const selectPanel = id => document.querySelectorAll('.state-figure [data-panel]').forEach(g => { g.style.display = g.dataset.panel === id ? '' : 'none'; });
  selectPanel(content.lab.states?.[0]?.id);
  const CL = window.CourseLearning || { explore() {}, nodeTime() {}, answer() {}, hint() {}, complete() {} };

  // 知識節點：第一次展開送 explore；收合或分頁隱藏時送前景停留秒數
  const opened = new Map(), explored = new Set();
  const buttons = [...document.querySelectorAll('.node-button')];
  const closeNode = id => {
    document.querySelector('#detail-' + id).hidden = true;
    buttons.find(b => b.dataset.node === id)?.setAttribute('aria-expanded', 'false');
    const start = opened.get(id);
    if (start !== undefined) CL.nodeTime(id, (performance.now() - start) / 1000);
    opened.delete(id);
  };
  // 詳細內容橫跨所在列；依實際卡片位置定位，亦支援窄版與字級調整。
  const placeDetail = id => {
    const button = buttons.find(b => b.dataset.node === id);
    const detail = document.querySelector('#detail-' + id);
    detail.hidden = true;
    const rowTop = button.offsetTop;
    const last = buttons.filter(b => b.offsetTop === rowTop).at(-1);
    last.after(detail);
    detail.hidden = false;
  };
  const revealNode = id => {
    const button = buttons.find(b => b.dataset.node === id);
    const detail = document.querySelector('#detail-' + id);
    if (!button || !detail) return;
    buttons.filter(b => b.dataset.node !== id && b.getAttribute('aria-expanded') === 'true').forEach(b => closeNode(b.dataset.node));
    const wasClosed = detail.hidden;
    placeDetail(id);
    button.setAttribute('aria-expanded', 'true');
    if (wasClosed) {
      if (!explored.has(id)) { explored.add(id); CL.explore(id); }
      opened.set(id, performance.now());
    }
    // 精簡卡片與詳細內容頂端一起留在視窗中。
    button.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  buttons.forEach(b => b.addEventListener('click', () => {
    if (b.getAttribute('aria-expanded') === 'true') closeNode(b.dataset.node);
    else revealNode(b.dataset.node);
  }));
  document.querySelectorAll('[data-close-node]').forEach(b => b.addEventListener('click', () => {
    closeNode(b.dataset.closeNode);
    const button = buttons.find(x => x.dataset.node === b.dataset.closeNode);
    button.focus({ preventScroll: true });
    button.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }));
  new ResizeObserver(() => {
    const active = buttons.find(b => b.getAttribute('aria-expanded') === 'true');
    if (active) placeDetail(active.dataset.node);
  }).observe(document.querySelector('.nodes'));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { for (const [id, start] of opened) CL.nodeTime(id, (performance.now() - start) / 1000); opened.clear(); }
  });

  // 情境實驗室
  if (content.lab.widget) {
    const root = document.querySelector('.lab-widget');
    WIDGETS[content.lab.widget]?.()?.mount(root, content.lab, CL);
  } else {
    document.querySelectorAll('button[data-lab-state]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.labState;
      const fig = document.querySelector('.state-figure');
      fig.dataset.labState = id; fig.dataset.state = id; // data-state 供圖檔內 CSS 切換狀態
      updateAnatomy(fig);
      document.querySelector('[data-anatomy-overview]')?.setAttribute('aria-pressed', 'false');
      selectPanel(id);
      document.querySelectorAll('button[data-lab-state]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      document.querySelector('.state-explain').textContent = content.lab.states.find(x => x.id === id).explain;
    }));
  }
  const anatomy = document.querySelector('.anatomy-lab');
  if (anatomy) {
    updateAnatomy(anatomy);
    document.querySelector('[data-replay-flow]').addEventListener('click', () => updateAnatomy(anatomy));
    document.querySelector('[data-anatomy-overview]').addEventListener('click', event => {
      anatomy.dataset.state = 'overview'; updateAnatomy(anatomy);
      document.querySelectorAll('button[data-lab-state]').forEach(b => b.setAttribute('aria-pressed', 'false'));
      event.currentTarget.setAttribute('aria-pressed', 'true');
      document.querySelector('.state-explain').textContent = '主動脈分為升主動脈、主動脈弓、胸主動脈與腹主動脈；點選目的地追蹤血流路徑。';
    });
  }
  document.querySelector('.predict')?.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const ok = +b.dataset.answer === content.lab.predict.answer;
      const feedback = b.parentElement.nextElementSibling;
      b.parentElement.querySelectorAll('button').forEach(x => { x.classList.remove('predict-correct','predict-wrong'); x.setAttribute('aria-pressed',String(x===b)); });
      b.classList.add(ok ? 'predict-correct' : 'predict-wrong');
      feedback.className = `feedback predict-result ${ok ? 'ok' : 'warn'}`;
      feedback.textContent = ok ? `✓ 答對了！${content.lab.predict.feedback}` : '✗ 尚未答對。再比對圖中的狀態與箭頭，想想變化方向後再試一次。';
    });
  if(content.overview?.type==='factor-tree') Heart2.mountTree(document.querySelector('.factor-tree'),content.overview,revealNode);

  // 兩關題目：逐題答對才解鎖；第二關全部答對才送 complete
  let foundation = 0, cases = 0, completionSent = false;
  // 學習成果在最後一題答對時成立；呈現結果不應是回報前提。
  const reportCompletion = () => {
    if (completionSent) return;
    completionSent = true;
    CL.complete();
  };
  const openForReview = revealNode;
  const restartCases = () => {
    cases = 0;
    completionSent = false;
    document.querySelector('.complete-banner').hidden = true;
    document.querySelectorAll('[data-kind="case"]').forEach((item, index) => {
      item.hidden = index !== 0;
      if (guided) item.innerHTML = renderQuestion(content.cases[index]);
      item.querySelectorAll('button[data-answer]').forEach(button => { button.disabled = false; });
      const feedback = item.querySelector('.feedback'); if (feedback) feedback.textContent = '';
    });
  };
  const show = el => { el.hidden = false; el.dispatchEvent(new CustomEvent('stage-show')); };
  const advance = (stage, kind) => {
    stage.hidden = true;
    if (kind === 'foundation') {
      foundation++;
      const next = document.querySelector(`[data-kind="foundation"][data-index="${foundation}"]`);
      show(next || document.querySelector('[data-kind="case"][data-index="0"]'));
    } else {
      cases++;
      const next = document.querySelector(`[data-kind="case"][data-index="${cases}"]`);
      if (next) show(next); else { reportCompletion(); if (guided) document.querySelector('.complete-banner').hidden = false; }
    }
  };
  document.querySelectorAll('.stage').forEach(stage => {
    const kind = stage.dataset.kind, rows = kind === 'foundation' ? content.foundation : content.cases;
    const q = rows[+stage.dataset.index];
    const type = q.type && q.type !== 'mcq' ? QUESTION_TYPES[q.type]?.() : null;
    if (type) { type.mount(stage.querySelector('.q-widget'), q, CL, () => advance(stage, kind)); return; }
    stage.addEventListener('click', e => {
      const b = e.target.closest('button[data-answer]'); if (!b || b.disabled || stage.hidden) return;
      const ok = +b.dataset.answer === q.answer;
      CL.answer(q.id, ok);
      const feedback = stage.querySelector('.feedback');
      if (!ok) {
        CL.hint?.(q.id);
        if (kind === 'foundation') { feedback.textContent = `提示：${q.hint}`; return; }
        stage.querySelectorAll('button[data-answer]').forEach(x => { x.disabled = true; });
        feedback.textContent = `提示：${q.hint} `;
        const review = document.createElement('button'); review.type = 'button'; review.textContent = '前往對應節點複習';
        const retry = document.createElement('button'); retry.type = 'button'; retry.textContent = '重新挑戰本關'; retry.disabled = true;
        review.addEventListener('click', () => { openForReview(q.nodeId); retry.disabled = false; });
        retry.addEventListener('click', restartCases);
        feedback.append(review, retry); return;
      }
      feedback.textContent = '答對，繼續下一題。';
      stage.querySelectorAll('button').forEach(x => { x.disabled = true; });
      if (kind === 'case' && cases === content.cases.length - 1) reportCompletion();
      if (guided) {
        feedback.textContent = '答對。' + (q.explain || '');
        const next = document.createElement('button'); next.type = 'button';
        next.textContent = kind === 'case' && cases === content.cases.length - 1 ? '查看通關結果' : '繼續下一題';
        next.addEventListener('click', () => { advance(stage, kind); document.querySelector('.stage:not([hidden]), .complete-banner:not([hidden])')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, { once: true });
        feedback.append(next);
      } else setTimeout(() => advance(stage, kind), 250);
    });
  });
}

// 舊版三段節律圖（ecg-rate.svg）的狀態切換；保留相容
document.addEventListener('click', event => {
  const button = event.target.closest('button[data-lab-state]'); if (!button) return;
  const figure = document.querySelector('.state-figure'), state = button.dataset.labState; if (!figure) return;
  figure.querySelectorAll('.slow,.rest,.fast').forEach(group => { group.style.display = group.classList.contains(state) ? 'block' : 'none'; });
});

mount({"slug":"immuno-concepts-review","version":"v1","experience":"guided","title":"從小安的第一年認識免疫","subtitle":"免疫是什麼、抗原與抗體、B 細胞與 T 細胞，一次串起來","label":"從小安的第一年認識免疫｜互動資訊圖表","stats":[{"value":"3 道","label":"免疫防線"},{"value":"G＞A＞M＞D＞E","label":"血中抗體含量"},{"value":"1–3 天","label":"再次反應潛伏期"}],"lab":{"title":"初次與再次免疫反應：第二次為什麼更快更強","intro":"學生切換「第一次接觸抗原」與「第二次接觸同一抗原」，看 IgM 和 IgG 兩條曲線怎麼變化；拖動時間軸，標出潛伏期、高峰與主要抗體。 小安一個月大時打第二劑 B 型肝炎疫苗，就是在利用再次反應。這條曲線會在節點 06 再出現一次。","figure":"immuno-concepts-review-lab.svg","states":[{"id":"primary","label":"第一次接觸","explain":"潛伏期約 7–10 天；先出現 IgM，之後 IgG 慢慢上升；量少，消退也快。"},{"id":"secondary","label":"第二次接觸同一抗原","explain":"潛伏期縮短到 1–3 天；以 IgG 為主，量多很多、維持更久、與抗原結合更緊。 第一次反應留下了記憶 B 細胞和記憶 T 細胞，第二次可以直接大量動員。疫苗要打追加劑，就是利用這個原理。"}],"predict":{"question":"操作前先預測：第二次接觸同一種抗原時，哪一個敘述正確？","options":["以 IgM 大量上升為主","反應比第一次慢","以 IgG 為主，出現得更快、量更多","和第一次完全一樣"],"answer":2,"feedback":"記憶細胞讓再次反應更快、更強，且主要是 IgG。IgM 是初次反應最先出現的抗體。"}},"nodes":[{"id":"immuno-concepts-review-node-01","tag":"01","title":"免疫是什麼","summary":"免疫系統負責分辨「自己」與「非自己」，清除外來的病原和身體裡不正常的細胞。","figure":"immuno-concepts-review-node-01.svg","concept":"免疫系統負責分辨「自己」與「非自己」，清除外來的病原和身體裡不正常的細胞。","points":["三大功能：防禦（抵抗病原）、恆定（清除老舊受損細胞）、監視（清除癌變細胞）。","第一道防線：皮膚與黏膜、胃酸、溶菌酶、正常菌叢。","第二道防線：吞噬細胞、發炎、發燒、補體、干擾素、自然殺手細胞。","第三道防線：淋巴球（B 細胞、T 細胞）與抗體，有專一性和記憶。","失調時：反應過強是過敏；把自己當成敵人是自體免疫；反應太弱是免疫缺乏。"],"clinical":{"title":"小安的第一年","text":"小安剛出生，自己的第三道防線還很不成熟，前幾個月主要靠媽媽給的抗體保護。"},"reference":"免疫學（Ch7）；115-MI 微免總複習"},{"id":"immuno-concepts-review-node-02","tag":"02","title":"先天免疫與後天免疫","summary":"先天免疫出生就有、反應快但沒有專一性；後天免疫要接觸過抗原才建立，有專一性和記憶。","figure":"immuno-concepts-review-node-02.svg","concept":"先天免疫出生就有、反應快但沒有專一性；後天免疫要接觸過抗原才建立，有專一性和記憶。","points":["何時具備｜先天免疫（非專一性）：出生就有｜後天免疫（專一性）：接觸抗原後才建立","專一性｜先天免疫（非專一性）：沒有；認得一大類病原共有的特徵｜後天免疫（專一性）：有；只針對特定抗原","反應速度｜先天免疫（非專一性）：快，數分鐘到數小時｜後天免疫（專一性）：慢，初次約需一週","記憶｜先天免疫（非專一性）：沒有，每次反應一樣｜後天免疫（專一性）：有，第二次更快更強","成員｜先天免疫（非專一性）：皮膚黏膜、嗜中性球、巨噬細胞、自然殺手細胞、補體、發炎、發燒｜後天免疫（專一性）：B 細胞與抗體（體液免疫）、T 細胞（細胞性免疫）","兩者會合作：樹突細胞和巨噬細胞吞下病原後，把抗原片段「呈現」給 T 細胞，啟動後天免疫。","抗體回頭可以幫先天免疫：標記病原讓吞噬細胞更容易吃掉，或活化補體。"],"clinical":{"title":"小安的第一年","text":"小安的先天免疫從出生就能運作，後天免疫要等他自己接觸抗原（感染或疫苗）才會慢慢建立。"},"reference":"免疫學（Ch7）；115-MI 微免總複習"},{"id":"immuno-concepts-review-node-03","tag":"03","title":"主動免疫與被動免疫","summary":"主動免疫是自己的身體製造抗體和記憶細胞，慢但持久；被動免疫是接受現成的抗體，快但短暫。","figure":"immuno-concepts-review-node-03.svg","concept":"主動免疫是自己的身體製造抗體和記憶細胞，慢但持久；被動免疫是接受現成的抗體，快但短暫。","points":["天然｜主動免疫（自己做）：感染後康復，例：得過麻疹｜被動免疫（別人給）：胎盤傳來的 IgG、母乳中的 IgA","人工｜主動免疫（自己做）：疫苗、類毒素，例：B 型肝炎疫苗、破傷風類毒素｜被動免疫（別人給）：抗毒素血清、免疫球蛋白，例：抗蛇毒血清、B 型肝炎免疫球蛋白（HBIG）","產生速度｜主動免疫（自己做）：慢，約 1–2 週｜被動免疫（別人給）：立即","持續時間｜主動免疫（自己做）：長，數年到終身｜被動免疫（別人給）：短，數週到數月","記憶細胞｜主動免疫（自己做）：有｜被動免疫（別人給）：沒有","判斷口訣：抗體是誰做的？自己做的是主動，別人做好給你的是被動。","常見錯誤：類毒素打進去後是自己產生抗體，屬於人工主動，不是被動。","被動免疫適合「來不及等」的情況：被毒蛇咬、破傷風高危險傷口、B 肝帶原母親的新生兒。"],"clinical":{"title":"小安的第一年","text":"小安出生時身上有媽媽給的 IgG（天然被動）；打 B 型肝炎疫苗則是人工主動。"},"reference":"免疫學（Ch7）；115-MI 微免總複習"},{"id":"immuno-concepts-review-node-04","tag":"04","title":"免疫細胞與淋巴器官","summary":"所有免疫細胞都來自骨髓的造血幹細胞，分成骨髓系和淋巴系兩大家族。","figure":"immuno-concepts-review-node-04.svg","concept":"所有免疫細胞都來自骨髓的造血幹細胞，分成骨髓系和淋巴系兩大家族。","points":["嗜中性球｜家族：骨髓系｜主要工作：白血球中最多，最先到達感染處吞噬細菌；膿的主要成分","單核球／巨噬細胞｜家族：骨髓系｜主要工作：單核球進入組織後變成巨噬細胞；吞噬病原、呈現抗原","樹突細胞｜家族：骨髓系｜主要工作：最強的抗原呈現細胞，連接先天與後天免疫","嗜酸性球｜家族：骨髓系｜主要工作：對抗寄生蟲、參與過敏","嗜鹼性球／肥大細胞｜家族：骨髓系｜主要工作：釋放組織胺，引起過敏反應","B 細胞｜家族：淋巴系｜主要工作：在骨髓成熟；活化後變成漿細胞製造抗體","T 細胞｜家族：淋巴系｜主要工作：在胸腺成熟；負責指揮和直接殺死被感染的細胞","自然殺手細胞｜家族：淋巴系｜主要工作：屬先天免疫；不需事先致敏，殺死病毒感染細胞和癌細胞","初級（中樞）淋巴器官：骨髓、胸腺，是淋巴球「長大成熟」的地方。","次級（周邊）淋巴器官：淋巴結、脾臟、扁桃腺、黏膜相關淋巴組織，是淋巴球「遇到抗原、開始工作」的地方。"],"clinical":{"title":"小安的第一年","text":"如果胸腺沒有發育，T 細胞就無法成熟，這是情境題 5 的線索。"},"reference":"免疫學（Ch7）；115-MI 微免總複習"},{"id":"immuno-concepts-review-node-05","tag":"05","title":"抗原與抗體：誰是鎖？誰是鑰匙？","summary":"抗原是引起免疫反應、被辨認的那一方（鎖）；抗體是身體做出來、去辨認抗原的蛋白質（鑰匙）。","figure":"immuno-concepts-review-node-05.svg","concept":"抗原是引起免疫反應、被辨認的那一方（鎖）；抗體是身體做出來、去辨認抗原的蛋白質（鑰匙）。","points":["是什麼｜抗原：能引起免疫反應，並能被抗體或 T 細胞受體專一辨認的物質｜抗體：漿細胞製造的免疫球蛋白，能專一結合抗原","從哪裡來｜抗原：多為外來：細菌、病毒、毒素、花粉、別人的紅血球；自己的成分被誤認時也會成為抗原｜抗體：自己的 B 細胞分化成漿細胞後製造","化學本質｜抗原：多為大分子：蛋白質最強，其次是多醣｜抗體：醣蛋白（免疫球蛋白）","角色｜抗原：被辨認的「鎖」｜抗體：去辨認的「鑰匙」","例子｜抗原：A 型血的人，紅血球上有 A 抗原｜抗體：A 型血的人，血漿中有抗 B 抗體","記法：抗「原」是引起反應的原因；抗「體」是身體做出來的武器。","抗原決定位：抗原表面真正被辨認的小區域。一個抗原有好幾個決定位，所以能同時被好幾種抗體結合。","半抗原：分子太小，單獨不能引起免疫反應，要和載體蛋白結合才行，例：青黴素過敏。","常見錯誤：以為抗原一定是有害的病菌。花粉、輸入的異型紅血球、移植的器官，甚至自己的組織，都可能是抗原。"],"clinical":{"title":"小安的第一年","text":"媽媽是 A 型，血漿裡本來就有抗 B 抗體；如果誤輸 B 型血，抗 B 抗體會立刻結合輸入紅血球上的 B 抗原（情境題 3）。"},"reference":"免疫學（Ch7）；115-MI 微免總複習"},{"id":"immuno-concepts-review-node-06","tag":"06","title":"抗體的結構與功能：B 細胞的工作","summary":"B 細胞遇到抗原後，在輔助型 T 細胞幫助下增殖，分化成製造抗體的漿細胞和留下來的記憶 B 細胞。","figure":"immuno-concepts-review-node-06.svg","concept":"B 細胞遇到抗原後，在輔助型 T 細胞幫助下增殖，分化成製造抗體的漿細胞和留下來的記憶 B 細胞。","points":["抗體是 Y 字形：兩條重鏈加兩條輕鏈，用雙硫鍵連在一起。","兩隻手臂（Fab）的尖端是可變區，負責結合抗原，所以一個抗體有兩個結合部位。","柄的部分（Fc）是恆定區，決定抗體的種類，也負責接上吞噬細胞和補體。","流程：B 細胞表面受體結合抗原 → 輔助型 T 細胞給訊號 → 大量增殖 → 漿細胞（分泌抗體）＋記憶 B 細胞。","抗體四大功能：中和（擋住毒素和病毒）、調理作用（標記病原，讓吞噬細胞好吃）、活化補體（在細菌上打洞）、凝集（把病原黏成一團）。","初次反應先出現 IgM，再次反應以 IgG 為主，而且更快、更多（見實驗區曲線）。"],"clinical":{"title":"小安的第一年","text":"小安打完第一劑 B 肝疫苗，B 細胞開始製造抗體並留下記憶細胞；第二劑就會引發再次反應。"},"reference":"免疫學（Ch7）；115-MI 微免總複習"},{"id":"immuno-concepts-review-node-07","tag":"07","title":"五種抗體的不同","summary":"五種抗體的差別在 Fc 部分，因此結構、分布和工作都不同；血中含量由多到少是 G、A、M、D、E。","figure":"immuno-concepts-review-node-07.svg","concept":"五種抗體的差別在 Fc 部分，因此結構、分布和工作都不同；血中含量由多到少是 G、A、M、D、E。","points":["IgG｜結構：單體｜血中含量：最多，約 75–80%｜特點：唯一能通過胎盤；半衰期最長；再次反應的主角；能調理、活化補體、中和毒素｜一句話記憶：媽媽送給胎兒的禮物","IgA｜結構：血中為單體；分泌型為雙體｜血中含量：約 15%｜特點：分泌型 IgA 在淚液、唾液、呼吸道與腸道黏膜、初乳中，保護黏膜｜一句話記憶：黏膜的守門員","IgM｜結構：五聚體，分子最大｜血中含量：約 5–10%｜特點：初次反應最先出現；活化補體與凝集能力最強；ABO 血型抗體主要是 IgM｜一句話記憶：第一個趕到現場","IgD｜結構：單體｜血中含量：極少｜特點：主要在成熟 B 細胞表面，當作抗原受體｜一句話記憶：B 細胞的名牌","IgE｜結構：單體｜血中含量：最少｜特點：結合在肥大細胞和嗜鹼性球上，引發第一型過敏；對抗寄生蟲｜一句話記憶：過敏的開關","胎兒不會自己製造 IgG 以外的大量抗體：新生兒臍帶血中如果特定 IgM 偏高，代表胎兒在子宮內就被感染了。","IgM 出現代表「最近的感染」；IgG 出現代表「感染過或打過疫苗」。"],"clinical":{"title":"小安的第一年","text":"小安血中的 IgG 來自媽媽（胎盤）；母乳中的 IgA 保護他的腸道（情境題 1、2）。"},"reference":"免疫學（Ch7）；115-MI 微免總複習"},{"id":"immuno-concepts-review-node-08","tag":"08","title":"T 細胞：指揮官與殺手","summary":"T 細胞在胸腺成熟，只辨認「被呈現在細胞表面」的抗原片段，負責指揮免疫反應和直接殺死被感染的細胞。","figure":"immuno-concepts-review-node-08.svg","concept":"T 細胞在胸腺成熟，只辨認「被呈現在細胞表面」的抗原片段，負責指揮免疫反應和直接殺死被感染的細胞。","points":["CD4 輔助型 T 細胞｜辨認方式：辨認第二類 MHC 呈現的抗原片段（來自抗原呈現細胞）｜主要工作：免疫反應的指揮官：分泌細胞激素，幫助 B 細胞製造抗體、活化巨噬細胞和毒殺型 T 細胞","CD8 毒殺型 T 細胞｜辨認方式：辨認第一類 MHC 呈現的抗原片段（幾乎所有有核細胞）｜主要工作：直接殺死被病毒感染的細胞和癌細胞，讓它凋亡","調節型 T 細胞｜辨認方式：—｜主要工作：踩煞車，避免免疫反應過度或攻擊自己","記憶 T 細胞｜辨認方式：—｜主要工作：下次遇到同樣抗原時快速反應","抗體 vs T 細胞：抗體可以抓住游離在體液中的抗原；T 細胞只能辨認細胞表面 MHC 上的抗原片段，所以對付「躲在細胞裡」的病原（病毒、結核菌）要靠 T 細胞。","細胞性免疫也和器官移植排斥、結核菌素皮膚試驗（第四型、遲發型過敏）有關。","愛滋病毒攻擊 CD4 細胞：指揮官減少，體液和細胞性免疫都變弱，出現伺機性感染。","胸腺發育不全（DiGeorge 症候群）：T 細胞缺乏，容易反覆受到病毒和黴菌感染。"],"clinical":{"title":"小安的第一年","text":"同病房的寶寶反覆嚴重感染、胸腺發育不全，受影響的是 T 細胞與細胞性免疫（情境題 5）。"},"reference":"免疫學（Ch7）；115-MI 微免總複習"}],"foundation":[{"id":"immuno-concepts-review-foundation-q01","stem":"下列哪一項是先天免疫的特性？","options":["具有專一性","第二次接觸時反應更強","出生就具備，反應快但沒有記憶","由漿細胞負責"],"answer":2,"hint":"先天免疫有沒有「記憶」？","explain":"先天免疫出生就有、反應快、沒有專一性也沒有記憶；專一性、記憶、漿細胞都屬於後天免疫。","nodeId":"immuno-concepts-review-node-02"},{"id":"immuno-concepts-review-foundation-q02","stem":"母親是 B 型肝炎帶原者，新生兒出生後立即注射 B 型肝炎免疫球蛋白（HBIG）。這屬於哪一種免疫？","options":["天然主動免疫","人工主動免疫","天然被動免疫","人工被動免疫"],"answer":3,"hint":"HBIG 裡裝的是現成的抗體嗎？","explain":"HBIG 是現成的抗體，用注射的方式給予，所以是人工被動免疫；同時打的 B 型肝炎疫苗則是人工主動免疫。","nodeId":"immuno-concepts-review-node-03"},{"id":"immuno-concepts-review-foundation-q03","stem":"負責製造並分泌抗體的細胞是：","options":["T 細胞","漿細胞","巨噬細胞","嗜中性球"],"answer":1,"hint":"B 細胞活化後會分化成什麼？","explain":"B 細胞活化後分化成漿細胞，由漿細胞大量分泌抗體。","nodeId":"immuno-concepts-review-node-04"},{"id":"immuno-concepts-review-foundation-q04","stem":"有關抗原與抗體的敘述，何者正確？","options":["抗體是外來物質，抗原是身體製造的蛋白質","A 型血的人，紅血球上有 A 抗原，血漿中有抗 B 抗體","抗原一定是致病的細菌或病毒","一個抗原只能被一種抗體結合"],"answer":1,"hint":"鎖和鑰匙，各自是誰做的？","explain":"抗原是被辨認的物質，抗體是自己的漿細胞製造的；抗原不一定有害；一個抗原有多個決定位，可以被多種抗體結合。","nodeId":"immuno-concepts-review-node-05"},{"id":"immuno-concepts-review-foundation-q05","stem":"初次免疫反應最早出現、分子量最大的抗體是：","options":["IgG","IgA","IgM","IgE"],"answer":2,"hint":"哪一種抗體是五聚體？","explain":"IgM 是五聚體，分子最大，是初次反應最先出現的抗體。","nodeId":"immuno-concepts-review-node-07"},{"id":"immuno-concepts-review-foundation-q06","stem":"能直接殺死被病毒感染細胞的是：","options":["CD4 輔助型 T 細胞","CD8 毒殺型 T 細胞","B 細胞","肥大細胞"],"answer":1,"hint":"指揮官和殺手，哪一個動手？","explain":"CD8 毒殺型 T 細胞辨認第一類 MHC 上的病毒抗原片段，直接讓被感染的細胞凋亡；CD4 負責指揮。","nodeId":"immuno-concepts-review-node-08"}],"cases":[{"id":"immuno-concepts-review-case-q01","stem":"【出生】小安的臍帶血檢驗發現有對抗麻疹的抗體。這些抗體最可能是：","options":["小安自己製造的 IgM","經胎盤從媽媽來的 IgG，屬天然被動免疫","經母乳得到的 IgA","小安自己製造的 IgG"],"answer":1,"hint":"回到對應節點重讀臨床連結，再判斷一次。","explain":"IgG 是唯一能通過胎盤的抗體，屬天然被動免疫，約在 6 個月內逐漸消失。若臍帶血中特定 IgM 偏高，表示胎兒在子宮內受到感染。","nodeId":"immuno-concepts-review-node-07"},{"id":"immuno-concepts-review-case-q02","stem":"【第 1 週】媽媽餵小安喝初乳。初乳中保護小安腸道黏膜的主要抗體是：","options":["IgG","分泌型 IgA","IgM","IgE"],"answer":1,"hint":"回到對應節點重讀臨床連結，再判斷一次。","explain":"分泌型 IgA 存在初乳和各種黏膜分泌物中，保護腸道和呼吸道黏膜；屬天然被動免疫。","nodeId":"immuno-concepts-review-node-07"},{"id":"immuno-concepts-review-case-q03","stem":"【產後】媽媽是 A 型血，產後大出血需要輸血。如果誤輸了 B 型血，會發生什麼事？","options":["媽媽紅血球上的 B 抗原和輸入的抗 A 抗體結合","媽媽血漿中的抗 B 抗體結合輸入紅血球上的 B 抗原，造成凝集與溶血","不會有反應，因為紅血球不是病菌","媽媽要一週後才會開始產生抗體"],"answer":1,"hint":"回到對應節點重讀臨床連結，再判斷一次。","explain":"A 型的人紅血球上是 A 抗原、血漿中本來就有抗 B 抗體（主要是 IgM）。輸入的 B 型紅血球帶有 B 抗原，會立刻被抗 B 抗體結合，引起凝集並活化補體造成溶血。","nodeId":"immuno-concepts-review-node-05"},{"id":"immuno-concepts-review-case-q04","stem":"【1 個月】小安出生時打了第一劑 B 型肝炎疫苗，一個月後打第二劑。第二劑後的抗體反應會：","options":["和第一劑完全相同","比較慢，且以 IgM 為主","更快、更多，以 IgG 為主，因為已有記憶細胞","不會產生抗體，因為第一劑已經用完"],"answer":2,"hint":"回到對應節點重讀臨床連結，再判斷一次。","explain":"第一劑留下記憶 B 細胞，第二劑引發再次反應：潛伏期短、抗體量多、以 IgG 為主、維持更久。這就是疫苗需要追加劑的原因。","nodeId":"immuno-concepts-review-node-06"},{"id":"immuno-concepts-review-case-q05","stem":"【同病房】同病房的另一個寶寶出生後反覆發生嚴重的病毒和黴菌感染，檢查發現胸腺發育不全。最主要受影響的是：","options":["補體系統","T 細胞成熟與細胞性免疫","嗜中性球的數量","皮膚屏障"],"answer":1,"hint":"回到對應節點重讀臨床連結，再判斷一次。","explain":"T 細胞在胸腺成熟。胸腺發育不全會使 T 細胞缺乏，細胞性免疫低下；因為 B 細胞也需要輔助型 T 細胞幫忙，抗體反應也會變差。","nodeId":"immuno-concepts-review-node-08"}],"credits":["節點插圖｜Gemini／ChatGPT 生成，經授課教師審訂（2026-10-10）｜教學用｜授課教師審訂","插圖由 AI（Gemini／ChatGPT）生成，經授課教師審訂（2026-10-10）"],"rules":{"nodes":8,"foundation":6,"cases":5}},{"immuno-concepts-review-lab.svg":"\u003csvg class=\"figure-immuno-concepts-review-lab\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1200 1270\" role=\"img\">\u003cstyle>.figure-immuno-concepts-review-lab text{font-family:system-ui,sans-serif;fill:#24354a;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round} .secondary-response{display:none} [data-state=\"secondary\"] .secondary-response{display:inline}\u003c/style>\u003crect width=\"1200\" height=\"1270\" rx=\"24\" fill=\"#fff\"/>\u003cpath d=\"M150 150V780H1140\" fill=\"none\" stroke=\"#516b83\" stroke-width=\"5\"/>\u003ctext x=\"40\" y=\"65\" font-size=\"46\" text-anchor=\"start\" >抗體濃度\u003c/text>\u003ctext x=\"1040\" y=\"850\" font-size=\"46\" text-anchor=\"middle\" >時間（天）\u003c/text>\u003cpath d=\"M240 780V170M655 780V170\" stroke=\"#9eabb8\" stroke-dasharray=\"8 12\" stroke-width=\"3\"/>\u003ctext x=\"240\" y=\"920\" font-size=\"46\" text-anchor=\"middle\" >第一次接觸抗原\u003c/text>\u003ctext x=\"750\" y=\"990\" font-size=\"46\" text-anchor=\"middle\" >第二次接觸同一抗原\u003c/text>\u003cpath class=\"igm-primary\" d=\"M240 776L280 776C300 776 312 640 355 642S398 773 600 776\" fill=\"none\" stroke=\"#b97529\" stroke-width=\"9\" stroke-dasharray=\"18 12\"/>\u003cpath class=\"igg-primary\" d=\"M240 776L322 776C350 776 385 665 420 673S480 768 610 775\" fill=\"none\" stroke=\"#24669e\" stroke-width=\"9\"/>\u003ctext x=\"280\" y=\"600\" font-size=\"46\" text-anchor=\"start\" fill=\"#8b5519\">IgM\u003c/text>\u003ctext x=\"465\" y=\"625\" font-size=\"46\" text-anchor=\"start\" fill=\"#18568c\">IgG\u003c/text>\u003cg class=\"secondary-response\">\u003cpath class=\"igm-secondary\" d=\"M655 775C670 775 685 655 735 648S790 772 1120 774\" fill=\"none\" stroke=\"#b97529\" stroke-width=\"9\" stroke-dasharray=\"18 12\"/>\u003cpath class=\"igg-secondary\" d=\"
