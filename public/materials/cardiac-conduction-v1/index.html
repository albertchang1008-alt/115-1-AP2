</style></head><body><script src="https://albertchang1008-alt.github.io/115-1-AP2/materials/course-learning.js"></script><script>window.CourseLearning=window.CourseLearning||{explore(){},nodeTime(){},answer(){},hint(){},complete(){}};</script><script>
// 教材元件庫：由 content.json 產生單檔互動教材（六節點＋兩關題目＋SDK 回報）。
// 擴充點：lab.widget（例如 "ecg-sim"）與題型 type（例如 "label"），由 materials-src/widgets/ 提供。
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Fisher–Yates 洗牌（無偏差）
const shuffle = rows => {
  const a = [...rows];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const WIDGETS = { 'ecg-sim': () => window.EcgSim };
const QUESTION_TYPES = { label: () => window.EcgLabel };

function renderLab(lab, figures) {
  const widget = lab.widget && WIDGETS[lab.widget]?.();
  if (lab.widget) {
    return `<section class="lab"><h2>${esc(lab.title)}</h2><p>${esc(lab.intro)}</p><div class="lab-widget" data-widget="${esc(lab.widget)}">${widget ? widget.html(lab) : ''}</div></section>`;
  }
  return `<section class="lab"><h2>${esc(lab.title)}</h2><p>${esc(lab.intro)}</p>`
    + `<div class="state-figure" data-lab-state="${lab.states[0].id}" data-state="${lab.states[0].id}">${figures[lab.figure]}</div>`
    + `<div class="state-controls">${lab.states.map((x, i) => `<button data-lab-state="${x.id}" aria-pressed="${!i}">${esc(x.label)}</button>`).join('')}</div>`
    + `<p class="state-explain" aria-live="polite">${esc(lab.states[0].explain)}</p>`
    + `<h3>${esc(lab.predict.question)}</h3><div class="options predict">${lab.predict.options.map((o, i) => `<button data-answer="${i}">${esc(o)}</button>`).join('')}</div>`
    + `<p class="feedback" aria-live="polite"></p></section>`;
}

function renderQuestion(q) {
  const type = q.type && q.type !== 'mcq' ? QUESTION_TYPES[q.type]?.() : null;
  if (type) return `<h3>${esc(q.stem)}</h3><div class="q-widget" data-type="${esc(q.type)}">${type.html(q)}</div>`;
  return `<h3>${esc(q.stem)}</h3><div class="options">${shuffle(q.options.map((text, answer) => ({ text, answer }))).map(o => `<button data-answer="${o.answer}">${esc(o.text)}</button>`).join('')}</div><p class="feedback" aria-live="polite"></p>`;
}

function render(content, figures) {
  const stage = (rows, kind) => rows.map((q, i) => `<article class="stage" data-kind="${kind}" data-index="${i}" ${i ? 'hidden' : ''}>${renderQuestion(q)}</article>`).join('');
  return `<main class="kit" data-slug="${content.slug}">`
    + `<header class="hero"><p>${esc(content.label)}</p><h1>${esc(content.title)}</h1><p>${esc(content.subtitle)}</p></header>`
    + `<section class="stats">${content.stats.map(x => `<div class="tile"><strong>${esc(x.value)}</strong>${esc(x.label)}</div>`).join('')}</section>`
    + renderLab(content.lab, figures)
    + `<section><h2>知識節點</h2><div class="nodes">${content.nodes.map(n => `<button class="node-button" data-node="${n.id}" aria-expanded="false" aria-controls="detail-${n.id}"><img alt="" src="data:image/svg+xml,${encodeURIComponent(figures[n.figure])}"><strong>${esc(n.title)}</strong><br>${esc(n.summary)}</button>`).join('')}</div>`
    + content.nodes.map(n => `<article class="node-detail" id="detail-${n.id}" data-node-id="${n.id}" hidden><img class="node-figure" alt="${esc(n.title)} 示意圖" src="data:image/svg+xml,${encodeURIComponent(figures[n.figure])}"><h2>${esc(n.title)}</h2><p>${esc(n.concept)}</p><ul>${n.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul><div class="clinical"><strong>${esc(n.clinical.title)}</strong><br>${esc(n.clinical.text)}</div></article>`).join('')
    + `</section>`
    + `<section class="quiz"><h2>第一關｜先備知識</h2>${stage(content.foundation, 'foundation')}<h2>第二關｜情境應用</h2>${stage(content.cases, 'case').replace('data-index="0"', 'data-index="0" hidden')}</section>`
    + `<footer class="credits">${(content.credits || []).map(esc).join('<br>')}</footer></main>`;
}

function mount(content, figures) {
  document.body.innerHTML = render(content, figures);
  const CL = window.CourseLearning || { explore() {}, nodeTime() {}, answer() {}, hint() {}, complete() {} };

  // 知識節點：第一次展開送 explore；收合或分頁隱藏時送前景停留秒數
  const opened = new Map(), explored = new Set();
  document.querySelectorAll('[data-node]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.node, d = document.querySelector('#detail-' + id), was = d.hidden;
    d.hidden = !was; b.setAttribute('aria-expanded', String(was));
    if (was) { if (!explored.has(id)) { explored.add(id); CL.explore(id); } opened.set(id, performance.now()); }
    else { const start = opened.get(id); if (start) CL.nodeTime(id, (performance.now() - start) / 1000); opened.delete(id); }
  }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { for (const [id, start] of opened) CL.nodeTime(id, (performance.now() - start) / 1000); opened.clear(); }
  });

  // 情境實驗室
  if (content.lab.widget) {
    const root = document.querySelector('.lab-widget');
    WIDGETS[content.lab.widget]?.()?.mount(root, content.lab, CL);
  } else {
    document.querySelectorAll('button[data-lab-state]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.labState;
      const fig = document.querySelector('.state-figure');
      fig.dataset.labState = id; fig.dataset.state = id; // data-state 供圖檔內 CSS 切換狀態
      document.querySelectorAll('button[data-lab-state]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      document.querySelector('.state-explain').textContent = content.lab.states.find(x => x.id === id).explain;
    }));
    document.querySelector('.predict').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const ok = +b.dataset.answer === content.lab.predict.answer;
      b.parentElement.nextElementSibling.textContent = ok ? content.lab.predict.feedback : '再比對圖中的狀態與箭頭。';
    });
  }

  // 兩關題目：逐題答對才解鎖；第二關全部答對才送 complete
  let foundation = 0, cases = 0;
  const show = el => { el.hidden = false; el.dispatchEvent(new CustomEvent('stage-show')); };
  const advance = (stage, kind) => {
    stage.hidden = true;
    if (kind === 'foundation') {
      foundation++;
      const next = document.querySelector(`[data-kind="foundation"][data-index="${foundation}"]`);
      show(next || document.querySelector('[data-kind="case"][data-index="0"]'));
    } else {
      cases++;
      const next = document.querySelector(`[data-kind="case"][data-index="${cases}"]`);
      if (next) show(next); else CL.complete();
    }
  };
  document.querySelectorAll('.stage').forEach(stage => {
    const kind = stage.dataset.kind, rows = kind === 'foundation' ? content.foundation : content.cases;
    const q = rows[+stage.dataset.index];
    const type = q.type && q.type !== 'mcq' ? QUESTION_TYPES[q.type]?.() : null;
    if (type) { type.mount(stage.querySelector('.q-widget'), q, CL, () => advance(stage, kind)); return; }
    stage.addEventListener('click', e => {
      const b = e.target.closest('button[data-answer]'); if (!b) return;
      const ok = +b.dataset.answer === q.answer;
      CL.answer(q.id, ok);
      const feedback = stage.querySelector('.feedback');
      if (!ok) { CL.hint?.(q.id); feedback.textContent = `提示：${q.hint}`; return; }
      feedback.textContent = '答對，繼續下一題。';
      stage.querySelectorAll('button').forEach(x => { x.disabled = true; });
      setTimeout(() => advance(stage, kind), 250);
    });
  });
}

// 舊版三段節律圖（ecg-rate.svg）的狀態切換；保留相容
document.addEventListener('click', event => {
  const button = event.target.closest('button[data-lab-state]'); if (!button) return;
  const figure = document.querySelector('.state-figure'), state = button.dataset.labState; if (!figure) return;
  figure.querySelectorAll('.slow,.rest,.fast').forEach(group => { group.style.display = group.classList.contains(state) ? 'block' : 'none'; });
});
document.addEventListener('DOMContentLoaded', () => {
  const figure = document.querySelector('.state-figure');
  figure?.querySelector('.slow')?.style.setProperty('display', 'block');
});

mount({"slug":"cardiac-conduction","version":"v1","title":"心臟的傳導系統","label":"心臟的傳導系統","subtitle":"從竇房結到浦金埃氏纖維：衝動怎麼產生、在哪裡延遲、又如何讓心室同步收縮。","stats":[{"value":"70~80 次/分","label":"竇房結安靜時的放電頻率"},{"value":"約 0.1 秒","label":"房室結的生理延遲"},{"value":"浦金埃氏纖維","label":"傳導速度最快的構造"}],"lab":{"title":"情境實驗室｜跟著一次心跳的衝動走","intro":"依序切換三個步驟，看衝動從哪裡開始、在哪裡放慢、最後怎麼傳遍心室。","figure":"conduction-pathway.svg","states":[{"id":"sa","label":"① 竇房結放電","explain":"竇房結自發去極化，衝動先擴散到左右心房，使心房收縮。"},{"id":"av","label":"② 房室結延遲","explain":"衝動在房室結傳得最慢（約 0.1 秒），讓心房有時間把血液擠入心室。"},{"id":"ventricle","label":"③ 傳遍心室","explain":"房室束→左右束支→浦金埃氏纖維快速傳導，左右心室幾乎同時收縮。"}],"predict":{"question":"衝動在哪一個構造傳得最慢？","options":["房室結","浦金埃氏纖維"],"answer":0,"feedback":"正確：房室結的延遲讓心房先完成收縮。"}},"nodes":[{"id":"cardiac-conduction-node-01","tag":"節律點","title":"竇房結：心跳的節律點","summary":"右心房壁、近上腔靜脈開口。","figure":"conduction-node.svg","concept":"竇房結（SA node）自發去極化的頻率最高，因此主導整個心臟的節律，稱為節律點（pacemaker）。","points":["位於右心房壁、靠近上腔靜脈開口處。","安靜時每分鐘約放電 70~80 次，形成竇性節律。","其他傳導組織也能自發放電，但頻率較低，平時被竇房結帶領。"],"clinical":{"title":"學習重點","text":"「節律點」指的是放電頻率最高、帶領全心跳動的構造，而不是傳導最快的構造。"}},{"id":"cardiac-conduction-node-02","tag":"延遲","title":"房室結與生理延遲","summary":"全系統傳導最慢的地方。","figure":"conduction-node.svg","concept":"衝動通過房室結（AV node）時速度最慢，產生約 0.1 秒的延遲。","points":["房室結位於右心房下部、房室交界處。","延遲讓心房先收縮、把血液擠入心室，心室才開始收縮。","房室結是心房衝動進入心室的主要通道。"],"clinical":{"title":"學習重點","text":"「最慢」和「最快」常被成對考：最慢是房室結，最快是浦金埃氏纖維。"}},{"id":"cardiac-conduction-node-03","tag":"房室束","title":"房室束（希氏束）與束支","summary":"穿過絕緣纖維環進入心室間隔。","figure":"conduction-node.svg","concept":"房室束（希氏束，Bundle of His）穿過心房與心室之間的絕緣纖維環，把衝動由房室結帶到心室間隔頂端，再分成左右束支。","points":["心房與心室之間有纖維環絕緣，衝動只能經房室束進入心室。","房室束在心室間隔分為左、右束支。","左右束支沿間隔向下，走向心尖。"],"clinical":{"title":"學習重點","text":"腱索、梳狀肌、冠狀靜脈竇都不是傳導系統；別被相似名稱干擾。"}},{"id":"cardiac-conduction-node-04","tag":"心室","title":"浦金埃氏纖維與心室同步收縮","summary":"傳導最快，衝動迅速傳遍心室。","figure":"conduction-node.svg","concept":"浦金埃氏纖維（傳導性肌纖維）直徑粗、傳導速度全系統最快，使衝動迅速傳遍整個心室肌。","points":["由束支末端分支，分布在心室內膜下。","衝動由心尖向上傳，心室由下往上收縮，把血液推向動脈。","快速傳導讓左右心室幾乎同時收縮。"],"clinical":{"title":"學習重點","text":"傳導順序：竇房結 → 心房 → 房室結 → 房室束 → 左右束支 → 浦金埃氏纖維 → 心室肌。"}},{"id":"cardiac-conduction-node-05","tag":"自律性","title":"心肌的自律性","summary":"不需要神經刺激也能自己跳。","figure":"conduction-node.svg","concept":"特化心肌能自發產生動作電位，稱為自律性（automaticity）；心臟收縮不需要神經直接啟動。","points":["離體蛙心放在適當生理鹽水中，沒有神經連接仍能規律跳動。","心肌是不隨意肌，不受意識控制。","切斷自主神經後心臟仍會跳動，只是失去神經對速率的調節。"],"clinical":{"title":"學習重點","text":"「引發收縮」靠自律性；「調節快慢與強弱」才是自主神經的工作。"}},{"id":"cardiac-conduction-node-06","tag":"神經調節","title":"自主神經與心率調節","summary":"交感加速、副交感（迷走）減速。","figure":"conduction-node.svg","concept":"延腦心跳中樞經自主神經調節心率與收縮力：交感神經釋放正腎上腺素使心跳加快加強，迷走神經釋放乙醯膽鹼使心跳減慢。","points":["運動、緊張時交感神經興奮：心跳加快、收縮力增加。","靜坐冥想、睡眠時迷走神經作用增強：心跳減慢、收縮減弱。","體溫升高會直接加快竇房結與房室結的放電速率，所以發燒時心跳變快。"],"clinical":{"title":"學習重點","text":"記住兩種神經傳導物質：交感＝正腎上腺素（加速），副交感＝乙醯膽鹼（減速）。"}}],"foundation":[{"id":"cardiac-conduction-foundation-q01","stem":"心臟傳導系統由特化心肌組織構成，其中位於右心房後壁近上腔靜脈開口下方、被稱為正常心跳「節律點（Pacemaker）」的構造為何？","options":["房室結（AV node）","竇房結（SA node）","希氏束（Bundle of His）","浦金埃氏纖維（Purkinje fibers）"],"answer":1,"hint":"想想哪個構造放電頻率最高、帶領整顆心臟跳動。","nodeId":"cardiac-conduction-node-01","explain":"竇房結（SA node）位於右心房壁近上腔靜脈開口處，具有最高的自發去極化頻率（每分鐘約 70~80 次），主導正常心跳節律，故稱為節律點。"},{"id":"cardiac-conduction-foundation-q02","stem":"在正常安靜休息狀態下，人體的竇房結（SA node）每分鐘自發產生動作電位的基本節律頻率約為多少次？","options":["30~40 次","70~80 次","110~120 次","140~150 次"],"answer":1,"hint":"回想正常安靜時的竇性節律大約是每分鐘幾次。","nodeId":"cardiac-conduction-node-01","explain":"正常人竇房結每分鐘自發興奮約 70~80 次，此為正常竇性節律（Sinus rhythm）的基本頻率。"},{"id":"cardiac-conduction-foundation-q03","stem":"電衝動在心臟傳導系統中傳播時，傳導速度「最慢」的部位為何？此生理延遲有何功能？","options":["浦金埃氏纖維；使心室提前收縮","房室結（AV node）；使心房有時間將血液擠入心室","房室束分枝；防止血液逆流","竇房結（SA node）；降低心房內壓力"],"answer":1,"hint":"心房要先收縮完，心室才收縮；延遲發生在心房與心室的交界。","nodeId":"cardiac-conduction-node-02","explain":"衝動行經房室結（AV node）時傳導速度最慢（產生約 0.1 秒以上的生理延遲），能確保心房完全收縮擠血入心室後，心室才開始收縮。"},{"id":"cardiac-conduction-foundation-q04","stem":"穿過心房與心室間絕緣纖維環，將電衝動由房室結傳向心室間隔頂端的傳導纖維束稱為？","options":["冠狀靜脈竇","房室束（希氏束 / Bundle of His）","腱索","梳狀肌"],"answer":1,"hint":"找出唯一能穿過房室之間絕緣纖維環的傳導構造。","nodeId":"cardiac-conduction-node-03","explain":"由房室結發出的傳導纖維稱為房室束（Atrioventricular bundle），又稱希氏束（Bundle of His），是衝動由心房傳入心室間隔的通道。"},{"id":"cardiac-conduction-foundation-q05","stem":"在整個心臟傳導系統中，動作電位傳導速度「最快」的構造為何？","options":["竇房結（SA node）","房室結（AV node）","浦金埃氏纖維（Purkinje fibers）","心房一般肌纖維"],"answer":2,"hint":"要讓衝動在瞬間傳遍整個心室，需要直徑最粗的傳導纖維。","nodeId":"cardiac-conduction-node-04","explain":"浦金埃氏纖維（傳導性肌纖維）直徑粗，電衝動傳導速度居全系統之冠（最快），能使衝動快速傳遍整個心室。"},{"id":"cardiac-conduction-foundation-q06","stem":"關於心臟自律性與自主神經的關係，下列敘述何者正確？","options":["心臟收縮必須依賴自主神經直接發出刺激才能啟動","自主神經只會調節心跳速率與收縮力，不會引發心臟收縮","切斷自主神經後，心臟會立即永久停止跳動","心肌細胞與骨骼肌一樣受意識隨意控制"],"answer":1,"hint":"心臟有自律性；神經負責的是調節，而不是啟動。","nodeId":"cardiac-conduction-node-05","explain":"心臟肌肉具自律性，不需神經直接刺激即可自發收縮；自主神經系統僅負責調節心跳速率與收縮強度，不直接啟動收縮。"}],"cases":[{"id":"cardiac-conduction-case-q01","stem":"【日常生理】學生在體育課進行 800 公尺長跑時，延腦心跳加速中樞經交感神經刺激心臟，其神經末梢會釋放何種化學物質來增加心跳速率？","options":["乙醯膽鹼（Acetylcholine）","正腎上腺素（Norepinephrine）","組織胺（Histamine）","胰島素（Insulin）"],"answer":1,"hint":"交感神經末梢釋放的是哪一種讓心跳加快的物質？","nodeId":"cardiac-conduction-node-06","explain":"交感神經末梢釋放正腎上腺素（Norepinephrine），作用於心臟傳導系統與心肌，使心跳速率及收縮強度增加以因應運動需求。"},{"id":"cardiac-conduction-case-q02","stem":"【日常生理】同學們在面對期中考試感到極度緊張時，常會感覺到自己「心跳砰砰跳得很快」，這主要是哪一個神經系統興奮所致？","options":["副交感神經系統（迷走神經）","交感神經系統","體軀運動神經系統","中樞痛覺傳導路徑"],"answer":1,"hint":"緊張、壓力屬於「戰或逃」反應，由哪一個神經系統主導？","nodeId":"cardiac-conduction-node-06","explain":"情緒緊張、憤怒或生理緊迫會刺激延腦心跳加速中樞，使交感神經興奮並釋放腎上腺素/正腎上腺素，增加竇房結放電頻率使心跳加快。"},{"id":"cardiac-conduction-case-q03","stem":"【日常生理】當人體生病發燒體溫升高時，常會伴隨心跳速率變快的現象，其主要生理原因為何？","options":["體溫升高會直接刺激竇房結與房室結，使其發出衝動的速率加快","體溫升高會刺激副交感神經釋放大量乙醯膽鹼","體溫升高會使浦金埃氏纖維傳導完全中斷","體溫升高會使心臟肌肉轉變為骨骼肌"],"answer":0,"hint":"溫度會影響節律細胞自發放電的速率。","nodeId":"cardiac-conduction-node-06","explain":"體溫升高（如發燒或激烈運動）能使竇房結與房室結細胞自發產生動作電位的速率加快，進而使心跳速率上升。"},{"id":"cardiac-conduction-case-q04","stem":"【日常生理】當人在靜坐冥想或安穩入睡時，延腦心跳抑制中樞經由迷走神經（副交感神經）作用於心臟，其末梢釋放的乙醯膽鹼對心跳有何影響？","options":["使心跳速率減慢，收縮強度減弱","使心跳速率飆升至每分鐘 150 次","使心室肌肉發生強直收縮","促進血液中甲狀腺素分泌"],"answer":0,"hint":"迷走神經屬於副交感神經，它對心跳的作用與交感神經相反。","nodeId":"cardiac-conduction-node-06","explain":"副交感神經（迷走神經）末梢釋放乙醯膽鹼（Acetylcholine），能降低竇房結與房室結的興奮性，使心跳速率減慢、心跳平緩。"},{"id":"cardiac-conduction-case-q05","stem":"【實驗生理】在解剖生理學實驗中，將離體蛙心取出放置於適當的生理鹽水中，心臟在沒有任何神經連接下仍能維持有節律的跳動。這展現了心臟特化心肌的何種特性？","options":["隨意運動性","自發性/自律性（Automaticity）","疲勞性","強直收縮性"],"answer":1,"hint":"沒有神經連接仍能規律跳動，說明心肌自己就能產生衝動。","nodeId":"cardiac-conduction-node-05","explain":"節律細胞（如竇房結）具有「自發性（Automaticity）」，在沒有外來神經刺激下，細胞膜能自動且有節律地去極化產生動作電位，維持離體心臟跳動。"}],"credits":["心臟傳導系統示意圖：課程平台自繪 SVG，CC0。","題目來源：教師提供之題目集（單元一）；內容發布前仍須由教師依指定課本審核。"]},{"conduction-pathway.svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 500\" role=\"img\" aria-label=\"心臟傳導系統：竇房結、房室結、房室束、左右束支與浦金埃氏纖維\">\u003cstyle>.wall{fill:#fbe3e3;stroke:#7a2e38;stroke-width:6}.cav{fill:#fff6f6;stroke:#c98b92;stroke-width:3}.path{fill:none;stroke:#b8a6c8;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.node{fill:#b8a6c8}.label{font:17px sans-serif;fill:#17212b}.small{font:15px sans-serif;fill:#4e5964}.hl{display:none}.hl .path{stroke:#e0a100;stroke-width:10}.hl .node{fill:#e0a100}.cap{display:none;font:bold 19px sans-serif;fill:#5b3b8c}[data-state=\"sa\"] .sa,[data-state=\"av\"] .av,[data-state=\"ventricle\"] .ventricle{display:block}\u003c/style>\n\u003cpath class=\"wall\" d=\"M130 95Q70 260 180 420Q280 490 400 405Q520 490 620 420Q730 260 670 95Q540 60 400 150Q260 60 130 95Z\"/>\n\u003crect class=\"cav\" x=\"160\" y=\"110\" width=\"190\" height=\"100\" rx=\"34\"/>\u003crect class=\"cav\" x=\"450\" y=\"110\" width=\"190\" height=\"100\" rx=\"34\"/>\n\u003cpath class=\"cav\" d=\"M170 245Q260 215 385 250L380 395Q280 450 180 380Z\"/>\u003cpath class=\"cav\" d=\"M415 250Q540 215 630 245L620 380Q520 450 420 395Z\"/>\n\u003crect x=\"200\" y=\"40\" width=\"50\" height=\"75\" rx=\"10\" fill=\"#dbe8f5\" stroke=\"#1769aa\" stroke-width=\"4\"/>\u003ctext class=\"small\" x=\"150\" y=\"32\">上腔靜脈\u003c/text>\n\u003ctext class=\"label\" x=\"215\" y=\"175\">右心房\u003c/text>\u003ctext class=\"label\" x=\"515\" y=\"175\">左心房\u003c/text>\u003ctext class=\"label\" x=\"220\" y=\"330\">右心室\u003c/text>\u003ctext class=\"label\" x=\"505\" y=\"330\">左心室\u003c/text>\n\u003cg>\u003cpath class=\"path\" d=\"M232 128Q300 175 382 232\"/>\u003cpath class=\"path\" d=\"M382 232L400 268\"/>\u003cpath class=\"path\" d=\"M400 268Q350 320 300 395\"/>\u003cpath class=\"path\" d=\"M400 268Q450 320 500 395\"/>\u003cpath class=\"path\" d=\"M300 395Q260 410 225 385M300 395Q290 430 320 440M500 395Q540 410 575 385M500 395Q510 430 480 440\"/>\u003ccircle class=\"node\" cx=\"232\" cy=\"128\" r=\"13\"/>\u003ccircle class=\"node\" cx=\"382\" cy=\"232\" r=\"12\"/>\u003c/g>\n\u003ctext class=\"label\" x=\"252\" y=\"120\">竇房結（SA）\u003c/text>\u003ctext class=\"label\" x=\"400\" y=\"226\">房室結（AV）\u003c/text>\u003ctext class=\"small\" x=\"410\" y=\"275\">房室束（希氏束）\u003c/text>\u003ctext class=\"small\" x=\"215\" y=\"470\">右束支→浦金埃氏纖維\u003c/text>\u003ctext class=\"small\" x=\"450\" y=\"470\">左束支→浦金埃氏纖維\u003c/text>\n\u003cg class=\"hl sa\">\u003ccircle class=\"node\" cx=\"232\" cy=\"128\" r=\"18\"/>\u003cpath class=\"path\" d=\"M232 128Q300 175 382 232\"/>\u003c/g>\n\u003cg class=\"hl av\">\u003ccircle class=\"node\" cx=\"382\" cy=\"232\" r=\"17\"/>\u003cpath class=\"path\" d=\"M382 232L400 268\"/>\u003c/g>\n\u003cg class=\"hl ventricle\">\u003cpath class=\"path\" d=\"M400 268Q350 320 300 395M400 268Q450 320 500 395M300 395Q260 410 225 385M300 395Q290 430 320 440M500 395Q540 410 575 385M500 395Q510 430 480 440\"/>\u003c/g>\n\u003ctext class=\"cap sa\" x=\"400\" y=\"496\" text-anchor=\"middle\">① 竇房結自發放電，衝動擴散到左右心房\u003c/text>\n\u003ctext class=\"cap av\" x=\"400\" y=\"496\" text-anchor=\"middle\">② 房室結傳導最慢（約 0.1 秒延遲），心房先把血擠入心室\u003c/text>\n\u003ctext class=\"cap ventricle\" x=\"400\" y=\"496\" text-anchor=\"middle\">③ 房室束→左右束支→浦金埃氏纖維（最快），心室同步收縮\u003c/text>\n\u003c/svg>\n","conduction-node.svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 260\">\u003crect width=\"600\" height=\"260\" rx=\"20\" fill=\"#fbf7ff\"/>\u003cpath d=\"M300 225C80 115 160 25 300 115C440 25 520 115 300 225Z\" fill=\"#f7d3d6\" stroke=\"#761d2a\" stroke-width=\"7\"/>\u003cpath d=\"M225 85Q260 110 290 128L300 150Q270 180 245 200M300 150Q330 180 355 200\" fill=\"none\" stroke=\"#5b3b8c\" stroke-width=\"8\" stroke-linecap=\"round\"/>\u003ccircle cx=\"225\" cy=\"85\" r=\"11\" fill=\"#e0a100\"/>\u003ccircle cx=\"290\" cy=\"128\" r=\"10\" fill=\"#e0a100\"/>\u003ctext x=\"300\" y=\"250\" text-anchor=\"middle\" font-size=\"20\" fill=\"#17212b\">心臟傳導系統示意\u003c/text>\u003c/svg>\n"});</script></body></html>
