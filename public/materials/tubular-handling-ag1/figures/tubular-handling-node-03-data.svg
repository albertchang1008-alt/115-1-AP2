<svg xmlns="http://www.w3.org/2000/svg" id="ud-tubular-handling-node-03" viewBox="0 0 1000 1050" role="img" aria-label="近曲小管的再吸收比例" font-family="PingFang TC,Noto Sans TC,sans-serif"><style>#ud-tubular-handling-node-03 text{font-size:50px;fill:#111}#ud-tubular-handling-node-03 .v{font-size:44px;fill:#333}</style><rect width="1000" height="1050" fill="white"/><text x="30" y="60" class="ka-label" data-label="近曲小管" style="fill:#b4233a;font-weight:700">近曲小管</text><text x="30" y="125">過濾出來的量，送回血液多少？</text><text x="250" y="185" class="v">0%</text><text x="970" y="185" class="v" text-anchor="end">100%</text><path d="M250 200V975" stroke="#999" stroke-width="3"/><path d="M970 200V975" stroke="#999" stroke-width="3" stroke-dasharray="10 10"/><g data-row="glucose"><text x="30" y="255" class="ka-label" data-label="葡萄糖">葡萄糖</text><rect x="250" y="215" width="720" height="50" rx="8" fill="#0072B2"/><text x="250" y="312" class="v">正常全部回收</text></g><g data-row="amino"><text x="30" y="385" class="ka-label" data-label="胺基酸">胺基酸</text><rect x="250" y="345" width="720" height="50" rx="8" fill="#0072B2"/><text x="250" y="442" class="v">正常全部回收</text></g><g data-row="na"><text x="30" y="515" class="ka-label" data-label="Na⁺">Na⁺</text><rect x="250" y="475" width="482.4" height="50" rx="8" fill="#56B4E9"/><text x="250" y="572" class="v">約 67%</text></g><g data-row="water"><text x="30" y="645" class="ka-label" data-label="水">水</text><rect x="250" y="605" width="540" height="50" rx="8" fill="#56B4E9"/><text x="250" y="702" class="v">約 75%（靠滲透作用）</text></g><g data-row="urea"><text x="30" y="775" class="ka-label" data-label="尿素">尿素</text><rect x="250" y="735" width="360" height="50" rx="8" fill="#E69F00"/><text x="250" y="832" class="v">部分回收</text></g><g data-row="creatinine"><text x="30" y="905" class="ka-label" data-label="肌酸酐">肌酸酐</text><rect x="250" y="865" width="8" height="50" fill="#999"/><text x="280" y="905" class="v">幾乎不回收</text></g><text x="30" y="1030" class="v">以每種物質過濾出來的量為 100%</text></svg>
