// 教材元件庫：由 content.json 產生單檔互動教材（六節點＋兩關題目＋SDK 回報）。
// 擴充點：lab.widget（例如 "ecg-sim"）與題型 type（例如 "label"），由 materials-src/widgets/ 提供。
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Fisher–Yates 洗牌（無偏差）
const shuffle = rows => {
  const a = [...rows];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const WIDGETS = { 'ecg-sim': () => window.EcgSim };
const QUESTION_TYPES = { label: () => window.EcgLabel };

function renderLab(lab, figures) {
  const widget = lab.widget && WIDGETS[lab.widget]?.();
  if (lab.widget) {
    return `<section class="lab"><h2>${esc(lab.title)}</h2><p>${esc(lab.intro)}</p><div class="lab-widget" data-widget="${esc(lab.widget)}">${widget ? widget.html(lab) : ''}</div></section>`;
  }
  return `<section class="lab"><h2>${esc(lab.title)}</h2><p>${esc(lab.intro)}</p>`
    + `<div class="state-figure" data-lab-state="${lab.states[0].id}" data-state="${lab.states[0].id}">${figures[lab.figure]}</div>`
    + `<div class="state-controls">${lab.states.map((x, i) => `<button data-lab-state="${x.id}" aria-pressed="${!i}">${esc(x.label)}</button>`).join('')}</div>`
    + `<p class="state-explain" aria-live="polite">${esc(lab.states[0].explain)}</p>`
    + `<h3>${esc(lab.predict.question)}</h3><div class="options predict">${lab.predict.options.map((o, i) => `<button data-answer="${i}">${esc(o)}</button>`).join('')}</div>`
    + `<p class="feedback" aria-live="polite"></p></section>`;
}

function renderQuestion(q) {
  const type = q.type && q.type !== 'mcq' ? QUESTION_TYPES[q.type]?.() : null;
  if (type) return `<h3>${esc(q.stem)}</h3><div class="q-widget" data-type="${esc(q.type)}">${type.html(q)}</div>`;
  return `<h3>${esc(q.stem)}</h3><div class="options">${shuffle(q.options.map((text, answer) => ({ text, answer }))).map(o => `<button data-answer="${o.answer}">${esc(o.text)}</button>`).join('')}</div><p class="feedback" aria-live="polite"></p>`;
}

function render(content, figures) {
  const stage = (rows, kind) => rows.map((q, i) => `<article class="stage" data-kind="${kind}" data-index="${i}" ${i ? 'hidden' : ''}>${renderQuestion(q)}</article>`).join('');
  return `<main class="kit" data-slug="${content.slug}">`
    + `<header class="hero"><p>${esc(content.label)}</p><h1>${esc(content.title)}</h1><p>${esc(content.subtitle)}</p></header>`
    + `<section class="stats">${content.stats.map(x => `<div class="tile"><strong>${esc(x.value)}</strong>${esc(x.label)}</div>`).join('')}</section>`
    + renderLab(content.lab, figures)
    + `<section><h2>知識節點</h2><div class="nodes">${content.nodes.map(n => `<button class="node-button" data-node="${n.id}" aria-expanded="false" aria-controls="detail-${n.id}"><img alt="" src="data:image/svg+xml,${encodeURIComponent(figures[n.figure])}"><strong>${esc(n.title)}</strong><br>${esc(n.summary)}</button>`).join('')}</div>`
    + content.nodes.map(n => `<article class="node-detail" id="detail-${n.id}" data-node-id="${n.id}" hidden><img class="node-figure" alt="${esc(n.title)} 示意圖" src="data:image/svg+xml,${encodeURIComponent(figures[n.figure])}"><h2>${esc(n.title)}</h2><p>${esc(n.concept)}</p><ul>${n.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul><div class="clinical"><strong>${esc(n.clinical.title)}</strong><br>${esc(n.clinical.text)}</div></article>`).join('')
    + `</section>`
    + `<section class="quiz"><h2>第一關｜先備知識</h2>${stage(content.foundation, 'foundation')}<h2>第二關｜情境應用</h2>${stage(content.cases, 'case').replace('data-index="0"', 'data-index="0" hidden')}</section>`
    + `<footer class="credits">${(content.credits || []).map(esc).join('<br>')}</footer></main>`;
}

function mount(content, figures) {
  document.body.innerHTML = render(content, figures);
  const CL = window.CourseLearning || { explore() {}, nodeTime() {}, answer() {}, hint() {}, complete() {} };

  // 知識節點：第一次展開送 explore；收合或分頁隱藏時送前景停留秒數
  const opened = new Map(), explored = new Set();
  document.querySelectorAll('[data-node]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.node, d = document.querySelector('#detail-' + id), was = d.hidden;
    d.hidden = !was; b.setAttribute('aria-expanded', String(was));
    if (was) { if (!explored.has(id)) { explored.add(id); CL.explore(id); } opened.set(id, performance.now()); }
    else { const start = opened.get(id); if (start) CL.nodeTime(id, (performance.now() - start) / 1000); opened.delete(id); }
  }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { for (const [id, start] of opened) CL.nodeTime(id, (performance.now() - start) / 1000); opened.clear(); }
  });

  // 情境實驗室
  if (content.lab.widget) {
    const root = document.querySelector('.lab-widget');
    WIDGETS[content.lab.widget]?.()?.mount(root, content.lab, CL);
  } else {
    document.querySelectorAll('button[data-lab-state]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.labState;
      const fig = document.querySelector('.state-figure');
      fig.dataset.labState = id; fig.dataset.state = id; // data-state 供圖檔內 CSS 切換狀態
      document.querySelectorAll('button[data-lab-state]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      document.querySelector('.state-explain').textContent = content.lab.states.find(x => x.id === id).explain;
    }));
    document.querySelector('.predict').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const ok = +b.dataset.answer === content.lab.predict.answer;
      b.parentElement.nextElementSibling.textContent = ok ? content.lab.predict.feedback : '再比對圖中的狀態與箭頭。';
    });
  }

  // 兩關題目：逐題答對才解鎖；第二關全部答對才送 complete
  let foundation = 0, cases = 0;
  const show = el => { el.hidden = false; el.dispatchEvent(new CustomEvent('stage-show')); };
  const advance = (stage, kind) => {
    stage.hidden = true;
    if (kind === 'foundation') {
      foundation++;
      const next = document.querySelector(`[data-kind="foundation"][data-index="${foundation}"]`);
      show(next || document.querySelector('[data-kind="case"][data-index="0"]'));
    } else {
      cases++;
      const next = document.querySelector(`[data-kind="case"][data-index="${cases}"]`);
      if (next) show(next); else CL.complete();
    }
  };
  document.querySelectorAll('.stage').forEach(stage => {
    const kind = stage.dataset.kind, rows = kind === 'foundation' ? content.foundation : content.cases;
    const q = rows[+stage.dataset.index];
    const type = q.type && q.type !== 'mcq' ? QUESTION_TYPES[q.type]?.() : null;
    if (type) { type.mount(stage.querySelector('.q-widget'), q, CL, () => advance(stage, kind)); return; }
    stage.addEventListener('click', e => {
      const b = e.target.closest('button[data-answer]'); if (!b) return;
      const ok = +b.dataset.answer === q.answer;
      CL.answer(q.id, ok);
      const feedback = stage.querySelector('.feedback');
      if (!ok) { CL.hint?.(q.id); feedback.textContent = `提示：${q.hint}`; return; }
      feedback.textContent = '答對，繼續下一題。';
      stage.querySelectorAll('button').forEach(x => { x.disabled = true; });
      setTimeout(() => advance(stage, kind), 250);
    });
  });
}

// 舊版三段節律圖（ecg-rate.svg）的狀態切換；保留相容
document.addEventListener('click', event => {
  const button = event.target.closest('button[data-lab-state]'); if (!button) return;
  const figure = document.querySelector('.state-figure'), state = button.dataset.labState; if (!figure) return;
  figure.querySelectorAll('.slow,.rest,.fast').forEach(group => { group.style.display = group.classList.contains(state) ? 'block' : 'none'; });
});
document.addEventListener('DOMContentLoaded', () => {
  const figure = document.querySelector('.state-figure');
  figure?.querySelector('.slow')?.style.setProperty('display', 'block');
});

mount({"slug":"cardiac-cycle","version":"v1","title":"心動週期","label":"心動週期","subtitle":"一次心跳裡，壓力差如何決定瓣膜開關、血液流向與心音。","stats":[{"value":"約 0.8 秒","label":"安靜時一次心動週期"},{"value":"約 70%","label":"心房收縮前的被動充血"},{"value":"約 70 ml","label":"安靜時的心搏量"},{"value":"CO = HR × SV","label":"心輸出量"}],"lab":{"title":"情境實驗室｜瓣膜什麼時候開、什麼時候關","intro":"依序切換四個時期，觀察兩組瓣膜的狀態、血液流向與心音出現的時機。","figure":"cardiac-cycle.svg","states":[{"id":"fill","label":"心室充血期","explain":"心室壓低於心房壓：房室瓣開、半月瓣關，血液大部分被動流入心室；最後心房收縮再補 20~30%。"},{"id":"ivc","label":"等容心室收縮期","explain":"心室開始收縮，壓力大於心房壓 → 房室瓣關閉（第一心音 S1），但仍低於動脈壓，半月瓣未開。"},{"id":"eject","label":"心室射血期","explain":"心室壓大於動脈壓 → 半月瓣打開，血液射入主動脈；每次射出的量是心搏量（約 70 ml）。"},{"id":"ivr","label":"等容心室舒張期","explain":"心室開始舒張，壓力低於動脈壓 → 半月瓣關閉（第二心音 S2），房室瓣仍關，容積不變。"}],"predict":{"question":"等容心室收縮期時，兩組瓣膜的狀態是？","options":["兩組都關閉","兩組都開啟"],"answer":0,"feedback":"正確：「等容」就是兩組瓣膜都關，心室容積不變、壓力上升。"}},"nodes":[{"id":"cardiac-cycle-node-01","tag":"充血","title":"心室充血期：被動充血","summary":"房室瓣開、半月瓣關。","figure":"cycle-node.svg","concept":"心舒張末期心房與心室都舒張，心室壓低於心房壓，房室瓣開啟、半月瓣關閉，血液靠壓力差被動流入心室。","points":["約 70% 的心室充血量在心房收縮前就被動流入。","此時動脈壓高於心室壓，所以半月瓣保持關閉。","瓣膜的開關完全由兩側壓力差決定。"],"clinical":{"title":"學習重點","text":"判斷瓣膜狀態時，先比較瓣膜兩側哪一邊壓力高。"}},{"id":"cardiac-cycle-node-02","tag":"心房收縮","title":"心房收縮與心房踢","summary":"主動補滿最後 20~30%。","figure":"cycle-node.svg","concept":"心舒張末期心房主動收縮，把剩餘約 20~30% 的血液推入心室，稱為心房踢（atrial kick），讓心室達到最大充血量（EDV）。","points":["心房收縮發生在心室收縮之前。","心房踢是「主動充血」，補在被動充血之後。","充血結束時的心室容積稱為舒張末期容積（EDV，約 130 ml）。"],"clinical":{"title":"學習重點","text":"被動充血約 70%＋心房踢約 20~30%，合起來就是一次完整的充血。"}},{"id":"cardiac-cycle-node-03","tag":"等容收縮","title":"等容心室收縮期與第一心音","summary":"兩組瓣膜都關，S1 出現。","figure":"cycle-node.svg","concept":"心室開始收縮，壓力大於心房壓使房室瓣關閉，但尚小於動脈壓、半月瓣未開，心室容積不變而壓力急升。","points":["房室瓣關閉產生第一心音（S1，Lubb）。","S1 音調較低、持續時間較長。","「等容」＝容積不變，兩組瓣膜同時關閉。"],"clinical":{"title":"學習重點","text":"S1 標記心室收縮期的開始。"}},{"id":"cardiac-cycle-node-04","tag":"射血","title":"心室射血期與心搏量","summary":"半月瓣開，射出約 70 ml。","figure":"cycle-node.svg","concept":"心室壓超過動脈壓時半月瓣打開，血液射入主動脈與肺動脈；每次收縮射出的血量稱為心搏量（SV）。","points":["安靜時左心室心搏量約 70 ml。","SV ＝ EDV − ESV，例如 130 − 60 ＝ 70 ml。","射血後殘留在心室的血量稱為收縮末期容積（ESV，約 60 ml）。"],"clinical":{"title":"學習重點","text":"EDV 是「裝滿時」、ESV 是「射完後」，兩者相減才是真正射出的量。"}},{"id":"cardiac-cycle-node-05","tag":"等容舒張","title":"等容心室舒張期與第二心音","summary":"半月瓣關閉，S2 出現。","figure":"cycle-node.svg","concept":"心室開始舒張，壓力降到低於動脈壓，動脈血逆流衝擊使半月瓣關閉；房室瓣仍關，心室容積不變、壓力快速下降。","points":["半月瓣關閉產生第二心音（S2，Dupp）。","S2 音調較高、時間較短。","心室壓降到低於心房壓時，房室瓣才再打開，進入下一次充血。"],"clinical":{"title":"學習重點","text":"S1＝房室瓣關（收縮開始）；S2＝半月瓣關（舒張開始）。"}},{"id":"cardiac-cycle-node-06","tag":"心輸出量","title":"心率、心輸出量與舒張期","summary":"CO = HR × SV；心跳快時舒張期縮短。","figure":"cycle-node.svg","concept":"心輸出量（CO）＝ 心率（HR）× 心搏量（SV）。心跳加快時心動週期縮短，其中縮短最多的是舒張期（充血期）。","points":["HR 70 次/分 × SV 70 ml ≈ 4,900 ml/分（約 4.9 公升/分）。","安靜時一次心動週期約 0.8 秒，其中舒張期較長。","心跳很快時舒張期被壓縮，心室充血時間變少。"],"clinical":{"title":"學習重點","text":"「心跳變快，縮短最多的是舒張期」也可以在心電圖教材的模擬器裡看到。"}}],"foundation":[{"id":"cardiac-cycle-foundation-q01","stem":"在心舒張末期（被動充血期）時，心房與心室均處於舒張狀態，此時心臟內瓣膜的開啟與閉合狀態為何？","options":["房室瓣開啟，半月瓣關閉","房室瓣關閉，半月瓣開啟","房室瓣與半月瓣均開啟","房室瓣與半月瓣均關閉"],"answer":0,"hint":"比較心房壓、心室壓與動脈壓：哪一組瓣膜兩側是心房壓比較高？","nodeId":"cardiac-cycle-node-01","explain":"心舒張末期心房壓略大於心室壓，二尖瓣與三尖瓣（房室瓣）開啟，血液流入心室；而大動脈上的半月瓣則保持關閉。"},{"id":"cardiac-cycle-foundation-q02","stem":"在一個完整的心動週期中，約有多少比例的心室充血量是在「心房收縮前」即靠壓力差被動流入心室的？","options":["約 10%","約 30%","約 70%","約 100%"],"answer":2,"hint":"大部分充血在心房還沒收縮時就完成了。","nodeId":"cardiac-cycle-node-01","explain":"約 70% 的血液在心房收縮前（心舒張末期）即被動流入心室；剩餘約 20~30% 的血液才是靠心房收縮主動擠入。"},{"id":"cardiac-cycle-foundation-q03","stem":"心室開始收縮時，當心室內壓力剛好大於心房壓促使房室瓣關閉，但壓力尚小於動脈壓致半月瓣未開，此時心室處於何種時期？","options":["心房收縮期","等容心室收縮期（Isovolumetric contraction）","心室射血期","等容心室舒張期"],"answer":1,"hint":"兩組瓣膜都關、容積不變，這個時期名稱裡有「等容」。","nodeId":"cardiac-cycle-node-03","explain":"房室瓣關閉而半月瓣未開時，四組瓣膜全關，血液無法進出，心室容積維持不變但壓力快速升高，稱為「等容心室收縮期」。"},{"id":"cardiac-cycle-foundation-q04","stem":"聽診心音時，第一心音（S1; Lubb）主要是在哪一個時期、由哪一組瓣膜關閉撞擊所產生的聲音？","options":["心室射血期；半月瓣關閉","等容心室收縮期開始；房室瓣關閉","心房收縮期；二尖瓣開啟","等容心室舒張期；半月瓣關閉"],"answer":1,"hint":"S1 發生在心室收縮一開始，是心房與心室之間的瓣膜關閉。","nodeId":"cardiac-cycle-node-03","explain":"等容收縮期開始時，心室壓大於心房壓迫使房室瓣（二尖瓣與三尖瓣）關閉，血液撞擊產生音調較低且長的第一心音（S1）。"},{"id":"cardiac-cycle-foundation-q05","stem":"心室進入射血期（Ventricular ejection）時，左心室每次收縮射入主動脈的血量稱為「心搏量（Stroke Volume, SV）」，安靜狀態下正常值約為多少？","options":["約 30 ml","約 70 ml","約 130 ml","約 500 ml"],"answer":1,"hint":"心搏量＝EDV − ESV，約 130 − 60。","nodeId":"cardiac-cycle-node-04","explain":"正常成年人在安靜狀態下，左心室每次收縮射出的心搏量（SV）約為 70 ml。"},{"id":"cardiac-cycle-foundation-q06","stem":"當心室開始舒張，心室內壓力降至小於大動脈壓時，動脈血逆流衝擊並迫使半月瓣關閉，此時聽診產生的心音為何？","options":["第一心音（S1）","第二心音（S2）","第三心音（S3）","第四心音（S4）"],"answer":1,"hint":"心室舒張開始時關閉的是動脈端的瓣膜，對應的是第二個心音。","nodeId":"cardiac-cycle-node-05","explain":"等容舒張期心室壓低於動脈壓，動脈血回流衝擊使半月瓣（主動脈瓣及肺動脈瓣）關閉，產生音調高而短的第二心音（S2; Dupp）。"}],"cases":[{"id":"cardiac-cycle-case-q01","stem":"【日常生理】當學生在跑 100 公尺短跑時，心跳加快致心動週期（安靜時約 0.8 秒）顯著縮短。請問心動週期縮短時，受影響縮短最顯著的是哪一個時期？","options":["心室收縮期","心舒張期（心室充血期）","等容收縮期","心房收縮期"],"answer":1,"hint":"心跳加快時，收縮所需時間變化不大，被壓縮的是哪一段？","nodeId":"cardiac-cycle-node-06","explain":"當心率加快時，心動週期總時間縮短，其中以「心舒張期」的時間壓縮最為顯著，這會使心室充血的時間減少。"},{"id":"cardiac-cycle-case-q02","stem":"【聽診生理】以聽診器聽診正常人的心音時，比較第一心音（S1）與第二心音（S2）的聲音特徵，下列敘述何者正確？","options":["S1 音調較低、持續時間較長；S2 音調較高亢、時間較短","S1 音調較高亢、時間較短；S2 音調較低、時間較長","S1 與 S2 的音調與時間完全一模一樣","S1 主因半月瓣關閉，S2 主因房室瓣關閉"],"answer":0,"hint":"S1 是「Lubb」、S2 是「Dupp」，想想哪個比較低沉、哪個比較短促。","nodeId":"cardiac-cycle-node-05","explain":"第一心音（S1，房室瓣關閉）像 \"Lubb\"，音調較低且持續時間較長；第二心音（S2，半月瓣關閉）像 \"Dupp\"，音調高而短。"},{"id":"cardiac-cycle-case-q03","stem":"【生理計算】若某位成年人休息時的心跳速率（HR）為 70 次/分，每次心室收縮的心搏量（SV）為 70 ml/次。請問該患者每分鐘的心輸出量（Cardiac Output, CO）約為多少？","options":["約 1,400 ml/min","約 4,900 ml/min（約 4.9 公升/分）","約 7,000 ml/min","約 12,000 ml/min"],"answer":1,"hint":"把 HR 乘上 SV，注意單位是 ml/min。","nodeId":"cardiac-cycle-node-06","explain":"心輸出量（CO）= 心率（HR）× 心搏量（SV）。即 70 次/分 × 70 ml/次 = 4,900 ml/min（約 4.9 L/min）。"},{"id":"cardiac-cycle-case-q04","stem":"【生理邏輯】心室充血結束時心室內的總血量稱為「舒張末期容積（EDV，約 130ml）」，而射血後殘留在心室內的血量稱為「收縮末期容積（ESV，約 60ml）」。兩者相減（EDV - ESV）在生理學上代表什麼？","options":["心輸出量（CO）","心搏量（Stroke Volume, SV）","心率（HR）","血壓差"],"answer":1,"hint":"充滿時的量減去射完後殘留的量，就是每次真正射出的量。","nodeId":"cardiac-cycle-node-04","explain":"心室充血總量（EDV）扣除收縮後殘留量（ESV），即為該次心室真正射出的血液量，稱為心搏量（SV = EDV - ESV = 130 - 60 = 70 ml）。"},{"id":"cardiac-cycle-case-q05","stem":"【生理機制】心舒張末期時，心房發生主動收縮（Atrial systole），將剩餘 20~30% 的血液快速推進心室，這在生理學上發揮了何種作用？","options":["主動充血作用（心房踢 Atrial kick），補滿心室容量","阻斷動脈血流","促使半月瓣開啟射血","降低心肌氧氣消耗"],"answer":0,"hint":"心房在心舒張末期主動收縮，替心室「補滿」血量。","nodeId":"cardiac-cycle-node-02","explain":"心房收縮能主動將剩餘約 20~30% 的血液擠入心室，稱為「心房踢（Atrial kick）/ 主動充血」，協助心室達到最大充血量。"}],"credits":["心動週期示意圖：課程平台自繪 SVG，CC0。","題目來源：教師提供之題目集（單元二）；內容發布前仍須由教師依指定課本審核。"]},{"cardiac-cycle.svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 800 500\" role=\"img\" aria-label=\"左心房、左心室與主動脈的瓣膜狀態，依心動週期時期切換\">\u003cstyle>.wall{fill:#fbe3e3;stroke:#7a2e38;stroke-width:6}.label{font:19px sans-serif;fill:#17212b}.small{font:16px sans-serif;fill:#4e5964}.open{stroke:#176b45;stroke-width:9;stroke-linecap:round}.shut{stroke:#a71930;stroke-width:10;stroke-linecap:round}.arrow{fill:none;stroke:#a71930;stroke-width:8;marker-end:url(#m)}.snd{font:bold 28px sans-serif;fill:#5b3b8c}.st{display:none}.cap{font:bold 19px sans-serif;fill:#5b3b8c}.tag{font:bold 15px sans-serif}[data-state=\"fill\"] .fill,[data-state=\"ivc\"] .ivc,[data-state=\"eject\"] .eject,[data-state=\"ivr\"] .ivr{display:block}\u003c/style>\u003cdefs>\u003cmarker id=\"m\" markerUnits=\"userSpaceOnUse\" markerWidth=\"22\" markerHeight=\"22\" refX=\"12\" refY=\"11\" orient=\"auto\">\u003cpath d=\"M0,0 L22,11 L0,22z\" fill=\"#a71930\"/>\u003c/marker>\u003c/defs>\n\u003crect class=\"wall\" x=\"150\" y=\"50\" width=\"250\" height=\"135\" rx=\"40\"/>\u003ctext class=\"label\" x=\"240\" y=\"125\">左心房\u003c/text>\n\u003cpath class=\"wall\" d=\"M150 235H400V255H470V305H400L385 395Q275 465 165 395Z\"/>\u003ctext class=\"label\" x=\"240\" y=\"340\">左心室\u003c/text>\n\u003crect class=\"wall\" x=\"470\" y=\"45\" width=\"110\" height=\"265\" rx=\"28\"/>\u003ctext class=\"label\" x=\"490\" y=\"35\">主動脈\u003c/text>\n\u003ctext class=\"small\" x=\"20\" y=\"216\">二尖瓣\u003c/text>\u003ctext class=\"small\" x=\"20\" y=\"238\">（房室瓣）\u003c/text>\n\u003ctext class=\"small\" x=\"600\" y=\"276\">主動脈瓣\u003c/text>\u003ctext class=\"small\" x=\"600\" y=\"298\">（半月瓣）\u003c/text>\n\u003cg class=\"st fill\">\u003cpath class=\"open\" d=\"M185 200l-15 32M365 200l15 32\"/>\u003cpath class=\"shut\" d=\"M470 258v44\"/>\u003cpath class=\"arrow\" d=\"M275 150v125\"/>\u003ctext class=\"tag\" x=\"130\" y=\"265\" fill=\"#176b45\">開\u003c/text>\u003ctext class=\"tag\" x=\"625\" y=\"325\" fill=\"#a71930\">關\u003c/text>\u003ctext class=\"cap\" x=\"400\" y=\"475\" text-anchor=\"middle\">心室充血期：房室瓣開、半月瓣關；約 70% 血液被動流入心室\u003c/text>\u003c/g>\n\u003cg class=\"st ivc\">\u003cpath class=\"shut\" d=\"M165 210H385\"/>\u003cpath class=\"shut\" d=\"M470 258v44\"/>\u003ctext class=\"snd\" x=\"200\" y=\"285\">S1\u003c/text>\u003ctext class=\"tag\" x=\"130\" y=\"265\" fill=\"#a71930\">關\u003c/text>\u003ctext class=\"tag\" x=\"625\" y=\"325\" fill=\"#a71930\">關\u003c/text>\u003ctext class=\"cap\" x=\"400\" y=\"475\" text-anchor=\"middle\">等容心室收縮期：兩組瓣膜都關閉，容積不變、壓力急升（S1）\u003c/text>\u003c/g>\n\u003cg class=\"st eject\">\u003cpath class=\"shut\" d=\"M165 210H385\"/>\u003cpath class=\"open\" d=\"M470 258l24-14M470 302l24 14\"/>\u003cpath class=\"arrow\" d=\"M300 330Q330 280 420 280H525V80\"/>\u003ctext class=\"tag\" x=\"130\" y=\"265\" fill=\"#a71930\">關\u003c/text>\u003ctext class=\"tag\" x=\"625\" y=\"325\" fill=\"#176b45\">開\u003c/text>\u003ctext class=\"cap\" x=\"400\" y=\"475\" text-anchor=\"middle\">心室射血期：心室壓＞主動脈壓，半月瓣開，射出心搏量（約 70 ml）\u003c/text>\u003c/g>\n\u003cg class=\"st ivr\">\u003cpath class=\"shut\" d=\"M165 210H385\"/>\u003cpath class=\"shut\" d=\"M470 258v44\"/>\u003ctext class=\"snd\" x=\"420\" y=\"240\">S2\u003c/text>\u003ctext class=\"tag\" x=\"130\" y=\"265\" fill=\"#a71930\">關\u003c/text>\u003ctext class=\"tag\" x=\"625\" y=\"325\" fill=\"#a71930\">關\u003c/text>\u003ctext class=\"cap\" x=\"400\" y=\"475\" text-anchor=\"middle\">等容心室舒張期：兩組瓣膜都關閉，心室壓快速下降（S2）\u003c/text>\u003c/g>\n\u003c/svg>\n","cycle-node.svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 260\">\u003crect width=\"600\" height=\"260\" rx=\"20\" fill=\"#fbf7ff\"/>\u003cpath d=\"M40 170H120Q150 170 160 150L190 60Q205 40 225 60L270 150Q280 170 310 170H560\" fill=\"none\" stroke=\"#a71930\" stroke-width=\"7\" stroke-linecap=\"round\"/>\u003cpath d=\"M40 190H560\" stroke=\"#b8a6c8\" stroke-width=\"4\"/>\u003ctext x=\"150\" y=\"215\" font-size=\"18\" fill=\"#5b3b8c\">收縮\u003c/text>\u003ctext x=\"400\" y=\"215\" font-size=\"18\" fill=\"#1769aa\">舒張（充血）\u003c/text>\u003ctext x=\"300\" y=\"250\" text-anchor=\"middle\" font-size=\"20\" fill=\"#17212b\">心動週期示意\u003c/text>\u003c/svg>\n"});</script></body></html>
