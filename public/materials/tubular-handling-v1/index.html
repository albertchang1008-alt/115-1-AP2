}
html,
body {

}
body {

}
button {

  border: 1px solid #adc8d6;
  border-radius: 10px;
  background: #fff;
  padding: 10px 14px;
  cursor: pointer;
  min-width: 0;
  overflow-wrap: anywhere;
}
button:hover {
  border-color: #317c99;
}
button:focus-visible {
  outline: 3px solid #d4a428;
  outline-offset: 2px;
}
button:disabled {
  opacity: 0.6;

}
.selected {
  background: #e4f3f8;
  border: 2px solid #246b86;
}
.wrong {

}
h1 {

  line-height: 1.35;
}
h2 {

  line-height: 1.4;
}
.student-screen {
  height: 100dvh;
  min-height: 0;
  max-width: 1440px;
  margin: auto;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 10px;
  padding: 14px;
}
.student-header {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.heading-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}
.heading-row h1 {
  flex: 1;
}
.heading-row button {
  flex: none;
  font-size: 16px;
  padding: 6px 10px;
}
.recognition {
  background: #e5f2f7;
  border-left: 4px solid #669bac;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 15px;
  line-height: 1.45;
  display: grid;
  gap: 4px;
}
.hint-box {
  background: #fff6d9;
  border: 1px solid #e2ca7e;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 17px;
  line-height: 1.4;
}
.student-main {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  gap: 14px;
}
.diagram-region {
  min-height: 0;
  min-width: 0;
  background: #fff;
  border: 1px solid #d1e1e9;
  border-radius: 16px;
  padding: 12px;
  display: flex;
  align-items: stretch;
  justify-content: center;
}
.response-region {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 16px;
  padding: 8px 8px 90px;
}
.response-region:empty {
  display: none;
}
.student-main:has(.response-region:empty) {
  grid-template-columns: 1fr;
}
.student-footer {
  min-height: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding-right: 90px;
  font-size: 17px;
}
.student-footer button,
#start,
#enter-assessment {
  background: #19576d;
  color: #fff;
  font-weight: 700;
  padding: 10px 26px;
}
.match-layout {
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  gap: 10px;
  width: 100%;
  min-height: 0;
}
.match-board {
  position: relative;
  min-height: 0;
}
.student-svg {
  width: 100%;
  height: 100%;
  display: block;
  position: absolute;
  inset: 0;
}
.work-slot {
  position: absolute;
  left: 5%;
  width: 90%;
  display: flex;
  align-items: center;
  justify-content: space-around;
  gap: 12px;
  background: transparent;
  border: 1px dashed #a3c3d0;
  font-size: 17px;
  padding: 8px;
  line-height: 1.35;
}
.work-slot strong {
  color: #166783;
  font-weight: 700;
  flex: none;
}
.card-tray {
  display: flex;
  gap: 10px;
  justify-content: center;
}
.card-tray button {

}
.answer-options {

}

}
.script-feedback {

  border-radius: 9px;

  line-height: 1.45;
}
.script-feedback.error {

}
.script-feedback.success {

}
.science-board {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 0;
}
.science-label {
  position: absolute;
  left: 35%;
  top: 40%;
  width: 30%;

}
.science-control {

  bottom: 2%;
  left: 12%;
  width: 76%;
  text-align: center;
}
.science-control button {
  width: 100%;
}
.column-labels {
  position: absolute;
  top: 3%;
  left: 1%;
  right: 1%;

  grid-template-columns: 29fr 30fr 29fr;
  gap: 5%;

  text-align: center;
}
.reaction-labels {
  position: absolute;
  top: 24%;
  left: 5%;

  grid-template-columns: 1fr 1fr;
  align-items: center;
  text-align: center;
  font-weight: 700;
  font-size: 20px;
}
[data-arrow] {
  cursor: pointer;
}
.arrow-wrong rect {
  fill: #fff0f4;
  stroke: #c32b49;
  stroke-width: 0.6;
}
[data-svg-label] {
  paint-order: stroke;
  stroke: #fff;
  stroke-width: 1.1;
  stroke-linejoin: round;
  fill: #174b60;
  pointer-events: none;
}
.thick {
  stroke-width: 3;
}
.animate-flow {
  stroke-dasharray: 3 1;
  animation: s-flow 0.8s linear 1;
}
@keyframes s-flow {
  from {
    stroke-dashoffset: 15;
  }
  to {
    stroke-dashoffset: 0;
  }
}
.arrow-hint-ring {
  fill: none;
  stroke: #267991;
  stroke-width: 1.2;
  animation: ringPulse 1.5s ease-out infinite;
  pointer-events: none;
}
@keyframes ringPulse {
  0% {
    r: 3;
    opacity: 1;
    stroke-width: 1.5;
  }
  100% {
    r: 8;
    opacity: 0;
    stroke-width: 0.5;
  }
}
.arrow-badge-bg {
  pointer-events: none;
}
.quiz-note {
  font-size: 16px;
  line-height: 1.4;
  font-weight: 700;
  color: #175260;
  background: #eaf5f8;
  border: 1px solid #b8dbe5;
  border-radius: 9px;

}
.student-dock {

.script-map {
  position: relative;

  height: 100%;

}
.script-map svg {
  position: absolute;

}

.intro-screen {

/* Matching: compact role rows, explicit menus, no drag-and-drop or answer exposure. */
.matching-ui {
  display: grid;
  gap: 8px;
  min-width: 0;
}
.matching-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: calc(14px * var(--font-scale, 1));
}
.matching-tools button {
  padding: 6px 9px;
}
.matching-row {
  display: grid;
  grid-template-columns: minmax(72px, 0.45fr) minmax(0, 1.55fr);
  gap: 6px;
  padding: 5px;
  border: 1px solid #c1d6df;
  border-radius: 10px;
  background: #fff;
}
.matching-row button {
  min-height: 44px;
  padding: 6px;
  font-size: calc(15px * var(--font-scale, 1));
  text-align: left;
}
.matching-rows {
  display: grid;
  gap: 6px;
}
.matching-row small {
  grid-column: 1/-1;
  font-size: calc(14px * var(--font-scale, 1));
}
.matching-row.fixed {
  border-color: #27836a;
  background: #edf8f2;
}
.active-row {
  outline: 3px solid #b58920;
}
.matching-reference {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-around;
  gap: 8px;
}
.reference-block {
  flex: 1;
  border: 2px solid #a7c8d6;
  border-radius: 18px;
  padding: 20px 6px;
  text-align: center;
  background: #eff6fa;
  font-size: calc(16px * var(--font-scale, 1));
}
.reference-block.lit {
  background: #dcf5df;
  border-color: #27836a;
  box-shadow: 0 0 12px #6bbb86;
}
.matching-guide {
  background: #fff5d5;
  border: 2px solid #c79826;
  border-radius: 10px;
  padding: 8px;
  font-size: calc(14px * var(--font-scale, 1));
}
.matching-guide > div {
  display: flex;
  gap: 6px;
  margin-top: 5px;
}
.matching-guide button {
  padding: 5px 8px;
}
.guide-1 .matching-row > button:first-child {
  outline: 2px solid #b58920;
}
.guide-1 .matching-row > button:nth-child(2) {
  opacity: 0.6;
}
.match-overlay {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: #163a4c88;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
}
.matching-menu {
  width: min(560px, 100%);
  display: grid;
  gap: 8px;
  background: white;
  border-radius: 14px;
  border: 2px solid #397b91;
  padding: 14px;
}
.matching-menu button {
  text-align: left;
  font-size: calc(16px * var(--font-scale, 1));
  min-height: 44px;
}
.matching-menu small {
  display: block;
  font-size: calc(14px * var(--font-scale, 1));
  color: #596f7b;
}
.matching-instruction {
  font-size: calc(16px * var(--font-scale, 1));
  font-weight: bold;
}

.matching-swap {

/* In-page choice menus: the active row expands, so phones keep the reference diagram. */
.matching-row .matching-menu, .matching-feedback { grid-column: 1 / -1; width: 100%; }
.matching-row .matching-menu { padding: 6px; gap: 5px; }
.matching-rows.picking .matching-row:not(.active-row) { display: none; }
.matching-feedback { font-size: 14px; line-height: 1.25; }
.matching-screen .diagram-region { flex-shrink: 0; }

.matching-row.wrong > small { display: none; }
.matching-row.wrong > [data-match-open] { display:none; }
.matching-row.wrong > .matching-feedback { grid-column:2;grid-row:1;align-self:center; }

.acid-teacher-reference {position:relative;flex:1;min-height:0;width:100%;}
.acid-teacher-reference .teacher-svg {position:absolute;inset:0;width:100%;height:100%;}

    .map((id, row) => {
      const fixed = m.locked.includes(row),
        value = m.values[row],
        active = ui.openRow === row;
      const menu =
        active && !ui.pendingSwap
          ? `<section class="matching-menu" aria-label="選擇工作說明">${m.order
              .map((value) => {
                const used = n.unique === false ? -1 : m.values.findIndex((v) => v === value);
                return `<button data-match-choice="${value}">${txt(n.slots[value])}${used >= 0 && used !== row ? `<small>${mi('used')} ${txt(n.cards[used])}</small>` : ''}</button>`;
              })
              .join('')}${button('match-close', mi('cancel'))}</section>`
          : '';
      return `<div class="matching-row ${errors.includes(row) ? 'wrong' : ''} ${fixed ? 'fixed' : ''} ${active ? 'active-row' : ''}">
      <button data-match-role="${row}" ${fixed ? 'disabled' : ''} aria-expanded="${active}">${txt(id)}</button>
      <button data-match-open="${row}" ${fixed ? 'disabled' : ''} aria-expanded="${active}">${value === null ? mi('pick') : txt(n.slots[value])}</button>
      ${errors.includes(row) ? `<small>${mi('wrong')}</small><p class="matching-feedback" data-row-feedback="${row}">${(m.feedback?.[row] || []).map(txt).join(' ')}</p>` : ''}${menu}
      ${ui.pendingSwap?.row === row ? `<div class="matching-swap" role="status"><p>${mi('used')} ${txt(n.cards[ui.pendingSwap.other])}</p>${button('match-swap', mi('swap'))}${button('match-cancel', mi('cancel'))}</div>` : ''}</div>`;
    })
    .join('');
  return `<section class="matching-ui"><div class="matching-tools">${mi('progress' + count)}${button('match-help', mi('help'))}</div>${guide}<div class="matching-rows guide-${ui.guideStep || 0} ${ui.openRow !== null && !ui.pendingSwap ? 'picking' : ''}">${rows}</div>${!m.complete && !retry ? `<button id="match-check" ${count < n.cards.length ? 'disabled' : ''}>${mi('check')}</button>` : m.complete ? `<p role="status">${mi('correct')}</p>` : ''}</section>`;
}
function bindStudentMatching({ n, m, ui, render, save, closeGuide, onCheck }) {
  const by = (id) => document.getElementById(id);
  const close = () => {
    ui.pendingSwap = null;
    ui.openRow = null;
    if (ui.guideStep === 2) ui.guideStep = 1;
    render();
  };
  document.querySelectorAll('[data-match-role],[data-match-open]').forEach(
    (b) =>
      (b.onclick = () => {
        const row = Number(b.dataset.matchRole ?? b.dataset.matchOpen);
        if (m.locked.includes(row)) return;
        ui.openRow = row;
        ui.pendingSwap = null;
        if (ui.guideStep === 1) ui.guideStep = 2;
        render();
        by('match-close')?.focus();
      }),
  );
  document.querySelectorAll('[data-match-choice]').forEach(
    (b) =>
      (b.onclick = () => {
        const value = Number(b.dataset.matchChoice),
          other = n.unique === false ? -1 : m.values.findIndex((v) => v === value);
        if (other >= 0 && other !== ui.openRow) {
          ui.pendingSwap = { row: ui.openRow, other, value };
          render();
          by('match-swap')?.focus();
          return;
        }
        m.values[ui.openRow] = value;
        ui.openRow = null;
        if (ui.guideStep === 2) ui.guideStep = 3;
        save();
        render();
      }),
  );
  if (by('match-swap'))
    by('match-swap').onclick = () => {
      const { row, other, value } = ui.pendingSwap;
      if (m.locked.includes(other)) return;
      m.values[other] = m.values[row];
      m.values[row] = value;
      ui.pendingSwap = null;
      ui.openRow = null;
      if (ui.guideStep === 2) ui.guideStep = 3;
      save();
      render();
    };
  for (const id of ['match-cancel', 'match-close']) if (by(id)) by(id).onclick = close;
  if (by('match-help'))
    by('match-help').onclick = () => {
      ui.guideStep = m.complete ? 3 : 1;
      render();
    };
  for (const id of ['match-skip', 'match-understood']) if (by(id)) by(id).onclick = closeGuide;
  if (by('match-check'))
    by('match-check').onclick = () => {
      if (m.values.some((v) => v === null)) return;
      const wrong = m.values
        .map((v, row) => (v !== (n.expected?.[row] ?? row) ? row : -1))
        .filter((v) => v >= 0);
      m.complete = !wrong.length;
      m.locked = m.complete ? n.cards.map((_, row) => row) : [];
      ui.guideStep = null;
      onCheck(wrong);
    };
  document.querySelector('.matching-menu')?.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') close();
  });
}

// All coordinates use the original raster frame, then project through the crop.
function teacherPoint(asset, label, index) {
  const aliases = {'環較長':'長環','環較短':'短環','足細胞（鮑氏囊臟層）':'足細胞','腎盂交接處':'腎盂交接','髂外動脈及靜脈交叉處':'髂外血管交叉','進入膀胱處':'進入膀胱','粒子多的一邊':'粒子較多','粒子少的一邊':'粒子較少','打開 ANP 開關，觀察腎臟的變化。':'ANP'};
  const point = asset.positions?.[index] || asset.anchors[aliases[label] || label];
  if (!point) throw Error('Unmapped teacher hotspot: '+asset.key+' '+label);
  const [x,y] = point, [cx,cy] = asset.crop;
  return [x/100*asset.width-cx,y/100*asset.height-cy];
}
function renderTeacherFigure(asset, {state={},step={},txt}={}) {

  if(asset.bodyClip) {

  }
  if(asset.slug==='urine-concentration' && asset.src.endsWith('-90.png')) {
    const sx=asset.width/100,sy=asset.height/100;
    overlays+='<path data-cortex-boundary d="M20 '+35*sy+'H'+(asset.width-20)+'" stroke="#765348" stroke-width="2" stroke-dasharray="6 5" fill="none"/>';
    overlays+=[48,62,76,90].map((y,i)=>`<path data-gradient-tick d="M${(14-i*2)*sx} ${y*sy}H${17*sx}" stroke="#765348" stroke-width="3"/>`).join('');

    if(visible&&asset.current==='loop-up')overlays+=[48,62,76].map(y=>transport(63,73,y,'NaCl')).join('');
    if(visible&&asset.current==='adh')overlays+=[48,62,76].map(y=>`<rect data-water-channel x="${77*sx}" y="${y*sy-9}" width="${8*sx}" height="18" rx="6" fill="#8ed5e1" stroke="#276981" stroke-width="3"/>`+transport(77,69,y,'water')).join('');

function renderSpatialFigure({node,step,state,txt,controls=true,order}) {

function layoutSpatialStamps() {

   const target=targets[Number(stamp.dataset.target)];if(!target)continue;
   const x=target.x+target.w/2,y=target.y+target.h/2,w=stamp.offsetWidth,h=stamp.offsetHeight;
   const candidates=[];
   for(const gap of [28,56,84,112,150])for(const [dx,dy]of [[-w/2,gap],[-w/2,-h-gap],[gap,-h/2],[-w-gap,-h/2],[-w-gap,gap],[gap,gap],[-w-gap,-h-gap],[gap,-h-gap]]){
     const r={x:Math.max(2,Math.min(frame.width-w-2,x+dx)),y:Math.max(2,Math.min(frame.height-h-2,y+dy)),w,h};

   }

}

  function bindTrace() {

  function assessmentHtml() {

      .join(
        '',
      )}</div>${c.quizWrong ? `<div class="script-feedback error">${authorized('retry')}<p data-original>${esc(c.moreGuide ? q.explain : q.hint)}</p></div>${!c.moreGuide ? button('more-guide', common('看第二層引導')) : button('review-node', common('回看對應節點'))}${c.reviewed ? button('retry-assessment', authorized('step')) : ''}` : button('pool-submit', common('送出'))}</main></section>`;

  function positionFigureControls() {
    const root = document.querySelector('.scripted-figure');

    const leaderLines=[];
    root.querySelectorAll('[data-figure-control]').forEach((button) => {
      const x = Number(button.dataset.x),
        y = Number(button.dataset.y);
      let px = m.a * x + m.c * y + m.e - bounds.left;
      let py = m.b * x + m.d * y + m.f - bounds.top;

          Math.min(bounds.height - button.offsetHeight / 2 - 2, py),

  });

  }
  render();
}

0":{"text":"葡萄糖、胺基酸正常全部回收；尿素部分回收；肌酸酐不被再吸收。","line":31},"n3.micro.stem":{"text":"水主要靠什麼被回收？","line":32},"n3.micro.option.0":{"text":"滲透作用","line":33},"n3.micro.option.1":{"text":"分泌","line":34},"n3.micro.option.2":{"text":"過濾","line":35},"n3.micro.feedback.0":{"text":"水主要依滲透作用回收。","line":36},"n4.title":{"text":"第 4 關｜回收能力有上限","line":38},"n4.basics":{"text":"最大轉運量＝回收葡萄糖的能力上限，課本為 375 mg/min。","line":39},"n4.question":{"text":"如果過濾出來的葡萄糖越來越多，超過腎小管回收的上限，會發生什麼事？","line":40},"n4.action.0.text":{"text":"拖動「過濾出來的葡萄糖」滑桿：沒超過 375 時全部回收；超過後，尿中出現葡萄糖。","line":41},"n4.hint":{"text":"搬運工一次只能搬那麼多，多出來的就留下了。","line":42},"n4.action.1.option.0":{"text":"出現糖尿","line":43},"n4.action.1.option.1":{"text":"還是全部回收","line":43},"n4.action.1.text":{"text":"過濾出來的葡萄糖超過 375 mg/min，會怎樣？","line":43},"n4.action.1.feedback.0":{"text":"過濾負荷超過回收能力時，就會出現糖尿。","line":44},"n5.title":{"text":"第 5 關｜鉀的調節","line":46},"n5.basics":{"text":"K⁺ 是鉀離子。鉀在小管前段大量回收，最後尿鉀仍受後段分泌調整；遠曲小管與集尿管可把鉀分泌到管液。醛固酮是調節鈉、鉀處理的激素，促進鈉再吸收，同時增加鉀分泌。","line":47},"n5.question":{"text":"血鉀太高時，腎臟在哪兩段把 K⁺ 送進尿裡？請在圖上點出來。","line":48},"n5.question.option.0":{"text":"遠曲小管","line":48},"n5.question.option.1":{"text":"集尿管","line":48},"n5.hint":{"text":"沿圖上的管液流向，回看先認識中『最後調整』的功能，再把它對到兩個管段。","line":49},"n5.action.0.option.0":{"text":"增加","line":50},"n5.action.0.option.1":{"text":"減少","line":50},"n5.action.0.text":{"text":"醛固酮會讓 K⁺ 的分泌？","line":50},"n5.action.0.feedback.0":{"text":"醛固酮促進遠端鈉再吸收，同時增加鉀分泌。","line":51},"n5.micro.stem":{"text":"最後尿裡的鉀，主要由什麼決定？","line":52},"n5.micro.option.0":{"text":"後段的分泌調整","line":53},"n5.micro.option.1":{"text":"只看一開始過濾多少","line":54},"n5.micro.feedback.0":{"text":"前段大量回收鉀，最後的尿鉀仍受後段分泌調整。","line":55},"n6.title":{"text":"第 6 關｜尿比較濃，就一定是分泌嗎？","line":57},"n6.basics":{"text":"濃度與排出的物質量不同；水回收也會使尿液變濃，不一定是另加物質進去。GFR＝腎絲球過濾率，指每分鐘形成的濾液體積；清除率是每分鐘排除某物質所相當的血漿體積，兩者可用 mL/min 比較。物質排泄量則是物質量／時間。","line":58},"n6.question":{"text":"某物質在尿中的濃度比血漿高，表示它一定被分泌嗎？","line":59},"n6.question.option.0":{"text":"不一定","line":59},"n6.question.option.1":{"text":"一定","l .point4":"E","locate.point5":"F","locate.point6":"G","locate.point7":"H"},"matching":{"pick":"選擇說明","check":"檢查配對","help":"操作說明","skip":"略過引導","understood":"知道了","swap":"交換兩列","cancel":"取消","correct":"配對正確","wrong":"請再想想","used":"目前配給：","guide1":"先點選一個項目，決定你要配對的內容。","guide2":"再從選單中，選出對應的說明。","guide3":"已完成一組！請配好另外幾組，再按「檢查配對」。想修改時，點原本的說明即可。","progress0":"已完成 0／0","progress1":"已完成 1／1","progress2":"已完成 2／2","progress3":"已完成 3／3","progress4":"已完成 4／4","progress5":"已完成 5／5","progress6":"已完成 6／6","progress7":"已完成 7／7","progress8":"已完成 8／8"},"sourceHashes":{"script":"3be10265249655da0807892cbc1a7bb4c777afeb2a7a37ec7c688353f2e3263e","common":"ad3b286d7c928a338019052dcd080cd25947c9f3fb0fce9ed9cf40c46f01859f"}},"questions":{"foundation":[{"id":"tubular-handling-foundation-q01","stem":"小管裡原本被濾出的物質，又回到血液，這個動作叫什麼？","options":["再吸收","分泌","腎絲球過濾","排泄到體外"],"answer":0,"hint":"先想想：物質這次是在回到血液，還是離開血液？","explain":"因為再吸收就是把管液中的物質收回血液，所以選「再吸收」。選「分泌」的同學，所選的分泌是從血液送進管液，方向相反。","nodeId":"tubular-handling-node-01","sources":["renal-handling；physiology/CH09 p.10, physiology/CH09 p.14, physiology/CH09 p.15, physiology/CH09 p.17, physiology/CH09 p.27"]},{"id":"tubular-handling-foundation-q02","stem":"想算同一種物質最後隨尿排出多少，哪一個加減算式正確？","options":["先濾出＋收回血液－額外送進管液","先濾出－收回血液＋額外送進管液","收回血液－先濾出＋額外送進管液","先濾出＋收回血液＋額外送進管液"],"answer":1,"hint":"先想想：拿回身體的要減掉，另送進尿的要加上嗎？","explain":"因為收回血液的部分不會再隨尿排出，而分泌是另外加進管液，所以選「先濾出－收回血液＋額外送進管液」。選「先濾出＋收回血液－額外送進管液」的同學，把再吸收和分泌的加減號交換了。","nodeId":"tubular-handling-node-02","sources":["renal-handling；physiology/CH09 p.10, physiology/CH09 p.14, physiology/CH09 p.15, physiology/CH09 p.17, physiology/CH09 p.27"]},{"id":"tubular-handling-foundation-q03","stem":"在近曲小管，葡萄糖和水各用什麼方式回到血液？","options":["葡萄糖跟著水移動，水搭鈉離子的共同運輸","葡萄糖從血液送進管液，水靠滲透（隔著能通水、卻不通物質的膜，水往小粒子較多側移，叫做滲透）回收","葡萄糖搭鈉離子的共同運輸，水靠滲透（隔著能通水、卻不通物質的膜，水往小粒子較多側移，叫做滲透）回收","葡萄糖和鈉離子反向移動，水靠滲透（隔著能通水、卻不通物質的膜，水往小粒子較多側移，叫做滲透）回收"],"answer":2,"hint":"先想想：葡萄糖和鈉是一起走，還是一個進、一個出？","explain":"因為近曲小管讓葡萄糖和鈉離子同方向回收，水則靠滲透（隔著能通水、卻不通物質的膜，水往小粒子較多側移，叫做滲透）移動，所以選「葡萄糖搭鈉離子的共同運輸，水靠滲透回收」。選「葡萄糖和鈉離子反向移動，水靠滲透回收」的同學，把葡萄糖與鈉的共同運輸，錯寫成一進一出的交換。","nodeId":"tubular-handling-node-03","sources":["tubular-reabsorption；physiology/CH09 p.13, physiology/CH09 p.14, physiology/CH09 p.15, physiology/CH09 p.16, physiology/CH09 p.27, anatomy/AB-05_15 p.6, physiology/CH09 p.17"]},{"id":"tubular-handling-foundation-q04","stem":"腎小管回收葡萄糖也有速度上限，「葡萄糖最大轉運量」指的是什麼？","options":["尿裡葡萄糖有多濃的固定數字","腎臟每分鐘血流量的上限","膀胱一天能存多少尿的上限","每分鐘能搬運多少葡萄糖的上限"],"answer":3,"hint":"先想想：這個上限是在算每分鐘搬多少，還是液體多濃？","explain":"因為小管每分鐘能搬運的葡萄糖有上限，所以這個上限叫最大轉運量，選「每分鐘能搬運多少葡萄糖的上限」。選「尿裡葡萄糖有多濃的固定數字」的同學，說的是尿有多濃，和每分鐘能搬多少不同。","nodeId":"tubular-handling-node-04","sources":["tubular-reabsorption；physiology/CH09 p.13, physiology/CH09 p.14, physiology/CH09 p.15, physiology/CH09 p.16, physiology/CH09 p.27, anatomy/AB-05_15 p.6, physiology/CH09 p.17"]},{"id":"tubular-handling-foundation-q05","stem":"醛固酮是幫忙調整鈉與鉀的激素，它在腎小管後段會怎麼做？","options":["把鈉收回血液，把鉀送進管液","把鈉送進管液，把鉀收回血液","把鈉和鉀都送進管液","讓鈉和鉀都停止移動"],"answer":0,"hint":"先想想：醛固酮要把哪一種留下，哪一種送進尿？","explain":"因為醛固酮增加鈉再吸收並增加鉀分泌，所以選「把鈉收回血液，把鉀送進管液」。選「把鈉送進管液，把鉀收回血液」的同學，把留下鈉與排出鉀的方向寫反了。","nodeId":"tubular-handling-node-05","sources":["potassium-secretion；physiology/CH09 p.18, physiology/CH09 p.17, physiology/CH09 p.34, physiology/CH09 p.14"]},{"id":"tubular-handling-foundation-q06","stem":"看到尿裡某種物質比較濃，就能說腎小管把更多這種物質分泌進尿裡嗎？","options":["能，尿有多濃就是分泌的速度","不能，還要看收回多少水、每分鐘排多少尿","能，尿有多濃就是腎絲球過濾率","不能，尿變濃表示收回血液的物質更多"],"answer":1,"hint":"先想想：尿變濃，可能只是剩下的水變少嗎？","explain":"因為回收較多水也會讓剩下的尿變濃，所以單看濃淡還不夠，選「不能，還要看收回多少水、每分鐘排多少尿」。選「不能，尿變濃表示收回血液的物質更多」的同學，把尿比較濃直接當成物質回收量增加，少看了水的改變。","nodeId":"tubular-handling-node-06","sources":["renal-handling；physiology/CH09 p.10, physiology/CH09 p.14, physiology/CH09 p.15, physiology/CH09 p.17, physiology/CH09 p.27","tubular-reabsorption；physiology/CH09 p.13, physiology/CH09 p.14, physiology/CH09 p.15, physiology/CH09 p.16, physiology/CH09 p.27, anatomy/AB-05_15 p.6, physiology/CH09 p.17"]}],"cases":[{"id":"tubular-handling-case-q01","stem":"某種物質從小管旁的血液移進小管裡的液體，這個動作叫什麼？","options":["再吸收","從膀胱排尿","分泌","腎絲球過濾"],"answer":2,"hint":"先想想：這一次是從血往管液，還是從管液往血？","explain":"因為從血液額外送進管液叫分泌，所以選「分泌」。選「再吸收」的同學，所選的再吸收是把管液裡的物質拿回血液，方向相反。","nodeId":"tubular-handling-node-01","sources":["renal-handling；physiology/CH09 p.10, physiology/CH09 p.14, physiology/CH09 p.15, physiology/CH09 p.17, physiology/CH09 p.27"]},{"id":"tubular-handling-case-q02","stem":"同一種物質，先濾出和額外送進管液的量都不變，但收回血液的量變多，最後隨尿排出的量會怎麼變？","options":["變多","不變","還不能知道，要先知道每分鐘尿量","變少"],"answer":3,"hint":"先想想：原本要排掉的物質，多拿一些回身體，還會排得更多嗎？","explain":"因為先濾出的量要扣掉收回血液的量，再加上分泌量，所以回收變多就排出變少，選「變少」。選「還不能知道，要先知道每分鐘尿量」的同學，把計算物質排出量和計算尿有多濃混在一起，本題已固定其餘收支量。","nodeId":"tubular-handling-node-02","sources":["renal-handling；physiology/CH09 p.10, physiology/CH09 p.14, physiology/CH09 p.15, physiology/CH09 p.17, physiology/CH09 p.27"]},{"id":"tubular-handling-case-q03","stem":"兩份尿裡的同一種物質一樣濃，甲每分鐘排出的尿比較多，哪個說法正確？","options":["甲每分鐘排掉的這種物質比較多","甲乙每分鐘排掉的這種物質一樣多","甲每分鐘排掉的這種物質比較少","可以知道甲的小管分泌增加了"],"answer":0,"hint":"先想想：一樣濃的兩杯水，倒出去比較多會帶走比較多物質嗎？","explain":"因為每分鐘排出量是尿中濃度（同樣多的水裡裝了多少物質，叫做濃度，就像糖水有多甜）乘以每分鐘尿量，所以一樣濃而尿較多的甲，排出物質也較多，選「甲每分鐘排掉的這種物質比較多」。選「甲乙每分鐘排掉的這種物質一樣多」的同學，忽略了兩份尿每分鐘的量不同。","nodeId":"tubular-handling-node-06","sources":["renal-handling；physiology/CH09 p.10, physiology/CH09 p.14, physiology/CH09 p.15, physiology/CH09 p.17, physiology/CH09 p.27","tubular-reabsorption；physiology/CH09 p.13, physiology/CH09 p.14, physiology/CH09 p.15, physiology/CH09 p.16, physiology/CH09 p.27, anatomy/AB-05_15 p.6, physiology/CH09 p.17"]},{"id":"tubular-handling-case-q04","stem":"正常情況下，送進腎小管的葡萄糖沒有超過回收能力，搬運功能也正常，葡萄糖會怎樣？","options":["被額外分泌進尿，才排得出去","能被小管收回血液","因搬運位置已滿，而留在尿裡","靠分泌從管液回到血液"],"answer":1,"hint":"先想想：送來的糖沒超過回收能力，還會不會收不完？","explain":"因為正常小管有能力把這些葡萄糖收回，所以選「能被小管收回血液」。選「因搬運位置已滿，而留在尿裡」的同學，要在送來的糖超過回收能力時才可能發生，和題目的條件不同。","nodeId":"tubular-handling-node-04","sources":["tubular-reabsorption；physiology/CH09 p.13, physiology/CH09 p.14, physiology/CH09 p.15, physiology/CH09 p.16, physiology/CH09 p.27, anatomy/AB-05_15 p.6, physiology/CH09 p.17"]},{"id":"tubular-handling-case-q05","stem":"醛固酮增加時，腎小管後段的鈉和鉀會往哪裡走？","options":["鈉從血進管液，鉀從管液回血","鈉和鉀都從血進管液","鈉從管液回血，鉀從血進管液","鈉和鉀都從管液回血"],"answer":2,"hint":"先想想：鈉要留住、鉀要排掉，各要往哪裡移動？","explain":"因為醛固酮促進留鈉和排鉀，所以鈉回血、鉀進管液，選「鈉從管液回血，鉀從血進管液」。選「鈉和鉀都從管液回血」的同學，把鉀也當成要一起留回血液了。","nodeId":"tubular-handling-node-05","sources":["potassium-secretion；physiology/CH09 p.18, physiology/CH09 p.17, physiology/CH09 p.34, physiology/CH09 p.14"]}],"predict":{"question":"切到葡萄糖「回收」主題，正常運輸功能完整且負荷未超能力時，物質移動方向為何？","options":["由血液分泌入管液","由膀胱回到腎盂","由尿道直接回到腎絲球","由管液回血液"],"answer":3,"feedback":"再吸收將葡萄糖由管液送回血液，與鉀分泌入管液的方向不同，見節點 01、03、04。","sources":["tubular-reabsorption；physiology/CH09 p.13, physiology/CH09 p.14, physiology/CH09 p.15, physiology/CH09 p.16, physiology/CH09 p.27, anatomy/AB-05_15 p.6, physiology/CH09 p.17"]}},"nodeIds":["tubular-handling-node-01","tubular-handling-node-02","tubular-handling-node-03","tubular-handling-node-04","tubular-handling-node-05","tubular-handling-node-06"]});</script></body></html>
