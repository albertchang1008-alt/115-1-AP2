<svg xmlns="http://www.w3.org/2000/svg" id="breathing-mechanics-node-04" viewBox="0 0 1700 1965" role="img" font-family="PingFang TC,Noto Sans CJK TC,Noto Sans TC,sans-serif" aria-label="肺通氣與呼吸力學"><style>#breathing-mechanics-node-04 .label{font-size:calc(66px * var(--font-scale,1));fill:#17212b;stroke:white;stroke-width:8;paint-order:stroke;stroke-linejoin:round}#breathing-mechanics-node-04 .focus{fill:#b4233a;color:#b4233a;font-weight:700}#breathing-mechanics-node-04 .lead{fill:none;stroke:#444;stroke-width:3}#breathing-mechanics-node-04 .halo{stroke:white;stroke-width:10}#breathing-mechanics-node-04 .dot{fill:#444;stroke:white;stroke-width:3}#breathing-mechanics-node-04 .data-card{font-size:calc(66px * var(--font-scale,1));line-height:1.3;color:#17212b;background:#f5f7f8;padding:20px 30px;border-radius:20px;line-break:strict;word-break:normal;overflow-wrap:normal;hanging-punctuation:allow-end}</style><rect width="100%" height="100%" fill="white"/><foreignObject x="50" y="45" width="1600" height="153"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="C＝ΔV/ΔP" class="focus">C＝ΔV/ΔP</span></div></foreignObject><path d="M220 353V1253H1090" fill="none" stroke="#444" stroke-width="5"/><path class="compliance-curve" d="M220 1253Q560 483 1050 403" fill="none" stroke="#333333" stroke-width="12"/><text class="label focus" data-label="順應性較大" aria-label="順應性較大" x="1130" y="425" text-anchor="start"><tspan x="1130" dy="0">順應性較大</tspan></text><circle class="compliance-point" cx="850" cy="467.4293710518024" r="15" fill="#333333"/><path class="compliance-curve" d="M220 1253Q650 1033 1050 873" fill="none" stroke="#CC79A7" stroke-width="12"/><text class="label " data-label="順應性較小" aria-label="順應性較小" x="1130" y="895" text-anchor="start"><tspan x="1130" dy="0">順應性較小</tspan></text><circle class="compliance-point" cx="850" cy="955.9450346979306" r="15" fill="#CC79A7"/><path d="M850 323V1253" stroke="#888" stroke-width="4" stroke-dasharray="15 12"/><text class="label " data-label="肺容積改變量ΔV" aria-label="肺容積改變量ΔV" x="850" y="263" text-anchor="middle"><tspan x="850" dy="0">肺容積改變量ΔV</tspan></text><text class="label " data-label="肺間壓改變量ΔP" aria-label="肺間壓改變量ΔP" x="650" y="1373" text-anchor="middle"><tspan x="650" dy="0">肺間壓改變量ΔP</tspan></text><foreignObject x="50" y="1493" width="1600" height="417"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="C＝ΔV/ΔP，ΔP 為肺間壓改變量；同樣壓差帶來較大容積變化即順應性較大；肺組織彈性與肺泡表面張力都會影響，表面張力素降低張力、有助擴張。" class="">C＝ΔV/ΔP，ΔP 為<span style="white-space:nowrap">肺間壓</span>改變量；同樣壓差帶來較大容積變化即<span style="white-space:nowrap">順應性較大</span>；肺組織彈性與肺泡表面張力都會影響，表面張力素降低張力、有助擴張。</span></div></foreignObject></svg>