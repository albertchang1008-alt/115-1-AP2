<svg xmlns="http://www.w3.org/2000/svg" id="lung-function-overview-state-2" viewBox="0 0 1700 2179" role="img" font-family="PingFang TC,Noto Sans CJK TC,Noto Sans TC,sans-serif" aria-label="肺容積與肺功能"><style>#lung-function-overview-state-2 .label{font-size:calc(66px * var(--font-scale,1));fill:#17212b;stroke:white;stroke-width:8;paint-order:stroke;stroke-linejoin:round}#lung-function-overview-state-2 .focus{fill:#b4233a;color:#b4233a;font-weight:700}#lung-function-overview-state-2 .lead{fill:none;stroke:#444;stroke-width:3}#lung-function-overview-state-2 .halo{stroke:white;stroke-width:10}#lung-function-overview-state-2 .dot{fill:#444;stroke:white;stroke-width:3}#lung-function-overview-state-2 .data-card{font-size:calc(66px * var(--font-scale,1));line-height:1.3;color:#17212b;background:#f5f7f8;padding:20px 30px;border-radius:20px;line-break:strict;word-break:normal;overflow-wrap:normal;hanging-punctuation:allow-end}</style><rect width="100%" height="100%" fill="white"/><foreignObject x="50" y="45" width="1600" height="153"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="一般" class="focus">一般</span></div></foreignObject><foreignObject x="50" y="223" width="1600" height="241"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style="border-left:35px solid #CC79A7;"><span data-html-label="TV 500 mL／VD 150 mL／F 12 次/min" class="">TV <span style="white-space:nowrap">500 mL</span>／VD <span style="white-space:nowrap">150 mL</span>／F <span style="white-space:nowrap">12 次/min</span></span></div></foreignObject><foreignObject x="50" y="489" width="1600" height="153"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="VA＝（TV－VD）×F" class="">VA＝（TV－VD）×F</span></div></foreignObject><text class="label " data-label="每分鐘通氣量（mL/min）" aria-label="每分鐘通氣量（mL/min）" x="850" y="733" text-anchor="middle"><tspan x="850" dy="0">每分鐘通氣量（mL/min）</tspan></text><text class="label " data-label="總通氣量" aria-l