<svg xmlns="http://www.w3.org/2000/svg" id="gas-exchange-node-04" viewBox="0 0 1700 1562" role="img" font-family="PingFang TC,Noto Sans CJK TC,Noto Sans TC,sans-serif" aria-label="氣體交換"><style>#gas-exchange-node-04 .label{font-size:calc(66px * var(--font-scale,1));fill:#17212b;stroke:white;stroke-width:8;paint-order:stroke;stroke-linejoin:round}#gas-exchange-node-04 .focus{fill:#b4233a;color:#b4233a;font-weight:700}#gas-exchange-node-04 .lead{fill:none;stroke:#444;stroke-width:3}#gas-exchange-node-04 .halo{stroke:white;stroke-width:10}#gas-exchange-node-04 .dot{fill:#444;stroke:white;stroke-width:3}#gas-exchange-node-04 .data-card{font-size:calc(66px * var(--font-scale,1));line-height:1.3;color:#17212b;background:#f5f7f8;padding:20px 30px;border-radius:20px;line-break:strict;word-break:normal;overflow-wrap:normal;hanging-punctuation:allow-end}</style><rect width="100%" height="100%" fill="white"/><rect x="50" y="70" width="750" height="450" rx="18" fill="#f5f7f8" stroke="#aaa" stroke-width="3"/><text class="label focus" data-label="膜面積↑" aria-label="膜面積↑" x="425" y="180" text-anchor="middle"><tspan x="425" dy="0">膜面積↑</tspan></text><text class="label " data-label="分壓差↑" aria-label="分壓差↑" x="425" y="305" text-anchor="middle"><tspan x="425" dy="0">分壓差↑</tspan></text><text class="label " data-label="溶解度↑" aria-label="溶解度↑" x="425" y="430" text-anchor="middle"><tspan x="425" dy="0">溶解度↑</tspan></text><defs><marker id="gas-exchange-node-04-signal-4" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#444"/></marker></defs><path class="flow-arrow" d="M425,560L425,710" fill="none" stroke="#444" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#gas-exchange-node-04-signal-4)"/><rect x="65.0" y="770" width="720" height="125" rx="15" fill="#f5f7f8" stroke="#aaa" stroke-width="2"/><text class="label focus" data-label="擴散↑" aria-label="擴散↑" x="425" y="850" text-anchor="middle"><tspan x="425" dy="0">擴散↑</tspan></text><rect x="900" y="70" width="750" height="450" rx="18" fill="#f5f7f8" stroke="#aaa" stroke-width="3"/><text class="label focus" data-label="膜厚度↑" aria-label="膜厚度↑" x="1275" y="180" text-anchor="middle"><tspan x="1275" dy="0">膜厚度↑</tspan></text><text class="label " data-label="分子量平方根↑" aria-label="分子量平方根↑" x="1275" y="305" text-anchor="middle"><tspan x="1275" dy="0">分子量平方根↑</tspan></text><defs><marker id="gas-exchange-node-04-signal-10" markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#444"/></marker></defs><path class="flow-arrow" d="M1275,560L1275,710" fill="none" stroke="#444" stroke-width="6" stroke-dasharray="12 10" marker-end="url(#gas-exchange-node-04-signal-10)"/><rect x="915.0" y="770" width="720" height="125" rx="15" fill="#f5f7f8" stroke="#aaa" stroke-width="2"/><text class="label focus" data-label="擴散↓" aria-label="擴散↓" x="1275" y="850" text-anchor="middle"><tspan x="1275" dy="0">擴散↓</tspan></text><foreignObject x="50" y="1000" width="1600" height="153"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="CO₂溶解度約為O₂的20倍" class="">CO₂溶解度約為O₂的20倍</span></div></foreignObject><foreignObject x="50" y="1178" width="1600" height="329"><div xmlns="http://www.w3.org/1999/xhtml" class="data-card" style=""><span data-html-label="膜面積、分壓差、溶解度增加 → 擴散增加；膜厚度、分子量（平方根）增加 → 擴散減少；CO₂ 溶解度約為 O₂ 的 20 倍。" class="">膜面積、分壓差、溶解度增加 → 擴散增加；膜厚度、分子量（平方根）增加 → 擴散減少；CO₂ 溶解度約為 O₂ 的 20 倍。</span></div></foreignObject></svg>