</style></head><body><script src="https://albertchang1008-alt.github.io/115-1-AP2/materials/course-learning.js"></script><script>window.CourseLearning=window.CourseLearning||{explore(){},nodeTime(){},answer(){},hint(){},complete(){}};</script><script>// ECG 教學模型（純函式）：監視器、放大檢視與標示題共用。
// 數值依 docs/ECG_SIM_LABEL_SPEC.md §2.1；以秒為單位，每一拍以 P 波起點為 0。

const featureNames = {
  P: 'P 波', PRi: 'PR 間隔', PRs: 'PR 段', QRS: 'QRS 群波',
  ST: 'ST 段', T: 'T 波', QT: 'QT 間隔', RR: 'R-R 間期'
};

// 房室傳導隨自律神經小幅變化：迷走延長、交感縮短（仍在 0.12–0.20 s 內）
function prFor(hr) {
  const pts = [[40, 0.19], [75, 0.16], [150, 0.13], [200, 0.12]];
  if (hr <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (hr <= pts[i][0]) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
      return y0 + (y1 - y0) * (hr - x0) / (x1 - x0);
    }
  }
  return pts[pts.length - 1][1];
}

// 建立一拍。rr＝這一拍到下一拍的間隔；prevRR＝前一個 R-R（決定 QT，Bazett）
function makeBeat(start, rr, hr, prevRR = rr) {
  const pDur = hr > 150 ? 0.08 : 0.09, pr = prFor(hr), qrs = 0.09;
  const qt = 0.40 * Math.sqrt(prevRR);
  const tDur = Math.min(0.16, 0.75 * (qt - qrs));
  return { start, rr, pDur, pr, qrs, qt, tDur, tStart: pr + qt - tDur, end: pr + qt };
}

// 單一拍在 x 秒（相對該拍 P 起點）的電位（mV）
function beatMv(b, x) {
  if (x < 0 || x > b.end) return 0;
  if (x < b.pDur) return 0.15 * Math.sin(Math.PI * x / b.pDur);
  const q = x - b.pr;
  if (q >= 0 && q < 0.02) return -0.10 * (q / 0.02);
  if (q >= 0.02 && q < 0.05) return -0.10 + 1.30 * ((q - 0.02) / 0.03);
  if (q >= 0.05 && q < 0.08) return 1.20 - 1.45 * ((q - 0.05) / 0.03);
  if (q >= 0.08 && q < 0.09) return -0.25 + 0.25 * ((q - 0.08) / 0.01);
  const t = x - b.tStart;
  if (t >= 0 && t < b.tDur) {
    let u = t / b.tDur;
    u = u < 0.62 ? u / 0.62 * 0.5 : 0.5 + (u - 0.62) / 0.38 * 0.5; // 上升慢、下降快
    return 0.30 * Math.sin(Math.PI * u);
  }
  return 0;
}

// 多拍疊加（心率很快時 P 波會疊到前一個 T 波上）
function mvAt(beats, t) {
  let s = 0;
  for (const b of beats) s += beatMv(b, t - b.start);
  return s;
}

function rPeak(b) { return b.start + b.pr + 0.05; }

// 一拍的各波段（絕對時間）；next 存在時才有 R-R
function features(b, next) {
  const s = b.start;
  const f = {
    P: [s, s + b.pDur], PRi: [s, s + b.pr], PRs: [s + b.pDur, s + b.pr],
    QRS: [s + b.pr, s + b.pr + b.qrs], ST: [s + b.pr + b.qrs, s + b.tStart],
    T: [s + b.tStart, s + b.end], QT: [s + b.pr, s + b.end]
  };
  if (next) f.RR = [rPeak(b), rPeak(next)];
  return f;
}

// 固定心率的一段心電圖（標示題用）：起點隨機落在心動週期中
function makeStrip(hr, seconds, offset) {
  const rr = 60 / hr, beats = [];
  for (let st = -offset * rr; st < seconds + rr; st += rr) beats.push(makeBeat(st, rr, hr, rr));
  return beats;
}

// 所有完整落在 [0, view] 秒內的某類波段
function candidates(key, beats, view) {
  const out = [];
  for (let i = 0; i < beats.length; i++) {
    const r = features(beats[i], beats[i + 1])[key];
    if (r && r[0] >= -1e-6 && r[1] <= view + 1e-6) out.push(r);
  }
  return out;
}

// 最接近的波段與起訖誤差（秒）
function closest(key, sel, beats, view) {
  let best = null;
  for (const r of candidates(key, beats, view)) {
    const e1 = sel[0] - r[0], e2 = sel[1] - r[1], m = Math.max(Math.abs(e1), Math.abs(e2));
    if (!best || m < best.m) best = { range: r, e1, e2, m };
  }
  return best;
}

// 判定：起點與終點誤差都 ≤ tol 才算對；答錯時若框選符合另一種波段，回報 confusedWith
function grade(target, sel, beats, view, tol, confuseTol = 0.03) {
  const best = closest(target, sel, beats, view);
  const ok = !!best && Math.abs(best.e1) <= tol && Math.abs(best.e2) <= tol;
  let confusedWith = null;
  if (!ok) {
    let bestOther = null;
    for (const key of Object.keys(featureNames)) {
      if (key === target) continue;
      const m = closest(key, sel, beats, view);
      if (m && m.m <= confuseTol && (!bestOther || m.m < bestOther.m)) bestOther = { key, m: m.m };
    }
    confusedWith = bestOther ? bestOther.key : null;
  }
  return { ok, best, confusedWith };
}

// 心率區間的生理說明（非診斷用語）
function physioZone(hr) {
  if (hr < 60) return 'slow';
  if (hr < 100) return 'rest';
  if (hr < 180) return 'fast';
  return 'max';
}

// ECG 繪圖工具：校正方格、標籤（含碰撞避讓）、量測線與逐拍標示。
// 依賴 ecg-model.js 的 features、featureNames。

function ecgGrid(g, W, H, pxmm, base, x0 = 0) {
  g.fillStyle = '#050d1a';
  g.fillRect(0, 0, W, H);
  g.lineWidth = 1;
  for (let i = 0; x0 + i * pxmm <= W + 1; i++) {
    const x = Math.round(x0 + i * pxmm) + 0.5;
    g.strokeStyle = i % 5 === 0 ? 'rgba(16,185,129,0.30)' : 'rgba(16,185,129,0.09)';
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
  }
  for (let j = 0; ; j++) {
    const up = base - j * pxmm, down = base + j * pxmm;
    if (up < 0 && down > H) break;
    for (const y of j === 0 ? [up] : [up, down]) {
      if (y < 0 || y > H) continue;
      g.strokeStyle = j % 5 === 0 ? 'rgba(16,185,129,0.30)' : 'rgba(16,185,129,0.09)';
      g.beginPath(); g.moveTo(x0, Math.round(y) + 0.5); g.lineTo(W, Math.round(y) + 0.5); g.stroke();
    }
  }
}

// 1 mV 校正方波（高 10 mm、寬 0.2 s），畫在左側保留區，不與波形重疊
function ecgCalPulse(g, pxmm, base) {
  const x0 = pxmm * 1.5, x1 = x0 + pxmm * 5;
  g.strokeStyle = 'rgba(253,224,71,0.85)'; g.lineWidth = 1.5;
  g.beginPath();
  g.moveTo(x0 - pxmm, base); g.lineTo(x0, base); g.lineTo(x0, base - 10 * pxmm);
  g.lineTo(x1, base - 10 * pxmm); g.lineTo(x1, base); g.lineTo(x1 + pxmm, base);
  g.stroke();
}

function ecgPill(c, text, cx, cy0, col, placed) {
  c.font = '700 12px system-ui,-apple-system,sans-serif';
  const w = c.measureText(text).width + 12, x = cx - w / 2;
  let cy = cy0;
  if (placed) {
    for (const off of [0, 20, 40, -20, 60]) {
      const y = cy0 + off;
      if (!placed.some(p => x < p.x + p.w + 4 && p.x < x + w + 4 && Math.abs(p.y - y) < 19)) { cy = y; break; }
    }
    placed.push({ x, w, y: cy });
    if (cy !== cy0) {
      c.strokeStyle = col; c.lineWidth = 1;
      c.beginPath(); c.moveTo(cx, cy0); c.lineTo(cx, cy + (cy > cy0 ? -9 : 9)); c.stroke();
    }
  }
  c.fillStyle = 'rgba(5,13,26,0.88)'; c.strokeStyle = col; c.lineWidth = 1;
  c.beginPath();
  if (c.roundRect) c.roundRect(x, cy - 9, w, 18, 6); else c.rect(x, cy - 9, w, 18);
  c.fill(); c.stroke();
  c.fillStyle = col; c.textBaseline = 'middle'; c.textAlign = 'center';
  c.fillText(text, cx, cy + 0.5);
}

function ecgBracket(c, [a, z], y, yFrom, col, text, W, placed) {
  if (!(z > a) || a < -2 || z > W + 2) return;
  c.strokeStyle = col; c.lineWidth = 1; c.setLineDash([3, 3]);
  for (const x of [a, z]) { c.beginPath(); c.moveTo(x, yFrom); c.lineTo(x, y); c.stroke(); }
  c.setLineDash([]); c.lineWidth = 2;
  c.beginPath();
  c.moveTo(a, y); c.lineTo(z, y);
  c.moveTo(a, y - 5); c.lineTo(a, y + 5); c.moveTo(z, y - 5); c.lineTo(z, y + 5);
  c.stroke();
  ecgPill(c, text, (a + z) / 2, y, col, placed);
}

// o: { tToX, base, pxmm, H, W, mv, b, nb, layers:{wave,intv,mech} }
function ecgAnnotate(c, o) {
  const { tToX, base, pxmm, H, W, mv, b, nb, layers } = o;
  const F = features(b, nb), X = r => [tToX(r[0]), tToX(r[1])];
  const inView = ([a, z]) => z > a && a >= -2 && z <= W + 2;
  const sDepth = 0.25 * 10 * pxmm, rTop = base - 1.2 * 10 * pxmm;
  const placed = [];
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  if (layers.wave) {
    for (const [k, col, lab] of [['P', '#60a5fa', 'P 波'], ['QRS', '#f87171', 'QRS'], ['T', '#4ade80', 'T 波']]) {
      const [a, z] = X(F[k]);
      if (!inView([a, z])) continue;
      c.strokeStyle = col; c.lineWidth = 4.5; c.beginPath();
      let top = base;
      for (let x = a; x <= z + 0.01; x += 0.5) {
        const y = base - mv(F[k][0] + (x - a) / (z - a) * (F[k][1] - F[k][0])) * 10 * pxmm;
        if (x === a) c.moveTo(x, y); else c.lineTo(x, y);
        top = Math.min(top, y);
      }
      c.stroke();
      ecgPill(c, lab, (a + z) / 2, k === 'QRS' ? rTop - 12 : top - 14, col, placed);
    }
  }
  if (layers.intv) {
    for (const [k, col] of [['PRs', '#fbbf24'], ['ST', '#f472b6']]) {
      const [a, z] = X(F[k]);
      if (!inView([a, z]) || z - a < 2) continue;
      c.strokeStyle = col; c.lineWidth = 6;
      c.beginPath(); c.moveTo(a, base); c.lineTo(z, base); c.stroke();
      ecgPill(c, featureNames[k], (a + z) / 2, base + sDepth + 12, col, placed);
    }
    const r1 = base + sDepth + 34;
    ecgBracket(c, X(F.PRi), r1, base, '#fbbf24', 'PR 間隔', W, placed);
    ecgBracket(c, X(F.QT), r1 + 22, base, '#5eead4', 'QT 間隔', W, placed);
    if (F.RR) ecgBracket(c, X(F.RR), rTop - (layers.wave ? 34 : 12), rTop, '#c4b5fd', 'R-R 間期', W, placed);
  }
  if (layers.mech) {
    const nextQ = nb ? nb.start + nb.pr : b.start + b.rr + b.pr;
    const bands = [
      ['心房收縮', [b.start + b.pDur * 0.5, b.start + b.pr + 0.03], '251,191,36'],
      ['心室收縮', [b.start + b.pr + 0.03, b.start + b.end], '248,113,113'],
      ['心室舒張', [b.start + b.end, nextQ + 0.03], '56,189,248']
    ];
    const y = H - 19;
    c.font = '700 11px system-ui,-apple-system,sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    for (const [lab, r, rgb] of bands) {
      const [a, z] = X(r);
      if (!inView([a, z])) continue;
      c.fillStyle = `rgba(${rgb},0.35)`; c.fillRect(a, y, z - a, 15);
      c.strokeStyle = `rgba(${rgb},0.9)`; c.lineWidth = 1; c.strokeRect(a + 0.5, y + 0.5, z - a - 1, 14);
      if (z - a > c.measureText(lab).width + 6) { c.fillStyle = '#fff'; c.fillText(lab, (a + z) / 2, y + 8); }
    }
  }
  c.restore();
}

// 設定 canvas 的 CSS 尺寸與 devicePixelRatio
function ecgSizeCanvas(cv, W, H) {
  const d = window.devicePixelRatio || 1;
  cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const c = cv.getContext('2d');
  c.setTransform(d, 0, 0, d, 0, 0);
  return c;
}

// ECG 心率模擬器（lab widget "ecg-sim"）：即時掃描監視器、暫停選拍＋放大標示、卡尺。
// 依賴 ecg-model.js、ecg-draw.js。規格：docs/ECG_SIM_LABEL_SPEC.md §2–§3。
window.EcgSim = (() => {
  const SPEED = 25, GAIN = 10; // mm/s、mm/mV
  const PRESETS = [[40, '40'], [52, '52 運動員靜息'], [75, '75 安靜'], [100, '100'], [150, '150'], [195, '195 接近最大心率']];
  const PHYSIO = {
    slow: '<b>較慢心率區間（&lt;60）：</b>迷走神經釋放乙醯膽鹼，經 M₂ 受體增加 K⁺ 外流、減少 I<sub>f</sub> 與 Ca²⁺ 電流，竇房結第 4 期自動去極化變慢；房室結傳導也變慢，所以 PR 略為延長（仍在正常範圍）。PR 與 QRS 幾乎不變，<b>變長的主要是舒張期</b>。耐力運動員靜息 50 次左右屬正常生理現象。',
    rest: '<b>安靜範圍（60–100）：</b>正常安靜時，竇房結每分鐘約放電 70~80 次。心率在這個範圍內上下變動，主要來自迷走神經（副交感）張力的增減：迷走張力增加心跳變慢，減少則心跳變快。',
    fast: '<b>較快心率區間（&gt;100）：需要交感神經興奮。</b>正腎上腺素經 β₁ 受體增加 I<sub>f</sub> 與 L 型 Ca²⁺ 電流，竇房結放電加快；房室結傳導加快使 PR 縮短，QT 也稍縮短。但 QT 縮得比 R-R 少，所以<b>舒張期被大幅壓縮</b>，心室充血時間變少。',
    max: '<b>接近最大心率（青少年約 200 次）：</b>舒張期只剩不到 0.1 秒，P 波貼近前一個 T 波。心率再快，心室來不及充血，每搏輸出量開始下降，這也是最大心率有上限的原因之一。'
  };

  function html(lab) {
    const e = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    return `<div class="ecg-sim">
  <div class="ecg-ctrl">
    <div class="ecg-hr"><span class="ecg-hr-out">75</span><small>bpm 目標心率</small></div>
    <div class="ecg-chips">${PRESETS.map(([v, t]) => `<button type="button" class="ecg-chip" data-hr="${v}" aria-pressed="${v === 75}">${t}</button>`).join('')}</div>
  </div>
  <input class="ecg-slider" type="range" min="40" max="200" value="75" step="1" aria-label="目標心率（每分鐘次數）">
  <div class="ecg-scale" aria-hidden="true"><span>40</span><span>60</span><span>100</span><span>150</span><span>200</span></div>
  <div class="ecg-row">
    <label class="ecg-tg"><input type="checkbox" class="ecg-rsa">呼吸造成的心率變化 <small>（吸氣變快、吐氣變慢）</small></label>
    <label class="ecg-tg"><input type="checkbox" class="ecg-lag">自律神經反應時間 <small>（迷走神經幾乎立即反應，交感神經需數秒）</small></label>
    <button type="button" class="ecg-pause">暫停</button>
  </div>
  <div class="ecg-status" aria-live="off"></div>
  <div class="ecg-physio"></div>
  <div class="ecg-scope">
    <canvas class="ecg-layer ecg-grid" aria-hidden="true"></canvas>
    <canvas class="ecg-layer ecg-trace" aria-hidden="true"></canvas>
    <canvas class="ecg-layer ecg-over" tabindex="0" role="img" aria-label="心電圖監視器（Lead II）。暫停後可用左右方向鍵選擇心跳、Esc 關閉放大檢視。"></canvas>
    <div class="ecg-lbl"></div>
  </div>
  <p class="ecg-hint">按「暫停」後：<b>點一下</b>某一拍（或用 ←／→）→ 下方放大並標示該拍（可切換標示圖層）；<b>按住拖曳</b> → 卡尺量時間。</p>
  <div class="ecg-zoom-wrap" hidden>
    <div class="ecg-zoom-head">
      <div><b>放大檢視：選取的這一拍</b><small>紙速與振幅同樣是 25 mm/s、10 mm/mV，只是放大顯示；方格仍是 0.04 秒／0.1 mV。</small></div>
      <button type="button" class="ecg-zoom-close">關閉</button>
    </div>
    <div class="ecg-layers" role="group" aria-label="標示圖層">
    <span>標示圖層</span>
    <label class="ecg-tg"><input type="checkbox" class="ecg-lay-wave" checked>波形（P／QRS／T）</label>
    <label class="ecg-tg"><input type="checkbox" class="ecg-lay-intv" checked>間隔與段（PR、QT、R-R／PR 段、ST 段）</label>
    <label class="ecg-tg"><input type="checkbox" class="ecg-lay-mech">對應的機械事件 <small>（約略時間）</small></label>
  </div>
    <div class="ecg-zoom">
      <canvas class="ecg-layer ecg-zgrid" aria-hidden="true"></canvas>
      <canvas class="ecg-layer ecg-ztrace" aria-hidden="true"></canvas>
      <canvas class="ecg-layer ecg-zover" aria-hidden="true"></canvas>
    </div>
  </div>
  <div class="ecg-reads"></div>
  <div class="ecg-bar-cap"><span>一次心跳（R-R）中的時間分配</span><span class="ecg-bar-rr"></span></div>
  <div class="ecg-bar"><div class="ecg-sys"></div><div class="ecg-dia"></div></div>
  <p class="ecg-gap"></p>
  <p class="ecg-sr" aria-live="polite"></p>
  <p class="ecg-note">${e(lab.note || '')}</p>
</div>`;
  }

  function mount(root) {
    const $ = s => root.querySelector(s);
    const scope = $('.ecg-scope'), gridCv = $('.ecg-grid'), traceCv = $('.ecg-trace'), overCv = $('.ecg-over');
    let g, ctx, cx;
    const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const st = { target: 75, paused: reduceMotion, rsa: false, lag: false };

    // ---- geometry ----
    let W = 0, H = 0, dpr = 1, pxmm = 5, pxps = 125, base = 0, X0 = 0, SW = 0, secs = 6;
    // ---- simulation ----
    let simTime = 0, scanX = 0, lastPt = null, beats = [], nextBeatAt = 0.25, prevRR = 0.8, effHR = 75, lastShown = null;

    function resize() {
      W = scope.clientWidth; dpr = window.devicePixelRatio || 1;
      secs = W >= 700 ? 6 : 2.5;
      pxmm = W / (secs * SPEED); pxps = pxmm * SPEED;
      H = Math.round(Math.max(180, Math.min(280, pxmm * 30)));
      scope.style.height = H + 'px';
      g = ecgSizeCanvas(gridCv, W, H); ctx = ecgSizeCanvas(traceCv, W, H); cx = ecgSizeCanvas(overCv, W, H);
      base = Math.round(H * 0.62);
      X0 = Math.round(pxmm * 8); SW = W - X0;
      ecgGrid(g, W, H, pxmm, base, 0);
      ecgCalPulse(g, pxmm, base);
      g.fillStyle = 'rgba(5,13,26,0.55)'; g.fillRect(0, 0, X0 - 2, H); ecgCalPulse(g, pxmm, base);
      scanX = simTime > 0 ? (simTime * pxps) % SW : 0;
      redrawAll();
      $('.ecg-lbl').textContent = W >= 700
        ? `LEAD II • 25 mm/s • 10 mm/mV • 小格 0.04 秒／0.1 mV・大格 0.20 秒／0.5 mV・畫面約 ${(SW / pxps).toFixed(1)} 秒`
        : 'II • 25 mm/s • 小格 0.04 s • 大格 0.20 s';
      if (st.paused) drawOverlay();
    }

    const mv = t => mvAt(beats, t);
    const tToX = t => { let s = scanX - (simTime - t) * pxps; if (s < 0) s += SW; return X0 + s; };
    const xToT = x => { const s = x - X0; if (s < 0) return null; return s <= scanX ? simTime - (scanX - s) / pxps : simTime - (scanX + SW - s) / pxps; };
    const yOf = t => base - mv(t) * GAIN * pxmm;
    const eraseW = () => Math.max(18, pxmm * 4);

    function redrawAll() {
      ctx.clearRect(0, 0, W, H); lastPt = null;
      const step = dpr > 1 ? 0.5 : 1;
      ctx.lineWidth = 2.2; ctx.strokeStyle = '#34d399'; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      const segs = [[0, scanX, s => simTime - (scanX - s) / pxps], [scanX + eraseW(), SW, s => simTime - (scanX + SW - s) / pxps]];
      for (const [a, b, tf] of segs) {
        if (b - a < 1) continue;
        ctx.beginPath(); let started = false;
        for (let s = a; s <= b; s += step) {
          const t = tf(s); if (t < 0) { started = false; continue; }
          const y = yOf(t);
          if (!started) { ctx.moveTo(X0 + s, y); started = true; } else ctx.lineTo(X0 + s, y);
          if (a === 0) lastPt = [s, y];
        }
        ctx.stroke();
      }
    }

    function hrInstant(t) {
      let hr = effHR;
      if (st.rsa) {
        const vagal = Math.max(0, Math.min(1, (110 - effHR) / 50));
        hr *= 1 + 0.08 * vagal * Math.sin(2 * Math.PI * t / 4);
      }
      return hr;
    }

    let lastStatus = 0;
    function status(force) {
      const now = performance.now();
      if (!force && now - lastStatus < 200) return;
      lastStatus = now;
      const parts = [];
      const beatHR = lastShown ? Math.round(60 / lastShown.rr) : st.target;
      parts.push(`<span class="ecg-pill">這一拍 <b>${beatHR}</b> bpm</span>`);
      if (st.rsa) {
        const ph = Math.sin(2 * Math.PI * simTime / 4);
        const vagal = Math.max(0, Math.min(1, (110 - effHR) / 50));
        parts.push(vagal < 0.05
          ? '<span class="ecg-pill">呼吸：心率 &gt;110 時迷走張力低，呼吸變異幾乎消失</span>'
          : `<span class="ecg-pill ${ph >= 0 ? 'in' : 'ex'}">呼吸：${ph >= 0 ? '吸氣 ↑ 迷走張力降低 → R-R 變短' : '吐氣 ↓ 迷走張力增加 → R-R 變長'}</span>`);
      }
      if (st.lag && Math.abs(effHR - st.target) >= 1) {
        const up = st.target > effHR;
        parts.push(`<span class="ecg-pill adj">自律神經調整中：${Math.round(effHR)} → 目標 ${st.target} bpm（${up && effHR >= 100 ? '交感神經需數秒' : up ? '迷走撤除，約 1 秒' : '迷走神經幾乎立即'}）</span>`);
      }
      if (st.paused) parts.push('<span class="ecg-pill">已暫停：開關與心率在「繼續」後生效</span>');
      $('.ecg-status').innerHTML = parts.join('');
    }
    function update(dt) {
      if (st.lag) {
        const up = st.target > effHR;
        const tau = up ? (effHR >= 100 ? 6 : 1.2) : 0.8;
        effHR += (st.target - effHR) * (1 - Math.exp(-dt / tau));
      } else effHR = st.target;
      const t1 = simTime + dt;
      // 心率只影響「下一拍」：排程下一拍時才讀取心率
      while (nextBeatAt <= t1 + 0.5) {
        const rr = 60 / hrInstant(nextBeatAt);
        beats.push(makeBeat(nextBeatAt, rr, effHR, prevRR));
        prevRR = rr; nextBeatAt += rr;
      }
      // 逐像素計算波形（不是每個畫面只取一點）
      const step = dpr > 1 ? 0.5 : 1;
      ctx.lineWidth = 2.2; ctx.strokeStyle = '#34d399'; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      let remaining = dt * pxps, t = simTime;
      while (remaining > 1e-9) {
        const seg = Math.min(remaining, SW - scanX), xs = scanX, xe = scanX + seg, ts = t;
        ctx.clearRect(X0 + xs + 1, 0, Math.min(eraseW(), SW - xs), H);
        ctx.beginPath();
        if (lastPt) ctx.moveTo(X0 + lastPt[0], lastPt[1]); else ctx.moveTo(X0 + xs, yOf(ts));
        for (let s = lastPt ? lastPt[0] + step : xs; s <= xe; s += step) {
          const y = yOf(ts + (s - xs) / pxps);
          ctx.lineTo(X0 + s, y); lastPt = [s, y];
        }
        ctx.stroke();
        scanX = xe; t += seg / pxps; remaining -= seg;
        if (scanX >= SW - 1e-6) { scanX = 0; lastPt = null; }
      }
      simTime = t1;
      beats = beats.filter(b => b.start + b.end > simTime - secs - 2);
      const done = beats.filter(b => b.start + b.pr <= simTime);
      const cur = done.length ? done[done.length - 1] : beats[0];
      if (cur && cur !== lastShown) { lastShown = cur; showReads(cur); }
      status();
    }

    // ---- readouts ----
    let lastZone = '', lastSr = 0;
    function showReads(b) {
      const f3 = x => x.toFixed(3), hr = 60 / b.rr, dia = b.rr - b.qt;
      const items = [
        ['心率', Math.round(hr), 'bpm'], ['R-R', b.rr.toFixed(2), '秒'],
        ['PR', f3(b.pr), '正常 0.12–0.20'], ['QRS', f3(b.qrs), '正常 ＜0.12'],
        ['QT', f3(b.qt), '隨心率小幅變化'], ['舒張期 (R-R−QT)', f3(dia), '秒']
      ];
      $('.ecg-reads').innerHTML = items.map(([k, v, n]) => `<div class="ecg-rd"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`).join('');
      const s = Math.max(0, Math.min(1, b.qt / b.rr));
      $('.ecg-sys').style.width = (s * 100) + '%'; $('.ecg-dia').style.width = ((1 - s) * 100) + '%';
      $('.ecg-sys').textContent = s > 0.18 ? `收縮 QT ${Math.round(s * 100)}%` : '';
      $('.ecg-dia').textContent = (1 - s) > 0.18 ? `舒張 ${Math.round((1 - s) * 100)}%` : `${Math.round((1 - s) * 100)}%`;
      $('.ecg-bar-rr').textContent = `R-R ${b.rr.toFixed(2)} 秒`;
      const gap = b.rr - b.pr - b.qt;
      $('.ecg-gap').innerHTML = gap < 0.02
        ? `<b>T 波結束到下一個 P 波開始只剩 ${Math.max(0, gap).toFixed(2)} 秒${gap < 0 ? '（已重疊）' : ''}：</b>心率很快時 P 波會貼上甚至疊進前一個 T 波，這是真實心電圖的現象。`
        : `T 波結束到下一個 P 波開始：${gap.toFixed(2)} 秒。`;
      const zone = physioZone(effHR);
      if (zone !== lastZone) { $('.ecg-physio').innerHTML = PHYSIO[zone]; lastZone = zone; }
      const now = performance.now();
      if (now - lastSr > 1000) {
        lastSr = now;
        $('.ecg-sr').textContent = `心率 ${Math.round(hr)}，R-R ${b.rr.toFixed(2)} 秒，PR ${b.pr.toFixed(2)}，QRS ${b.qrs.toFixed(2)}，QT ${b.qt.toFixed(2)}，舒張期 ${dia.toFixed(2)} 秒`;
      }
    }

    // ---- paused tools: select beat / zoom / caliper ----
    let drag = null, calSpan = null, sel = null;
    const layers = () => ({ wave: $('.ecg-lay-wave').checked, intv: $('.ecg-lay-intv').checked, mech: $('.ecg-lay-mech').checked });
    const drawn = () => beats.filter(b => rPeak(b) <= simTime && rPeak(b) >= simTime - SW / pxps + 0.05);
    function selectBeat(b) {
      if (!b) return;
      const i = beats.indexOf(b), nb = beats[i + 1] && rPeak(beats[i + 1]) <= simTime ? beats[i + 1] : null;
      sel = { b, nb }; calSpan = null; drawOverlay();
    }
    function selectAt(x) {
      const t = xToT(x); if (t === null) return;
      let best = null, bd = 1e9;
      for (const b of drawn()) { const d = Math.abs(rPeak(b) - t); if (d < bd) { bd = d; best = b; } }
      selectBeat(best);
    }
    function drawOverlay() {
      cx.clearRect(0, 0, W, H);
      if (sel) {
        const a = tToX(sel.b.start - 0.03), z = tToX(sel.b.start + sel.b.end + 0.03);
        if (z > a) {
          cx.fillStyle = 'rgba(96,165,250,0.16)'; cx.fillRect(a, 0, z - a, H);
          cx.strokeStyle = 'rgba(96,165,250,0.9)'; cx.lineWidth = 1.5; cx.strokeRect(a + 0.5, 0.5, z - a - 1, H - 1);
          ecgPill(cx, '放大 ↓', (a + z) / 2, H - 14, '#93c5fd');
        }
      }
      if (calSpan) drawCal(calSpan[0], calSpan[1]);
      renderZoom();
    }
    function drawCal(a, b) {
      const dts = (b - a) / pxps;
      cx.strokeStyle = '#fde047'; cx.lineWidth = 1.5; cx.setLineDash([4, 3]);
      for (const x of [a, b]) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, H); cx.stroke(); }
      cx.setLineDash([]); cx.beginPath(); cx.moveTo(a, 24); cx.lineTo(b, 24); cx.stroke();
      const txt = `${dts.toFixed(3)} 秒 ＝ ${(dts / 0.04).toFixed(1)} 小格`;
      cx.font = '12px ui-monospace,Menlo,monospace'; cx.textAlign = 'left'; cx.textBaseline = 'alphabetic';
      const tw = cx.measureText(txt).width + 12, tx = Math.min(Math.max(a, 4), W - tw - 4);
      cx.fillStyle = 'rgba(15,23,42,0.9)'; cx.fillRect(tx, 30, tw, 20);
      cx.fillStyle = '#fde047'; cx.fillText(txt, tx + 6, 44);
    }
    function renderZoom() {
      const wrap = $('.ecg-zoom-wrap');
      if (!sel) { wrap.hidden = true; return; }
      wrap.hidden = false;
      const { b, nb } = sel, box = $('.ecg-zoom'), ZW = box.clientWidth;
      const nbR = nb ? rPeak(nb) : null;
      let t0 = b.start - 0.12;
      const need = (nbR ? nbR + 0.12 : b.start + b.end + 0.15) - t0;
      const target = Math.max(11, Math.min(22, ZW / 50));
      const win = Math.max(ZW / (SPEED * target), need);
      t0 -= (win - need) / 2;
      const zpx = ZW / (win * SPEED), zps = zpx * SPEED;
      const ZH = Math.round(165 + 14.5 * zpx), zbase = Math.round(64 + 12 * zpx);
      box.style.height = ZH + 'px';
      const zg = ecgSizeCanvas($('.ecg-zgrid'), ZW, ZH), zt = ecgSizeCanvas($('.ecg-ztrace'), ZW, ZH), zo = ecgSizeCanvas($('.ecg-zover'), ZW, ZH);
      ecgGrid(zg, ZW, ZH, zpx, zbase, 0);
      zt.strokeStyle = '#34d399'; zt.lineWidth = 2.6; zt.lineJoin = 'round'; zt.beginPath();
      let started = false;
      for (let x = 0; x <= ZW; x += 0.5) {
        const t = t0 + x / zps; if (t > simTime) break;
        const y = zbase - mv(t) * GAIN * zpx;
        if (started) zt.lineTo(x, y); else { zt.moveTo(x, y); started = true; }
      }
      zt.stroke();
      ecgAnnotate(zo, { tToX: t => (t - t0) * zps, base: zbase, pxmm: zpx, H: ZH, W: ZW, mv, b, nb, layers: layers() });
    }
    function clearTools() { calSpan = null; sel = null; drag = null; cx.clearRect(0, 0, W, H); $('.ecg-zoom-wrap').hidden = true; }

    const pos = e => e.clientX - overCv.getBoundingClientRect().left;
    overCv.style.touchAction = 'pan-y';
    overCv.addEventListener('pointerdown', e => { if (!st.paused) return; drag = { x0: pos(e), moved: false }; overCv.setPointerCapture(e.pointerId); });
    overCv.addEventListener('pointermove', e => {
      if (!drag) return; const x = pos(e);
      if (Math.abs(x - drag.x0) > 4) drag.moved = true;
      if (drag.moved) { calSpan = [Math.max(X0, Math.min(drag.x0, x)), Math.max(drag.x0, x)]; drawOverlay(); }
    });
    overCv.addEventListener('pointerup', () => { if (!drag) return; if (!drag.moved) selectAt(drag.x0); drag = null; });
    overCv.addEventListener('keydown', e => {
      if (e.key === 'Escape' && sel) { sel = null; drawOverlay(); e.preventDefault(); return; }
      if (!st.paused || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
      e.preventDefault();
      const list = drawn(); if (!list.length) return;
      let i = sel ? list.indexOf(sel.b) : -1;
      if (i < 0) i = list.length - 1; else i = Math.max(0, Math.min(list.length - 1, i + (e.key === 'ArrowRight' ? 1 : -1)));
      selectBeat(list[i]);
    });
    $('.ecg-zoom-close').addEventListener('click', () => { sel = null; drawOverlay(); });
    ['.ecg-lay-wave', '.ecg-lay-intv', '.ecg-lay-mech'].forEach(s => $(s).addEventListener('change', () => { if (sel) renderZoom(); }));

    // ---- controls ----
    const slider = $('.ecg-slider');
    function setTarget(v) {
      st.target = v; slider.value = v; $('.ecg-hr-out').textContent = v; status(true);
      root.querySelectorAll('.ecg-chip').forEach(c => c.setAttribute('aria-pressed', String(+c.dataset.hr === v)));
    }
    slider.addEventListener('input', e => setTarget(parseInt(e.target.value, 10)));
    root.querySelectorAll('.ecg-chip').forEach(c => c.addEventListener('click', () => setTarget(+c.dataset.hr)));
    $('.ecg-rsa').addEventListener('change', e => { st.rsa = e.target.checked; status(true); });
    $('.ecg-lag').addEventListener('change', e => { st.lag = e.target.checked; status(true); });
    const pauseBtn = $('.ecg-pause');
    function setPaused(p) {
      st.paused = p; pauseBtn.textContent = p ? '繼續' : '暫停';
      pauseBtn.setAttribute('aria-pressed', String(p));
      if (!p) clearTools();
      status(true);
    }
    pauseBtn.addEventListener('click', () => setPaused(!st.paused));

    // ---- loop ----
    let lastTs = 0;
    function loop(ts) {
      if (!lastTs) lastTs = ts;
      let dt = (ts - lastTs) / 1000; lastTs = ts;
      if (dt > 0.25) dt = 0; // 分頁隱藏後回來：跳過，不讓時間變形
      if (!st.paused && dt > 0) update(dt);
      requestAnimationFrame(loop);
    }
    resize();
    for (let i = 0; i < 60 * (secs - 0.5); i++) update(1 / 60); // 預先填滿畫面
    setPaused(st.paused);
    addEventListener('resize', () => { const w = scope.clientWidth; if (w && w !== W) resize(); else if (sel) renderZoom(); });
    requestAnimationFrame(loop);
    return { resize };
  }

  return { html, mount };
})();

// 第一關標示題（題型 "label"）：先自己標，再對答案。
// 依賴 ecg-model.js、ecg-draw.js。規格：docs/ECG_SIM_LABEL_SPEC.md §4.2。
window.EcgLabel = (() => {
  function html() {
    return `<div class="ecg-label">
  <div class="ecg-scope ecg-lscope">
    <canvas class="ecg-layer ecg-lgrid" aria-hidden="true"></canvas>
    <canvas class="ecg-layer ecg-ltrace" aria-hidden="true"></canvas>
    <canvas class="ecg-layer ecg-lover" role="img" aria-label="作答用心電圖：按住左右拖曳框出答案，或使用下方的起點、終點滑桿"></canvas>
    <div class="ecg-lbl">LEAD II • 25 mm/s • 10 mm/mV • 小格 0.04 秒・大格 0.20 秒</div>
  </div>
  <div class="ecg-sel">在心電圖上按住左右拖曳，框出你的答案。</div>
  <div class="ecg-ranges">
    <label>起點 <input class="ecg-start" type="range" min="0" step="0.01" value="0"></label>
    <label>終點 <input class="ecg-end" type="range" min="0" step="0.01" value="0"></label>
  </div>
  <div class="ecg-row">
    <button type="button" class="ecg-check" disabled>對答案</button>
    <button type="button" class="ecg-clear">重新框選</button>
    <button type="button" class="ecg-reveal" hidden>顯示正確位置</button>
  </div>
  <div class="ecg-fb" aria-live="polite" hidden></div>
</div>`;
  }

  // q: { id, target, tol, hint, explain }；onPass() 由元件庫前進到下一題
  function mount(el, q, CL, onPass) {
    const $ = s => el.querySelector(s);
    const scope = $('.ecg-lscope'), startIn = $('.ecg-start'), endIn = $('.ecg-end');
    let W = 0, H = 0, pxmm = 10, pxps = 250, base = 0, view = 3, g, c, o;
    const hr = 60 + Math.floor(Math.random() * 36);          // 每題隨機 60–95 bpm
    const beats = makeStrip(hr, 4, Math.random());             // 起點隨機落在心動週期中
    let sel = null, tries = 0, hinted = false, revealed = false, passed = false, answer = null;
    const mv = t => mvAt(beats, t);
    const box = e => (Math.abs(e) / 0.04).toFixed(1);

    function resize() {
      if (!scope.clientWidth) return; // 題目尚未顯示
      W = scope.clientWidth;
      view = W >= 700 ? 3 : 2; pxmm = W / (view * 25); pxps = pxmm * 25;
      H = Math.round(Math.max(190, Math.min(320, pxmm * 26)));
      scope.style.height = H + 'px';
      g = ecgSizeCanvas($('.ecg-lgrid'), W, H); c = ecgSizeCanvas($('.ecg-ltrace'), W, H); o = ecgSizeCanvas($('.ecg-lover'), W, H);
      base = Math.round(H * 0.64);
      startIn.max = endIn.max = String(view);
      if (sel) sel = [Math.min(sel[0], view), Math.min(sel[1], view)];
      draw();
    }
    function draw() {
      ecgGrid(g, W, H, pxmm, base, 0);
      c.clearRect(0, 0, W, H); c.strokeStyle = '#34d399'; c.lineWidth = 2.4; c.lineJoin = 'round'; c.beginPath();
      for (let x = 0; x <= W; x += 0.5) { const y = base - mv(x / pxps) * 10 * pxmm; if (x === 0) c.moveTo(x, y); else c.lineTo(x, y); }
      c.stroke();
      overlay();
    }
    function overlay() {
      o.clearRect(0, 0, W, H);
      if (answer && (passed || revealed)) {
        const [a, z] = answer.map(t => t * pxps);
        o.fillStyle = 'rgba(74,222,128,0.18)'; o.fillRect(a, 0, z - a, H);
        o.strokeStyle = '#4ade80'; o.lineWidth = 2;
        for (const x of [a, z]) { o.beginPath(); o.moveTo(x, 0); o.lineTo(x, H); o.stroke(); }
        ecgPill(o, `正確：${featureNames[q.target]}`, (a + z) / 2, H - 14, '#4ade80');
      }
      if (sel) {
        const [a, z] = sel.map(t => t * pxps);
        o.fillStyle = 'rgba(253,224,71,0.16)'; o.fillRect(a, 0, z - a, H);
        o.strokeStyle = '#fde047'; o.lineWidth = 1.5; o.setLineDash([5, 4]);
        for (const x of [a, z]) { o.beginPath(); o.moveTo(x, 0); o.lineTo(x, H); o.stroke(); }
        o.setLineDash([]);
        ecgPill(o, `你的答案 ${(sel[1] - sel[0]).toFixed(2)} 秒`, (a + z) / 2, 34, '#fde047');
      }
    }
    function setSel(a, b) {
      if (passed) return;
      sel = [Math.max(0, Math.min(a, b)), Math.min(view, Math.max(a, b))];
      startIn.value = sel[0].toFixed(2); endIn.value = sel[1].toFixed(2);
      const d = sel[1] - sel[0];
      $('.ecg-sel').textContent = `你框的範圍：${d.toFixed(3)} 秒 ＝ ${(d / 0.04).toFixed(1)} 小格`;
      $('.ecg-check').disabled = d <= 0;
      overlay();
    }

    // 拖曳框選
    const ov = $('.ecg-lover');
    ov.style.touchAction = 'none';
    let drag = null;
    const tAt = e => Math.max(0, Math.min(W, e.clientX - ov.getBoundingClientRect().left)) / pxps;
    ov.addEventListener('pointerdown', e => { if (passed) return; drag = tAt(e); ov.setPointerCapture(e.pointerId); });
    ov.addEventListener('pointermove', e => { if (drag === null) return; const t = tAt(e); if (Math.abs(t - drag) * pxps >= 3) setSel(drag, t); });
    ov.addEventListener('pointerup', () => { drag = null; });
    // 鍵盤替代：起點／終點滑桿
    startIn.addEventListener('input', () => setSel(+startIn.value, sel ? sel[1] : +startIn.value));
    endIn.addEventListener('input', () => setSel(sel ? sel[0] : +endIn.value, +endIn.value));

    function hintOnce() { if (!hinted) { hinted = true; CL.hint?.(q.id); } }
    $('.ecg-check').addEventListener('click', () => {
      if (!sel || passed) return;
      const r = grade(q.target, sel, beats, view, q.tol);
      CL.answer?.(q.id, r.ok);
      const fb = $('.ecg-fb'); fb.hidden = false;
      if (r.ok) {
        passed = true; answer = r.best.range;
        const d = sel[1] - sel[0], ans = answer[1] - answer[0];
        const extra = q.target === 'RR'
          ? `你量到 R-R ＝ ${d.toFixed(2)} 秒，所以心率 ＝ 60 ÷ ${d.toFixed(2)} ≈ <b>${Math.round(60 / d)} 次/分</b>（本圖實際 ${hr} 次/分）。R-R 越短，心率越快。`
          : (q.explain || '');
        fb.className = 'ecg-fb ok';
        fb.innerHTML = `<b>答對了！</b>你框了 ${d.toFixed(3)} 秒（${(d / 0.04).toFixed(1)} 小格），標準答案 ${ans.toFixed(3)} 秒（${(ans / 0.04).toFixed(1)} 小格）。<br>${extra}`;
        $('.ecg-check').disabled = true; $('.ecg-reveal').hidden = true; $('.ecg-clear').disabled = true;
        startIn.disabled = endIn.disabled = true;
        overlay();
        setTimeout(onPass, 1600);
        return;
      }
      tries++; hintOnce();
      const parts = [];
      if (r.best) {
        parts.push(Math.abs(r.best.e1) > q.tol ? `起點${r.best.e1 < 0 ? '太早' : '太晚'} ${box(r.best.e1)} 小格` : '起點正確');
        parts.push(Math.abs(r.best.e2) > q.tol ? `終點${r.best.e2 < 0 ? '太早' : '太晚'} ${box(r.best.e2)} 小格` : '終點正確');
      }
      fb.className = 'ecg-fb no';
      fb.innerHTML = (r.confusedWith ? `<b>你框的比較像「${featureNames[r.confusedWith]}」。</b>` : `<b>還差一點：</b>${parts.join('，')}。`)
        + `<br>提示：${q.hint}` + (revealed ? '<br>請對照綠色的正確位置，自己再框一次。' : '');
      if (tries >= 2 && !revealed) $('.ecg-reveal').hidden = false;
    });
    $('.ecg-clear').addEventListener('click', () => {
      if (passed) return;
      sel = null; $('.ecg-check').disabled = true;
      $('.ecg-sel').textContent = '在心電圖上按住左右拖曳，框出你的答案。';
      overlay();
    });
    $('.ecg-reveal').addEventListener('click', () => {
      const cs = candidates(q.target, beats, view);
      answer = (sel && closest(q.target, sel, beats, view)?.range) || cs[Math.floor(cs.length / 2)];
      revealed = true; CL.hint?.(q.id);
      const ans = answer[1] - answer[0], fb = $('.ecg-fb');
      fb.hidden = false; fb.className = 'ecg-fb no';
      fb.innerHTML = `<b>正確位置已用綠色標出</b>（${ans.toFixed(3)} 秒 ＝ ${(ans / 0.04).toFixed(1)} 小格）。對照你黃色的框，看看差在哪裡，<b>再自己框一次</b>才能進下一題。`;
      $('.ecg-reveal').hidden = true;
      overlay();
    });

    el.__ecg = { get beats() { return beats; }, get view() { return view; }, get pxps() { return pxps; } }; // 供自動化驗收使用
    resize();
    el.closest('.stage')?.addEventListener('stage-show', resize);
    addEventListener('resize', () => { if (scope.clientWidth && scope.clientWidth !== W) resize(); });
    return { resize };
  }

  return { html, mount };
})();

// 教材元件庫：由 content.json 產生單檔互動教材（六節點＋兩關題目＋SDK 回報）。
// 擴充點：lab.widget（例如 "ecg-sim"）與題型 type（例如 "label"），由 materials-src/widgets/ 提供。
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Fisher–Yates 洗牌（無偏差）
const shuffle = rows => {
  const a = [...rows];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const WIDGETS = { 'ecg-sim': () => window.EcgSim };
const QUESTION_TYPES = { label: () => window.EcgLabel };

function renderLab(lab, figures) {
  const widget = lab.widget && WIDGETS[lab.widget]?.();
  if (lab.widget) {
    return `<section class="lab"><h2>${esc(lab.title)}</h2><p>${esc(lab.intro)}</p><div class="lab-widget" data-widget="${esc(lab.widget)}">${widget ? widget.html(lab) : ''}</div></section>`;
  }
  return `<section class="lab"><h2>${esc(lab.title)}</h2><p>${esc(lab.intro)}</p>`
    + `<div class="state-figure" data-lab-state="${lab.states[0].id}" data-state="${lab.states[0].id}">${figures[lab.figure]}</div>`
    + `<div class="state-controls">${lab.states.map((x, i) => `<button data-lab-state="${x.id}" aria-pressed="${!i}">${esc(x.label)}</button>`).join('')}</div>`
    + `<p class="state-explain" aria-live="polite">${esc(lab.states[0].explain)}</p>`
    + `<h3>${esc(lab.predict.question)}</h3><div class="options predict">${lab.predict.options.map((o, i) => `<button data-answer="${i}">${esc(o)}</button>`).join('')}</div>`
    + `<p class="feedback" aria-live="polite"></p></section>`;
}

function renderQuestion(q) {
  const type = q.type && q.type !== 'mcq' ? QUESTION_TYPES[q.type]?.() : null;
  if (type) return `<h3>${esc(q.stem)}</h3><div class="q-widget" data-type="${esc(q.type)}">${type.html(q)}</div>`;
  return `<h3>${esc(q.stem)}</h3><div class="options">${shuffle(q.options.map((text, answer) => ({ text, answer }))).map(o => `<button data-answer="${o.answer}">${esc(o.text)}</button>`).join('')}</div><p class="feedback" aria-live="polite"></p>`;
}

function render(content, figures) {
  const stage = (rows, kind) => rows.map((q, i) => `<article class="stage" data-kind="${kind}" data-index="${i}" ${i ? 'hidden' : ''}>${renderQuestion(q)}</article>`).join('');
  return `<main class="kit" data-slug="${content.slug}">`
    + `<header class="hero"><p>${esc(content.label)}</p><h1>${esc(content.title)}</h1><p>${esc(content.subtitle)}</p></header>`
    + `<section class="stats">${content.stats.map(x => `<div class="tile"><strong>${esc(x.value)}</strong>${esc(x.label)}</div>`).join('')}</section>`
    + renderLab(content.lab, figures)
    + `<section><h2>知識節點</h2><div class="nodes">${content.nodes.map(n => `<button class="node-button" data-node="${n.id}" aria-expanded="false" aria-controls="detail-${n.id}"><img alt="" src="data:image/svg+xml,${encodeURIComponent(figures[n.figure])}"><strong>${esc(n.title)}</strong><br>${esc(n.summary)}</button>`).join('')}</div>`
    + content.nodes.map(n => `<article class="node-detail" id="detail-${n.id}" data-node-id="${n.id}" hidden><img class="node-figure" alt="${esc(n.title)} 示意圖" src="data:image/svg+xml,${encodeURIComponent(figures[n.figure])}"><h2>${esc(n.title)}</h2><p>${esc(n.concept)}</p><ul>${n.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul><div class="clinical"><strong>${esc(n.clinical.title)}</strong><br>${esc(n.clinical.text)}</div></article>`).join('')
    + `</section>`
    + `<section class="quiz"><h2>第一關｜先備知識</h2>${stage(content.foundation, 'foundation')}<h2>第二關｜情境應用</h2>${stage(content.cases, 'case').replace('data-index="0"', 'data-index="0" hidden')}</section>`
    + `<footer class="credits">${(content.credits || []).map(esc).join('<br>')}</footer></main>`;
}

function mount(content, figures) {
  document.body.innerHTML = render(content, figures);
  const CL = window.CourseLearning || { explore() {}, nodeTime() {}, answer() {}, hint() {}, complete() {} };

  // 知識節點：第一次展開送 explore；收合或分頁隱藏時送前景停留秒數
  const opened = new Map(), explored = new Set();
  document.querySelectorAll('[data-node]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.node, d = document.querySelector('#detail-' + id), was = d.hidden;
    d.hidden = !was; b.setAttribute('aria-expanded', String(was));
    if (was) { if (!explored.has(id)) { explored.add(id); CL.explore(id); } opened.set(id, performance.now()); }
    else { const start = opened.get(id); if (start) CL.nodeTime(id, (performance.now() - start) / 1000); opened.delete(id); }
  }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { for (const [id, start] of opened) CL.nodeTime(id, (performance.now() - start) / 1000); opened.clear(); }
  });

  // 情境實驗室
  if (content.lab.widget) {
    const root = document.querySelector('.lab-widget');
    WIDGETS[content.lab.widget]?.()?.mount(root, content.lab, CL);
  } else {
    document.querySelectorAll('button[data-lab-state]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.labState;
      const fig = document.querySelector('.state-figure');
      fig.dataset.labState = id; fig.dataset.state = id; // data-state 供圖檔內 CSS 切換狀態
      document.querySelectorAll('button[data-lab-state]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      document.querySelector('.state-explain').textContent = content.lab.states.find(x => x.id === id).explain;
    }));
    document.querySelector('.predict').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const ok = +b.dataset.answer === content.lab.predict.answer;
      b.parentElement.nextElementSibling.textContent = ok ? content.lab.predict.feedback : '再比對圖中的狀態與箭頭。';
    });
  }

  // 兩關題目：逐題答對才解鎖；第二關全部答對才送 complete
  let foundation = 0, cases = 0;
  const show = el => { el.hidden = false; el.dispatchEvent(new CustomEvent('stage-show')); };
  const advance = (stage, kind) => {
    stage.hidden = true;
    if (kind === 'foundation') {
      foundation++;
      const next = document.querySelector(`[data-kind="foundation"][data-index="${foundation}"]`);
      show(next || document.querySelector('[data-kind="case"][data-index="0"]'));
    } else {
      cases++;
      const next = document.querySelector(`[data-kind="case"][data-index="${cases}"]`);
      if (next) show(next); else CL.complete();
    }
  };
  document.querySelectorAll('.stage').forEach(stage => {
    const kind = stage.dataset.kind, rows = kind === 'foundation' ? content.foundation : content.cases;
    const q = rows[+stage.dataset.index];
    const type = q.type && q.type !== 'mcq' ? QUESTION_TYPES[q.type]?.() : null;
    if (type) { type.mount(stage.querySelector('.q-widget'), q, CL, () => advance(stage, kind)); return; }
    stage.addEventListener('click', e => {
      const b = e.target.closest('button[data-answer]'); if (!b) return;
      const ok = +b.dataset.answer === q.answer;
      CL.answer(q.id, ok);
      const feedback = stage.querySelector('.feedback');
      if (!ok) { CL.hint?.(q.id); feedback.textContent = `提示：${q.hint}`; return; }
      feedback.textContent = '答對，繼續下一題。';
      stage.querySelectorAll('button').forEach(x => { x.disabled = true; });
      setTimeout(() => advance(stage, kind), 250);
    });
  });
}

// 舊版三段節律圖（ecg-rate.svg）的狀態切換；保留相容
document.addEventListener('click', event => {
  const button = event.target.closest('button[data-lab-state]'); if (!button) return;
  const figure = document.querySelector('.state-figure'), state = button.dataset.labState; if (!figure) return;
  figure.querySelectorAll('.slow,.rest,.fast').forEach(group => { group.style.display = group.classList.contains(state) ? 'block' : 'none'; });
});
document.addEventListener('DOMContentLoaded', () => {
  const figure = document.querySelector('.state-figure');
  figure?.querySelector('.slow')?.style.setProperty('display', 'block');

mount({"slug":"ecg-basics","version":"v1","title":"心電圖基礎與心率調控","subtitle":"以波形、傳導與 R-R 間期建立 ECG 的生理概念。","label":"心電圖基礎與心率調控","stats":[{"value":"0.12–0.20 秒","label":"PR 間隔參考範圍"},{"value":"\u003c 0.12 秒","label":"QRS 時間參考範圍"},{"value":"HR = 60 ÷ R-R","label":"規則節律的換算式"}],"lab":{"widget":"ecg-sim","title":"心率與心動週期模擬器","intro":"調整心率，觀察以 25 mm/s、10 mm/mV 校正的 ECG。暫停後可選拍、標示與量測。","note":"教學示意模型，不是個人心電圖判讀工具。"},"nodes":[{"id":"ecg-basics-node-01","tag":"波形","title":"P 波與心房去極化","summary":"P 波代表心房的電活動。","figure":"ecg-node-p.svg","concept":"P 波反映心房去極化；電活動通常先於其後的機械收縮。","points":["P 波從起點到終點量測。","ECG 記錄的是電位變化，不是直接記錄心肌收縮。"],"clinical":{"title":"學習重點","text":"先有電活動（P 波），心房才收縮；ECG 記錄的是電訊號，不是肌肉的動作。"}},{"id":"ecg-basics-node-02","tag":"傳導","title":"PR 間隔與房室傳導","summary":"由 P 波起點到 QRS 起點。","figure":"ecg-node-pr.svg","concept":"PR 間隔包含心房去極化與衝動經房室交界傳至心室開始去極化的時間。","points":["參考範圍常寫為 0.12–0.20 秒。","房室交界傳導延遲有助心室充盈。"],"clinical":{"title":"學習重點","text":"PR 間隔大部分是房室結約 0.1 秒的延遲，讓心室有時間把血充滿。"}},{"id":"ecg-basics-node-03","tag":"波形","title":"QRS 與心室去極化","summary":"QRS 反映快速心室去極化。","figure":"ecg-node-qrs.svg","concept":"QRS 群波反映心室去極化。","points":["正常 QRS 時間常小於 0.12 秒。","Q、R、S 是偏轉的命名規則。"],"clinical":{"title":"學習重點","text":"QRS 振幅大，是因為心室肌量大；心房再極化同時發生，被 QRS 蓋住。"}},{"id":"ecg-basics-node-04","tag":"再極化","title":"ST、T 與 QT","summary":"連結心室再極化與週期時程。","figure":"ecg-node-st-t.svg","concept":"ST 段與心室整體處於動作電位高原期有關；T 波反映心室再極化。","points":["QT 間隔自 QRS 起始至 T 波終點。","QT 會受心率影響。"],"clinical":{"title":"學習重點","text":"QT 間隔包含心室去極化加上再極化的時間；心跳越快，QT 越短。"}},{"id":"ecg-basics-node-05","tag":"節律","title":"R-R、心率與呼吸變異","summary":"相鄰 R 波間距可估算規則心率。","figure":"ecg-node-rr.svg","concept":"R-R 間期是相鄰心室去極化之間的時間。","points":["規則節律可用 HR = 60 ÷ R-R（秒）估算。","心率變快時，PR 與 QRS 幾乎不變，縮短最多的是舒張期。"],"clinical":{"title":"學習重點","text":"心電圖紙一大格是 0.20 秒；R-R 為 4 大格（0.8 秒）時，心率 = 60 ÷ 0.8 = 75 次/分。"}},{"id":"ecg-basics-node-06","tag":"導程","title":"10 電極與 12 導程","summary":"電極貼片建立不同觀測角度。","figure":"ecg-node-leads.svg","concept":"標準十二導程 ECG 使用十個電極建立十二個觀測角度。","points":["三個標準肢導程：I、II、III。","六個胸前導程：V1–V6。"],"clinical":{"title":"實驗課提醒","text":"貼電極前先確認位置，依老師示範與實驗課規範操作。"}}],"foundation":[{"id":"ecg-basics-foundation-q01","stem":"P 波主要反映何種電活動？","options":["心房去極化","心室去極化","心室再極化","心房收縮本身"],"answer":0,"hint":"想想 ECG 記錄的是電活動。","nodeId":"ecg-basics-node-01"},{"id":"ecg-basics-foundation-l01","type":"label","stem":"框出一個完整的 P 波","target":"P","tol":0.03,"hint":"P 波是 QRS 前面那個小而圓的正向波。從它離開基線的地方，框到回到基線為止。","explain":"P 波代表心房去極化，約 0.08–0.10 秒（2–2.5 小格）；心房收縮緊接在 P 波之後發生。","nodeId":"ecg-basics-node-01"},{"id":"ecg-basics-foundation-l02","type":"label","stem":"量出一個 PR 間隔","target":"PRi","tol":0.03,"hint":"「間隔」要從 P 波開始量到 QRS 開始。只量 P 波結束到 QRS 之間那段平線，是 PR 段，不是 PR 間隔。","explain":"PR 間隔正常 0.12–0.20 秒（3–5 小格），大部分時間花在房室結約 0.1 秒的延遲，讓心室有時間充血。","nodeId":"ecg-basics-node-02"},{"id":"ecg-basics-foundation-l03","type":"label","stem":"框出一個完整的 QRS 群波","target":"QRS","tol":0.025,"hint":"從第一個小小向下的 Q 波開始，經過高聳的 R 波，到 S 波回到基線為止。正常不超過 3 小格。","explain":"QRS 代表心室去極化，正常 \u003c 0.12 秒（3 小格）；心房再極化同時發生，被 QRS 掩蓋。","nodeId":"ecg-basics-node-03"},{"id":"ecg-basics-foundation-q04","stem":"T 波主要反映？","options":["心室再極化","心房去極化","心室去極化","房室交界延遲"],"answer":0,"hint":"想想心室細胞回復膜電位的過程。","nodeId":"ecg-basics-node-04"},{"id":"ecg-basics-foundation-l04","type":"label","stem":"量出一個 R-R 間期","target":"RR","tol":0.03,"hint":"從一個 R 波的尖端，拖到下一個 R 波的尖端。","explain":"R-R 間期是相鄰兩次心室去極化的間隔；心率 ＝ 60 ÷ R-R（秒）。","nodeId":"ecg-basics-node-05"}],"cases":[{"id":"ecg-basics-case-q01","stem":"在模擬器把心率從 75 拉到 150。一次心跳（R-R）裡，縮短最多的是哪一段？","options":["T 波結束到下一個 QRS 之間（心室舒張期）","QRS 群波","PR 間隔","P 波"],"answer":0,"hint":"比較 75 與 150 時模擬器下方的收縮／舒張比例條。","nodeId":"ecg-basics-node-05"},{"id":"ecg-basics-case-q02","stem":"學生說「P 波就是心房收縮」。最合宜的修正是？","options":["P 波是心房去極化，收縮通常在其後發生","P 波是心室去極化","P 波是心室再極化","P 波只代表貼片雜訊"],"answer":0,"hint":"區分電活動與機械活動。","nodeId":"ecg-basics-node-01"},{"id":"ecg-basics-case-q03","stem":"為何正常 ECG 常看不到獨立的心房再極化波？","options":["常被同時期較大的 QRS 波群遮蔽","心房不會再極化","發生在 T 波結束後","電極無法記錄心房活動"],"answer":0,"hint":"想想心室肌量與同時發生的電活動。","nodeId":"ecg-basics-node-03"},{"id":"ecg-basics-case-q04","stem":"同學說「T 波就是心室收縮結束的波」。最合宜的修正是？","options":["T 波是心室再極化的電訊號，不是收縮動作本身","T 波是心房去極化","T 波是心室去極化","T 波是房室結的延遲"],"answer":0,"hint":"區分電活動與機械活動：T 波是哪一個腔室、哪一種電位變化？","nodeId":"ecg-basics-node-04"},{"id":"ecg-basics-case-q05","stem":"「12 導程」最合宜的理解是？","options":["由 10 個電極建立的 12 個觀測角度","必須使用 12 個貼片","只有 12 次心跳","只測量左心室"],"answer":0,"hint":"分清電極與導程。","nodeId":"ecg-basics-node-06"}],"credits":["心電圖示意圖：課程平台自繪 SVG，CC0。","內容發布前仍須由教師依指定課本或 ECG 教材審核。"]},{"ecg-node-p.svg":"\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"P 波：心房去極化\">\u003crect width=\"600\" height=\"260\" rx=\"18\" fill=\"#fffaf8\"/>\u003cline x1=\"30.0\" y1=\"20\" x2=\"30.0\" y2=\"235\" stroke=\"#f3b8b8\" stroke-width=\"1.2\"/>\u003cline x1=\"62.2\" y1=\"20\" x2=\"62.2\" y2=\"235\" stroke=\"#f3b8b8\" stroke-width=\"0.5\"/>\u003cline x1=\"94.5\" y1=\"20\" x2=\"94.5\" y2=\"235\" stroke=\"#f3b8b8\" stroke-width=\"0.5\"/>\u003cline x1=\"126.7\" y1=\"20\" x2=\"126.7\" y2=\"235\" stroke=\"#f3b8b8\" stroke-width=\"0.5\"/>\u003cline x1=\"159.0\" y1=\"20\" x2=\"159.0\" y2=\"235\" stroke=\"#f3b8b8\" stroke-width=\"0.5\"/>\u003cline x1=\"191.2\" y1=\"20\" x2=\"191.2\" y2=\"235\" stroke=\"#f3b8b8\" stroke-width=\"1.2\"/>\u003cline x1=\"223.4\" y1=\"20\" x2=\"223.4\" y2=\"235\" stroke=\"#f3b8b8\" stroke-width=\"0.5\"/>\u003cline x1=\"255.7\" y1=\"20\" x2=\"255.7\" y2=\"235\" stroke=\"#f3b8b8\" stroke-width=\"0.5\"/>\u003cline x1=\"287.9\" y1=\"20\" x2=\"287.9\" y2=\"235\" stroke=\"#f3b8b8\" stroke-width=\"0.5\"/>\u003cline x1=\"320.1\" y1=\"20\" x2=\"320.1\" y2=\"235\" stroke=\"#f3b8b8\" stroke-width=\"0.5\"/>\u003cline x1=\"352.4\" y1=\"20\" x2=\"352.4\" y2=\"235\" stroke=\"#f3b8b8\" stroke-width=\"1.2\"/>\u003cline x1=\"384.6\" y1=\"20\" x2=\"384.6\" y2=\"235\" stroke=\"#f3b8b8\" stroke-width=\"0.5\"/>\u003cline x1=\"416.9\" y1=\"20\" x2=\"416.9\" y2=\"235\" stroke=\"#f3b8b8\" stroke-width=\"0.5\"/>
