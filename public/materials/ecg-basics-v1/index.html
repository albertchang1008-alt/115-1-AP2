<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="material-ids" content="ecg-basics-case-q01,ecg-basics-case-q02,ecg-basics-case-q03,ecg-basics-case-q04,ecg-basics-case-q05,ecg-basics-foundation-q01,ecg-basics-foundation-q02,ecg-basics-foundation-q03,ecg-basics-foundation-q04,ecg-basics-foundation-q05,ecg-basics-foundation-q06,ecg-basics-node-01,ecg-basics-node-02,ecg-basics-node-03,ecg-basics-node-04,ecg-basics-node-05,ecg-basics-node-06"><title>心電圖基礎與心率調控</title><style>:root{--oxy:#a71930;--deoxy:#1769aa;--tissue:#f3eee9;--accent:#5b3b8c;--ok:#176b45;--warn:#9a5a00;--bg:#fffaf8;--ink:#17212b;--muted:#4e5964;font:16px/1.65 system-ui,sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0}.kit{max-width:1100px;margin:auto;padding:24px}.hero,.lab,.node,.quiz,.credits{background:#fff;border:1px solid #ded6d0;border-radius:18px;padding:22px;margin:18px 0}.stats,.nodes,.options{display:grid;gap:14px}.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.tile,.node-button{border:1px solid #d9ccd0;background:#fff;padding:16px;border-radius:14px;color:inherit;text-align:left}.tile strong{display:block;font-size:1.35rem;color:var(--oxy)}.nodes{grid-template-columns:repeat(3,1fr)}.node[hidden],.node-detail[hidden],.stage[hidden]{display:none}.node-figure{width:100%;max-height:340px}.state-controls,.options{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:12px 0}button{font:inherit;cursor:pointer;border-radius:10px;border:2px solid var(--accent);background:#fff;color:#281b3e;padding:10px}button[aria-pressed="true"],button:hover{background:var(--accent);color:#fff}.feedback{font-weight:700}.ok{color:var(--ok)}.warn{color:var(--warn)}.clinical{background:var(--tissue);padding:14px;border-left:5px solid var(--accent)}svg{max-width:100%;height:auto}.heart-state{width:100%}@media(max-width:760px){.kit{padding:12px}.nodes{grid-template-columns:1fr}.hero,.lab,.node,.quiz,.credits{padding:16px}}@media(prefers-reduced-motion:no-preference){.flow{animation:pulse 1.8s infinite}@keyframes pulse{50%{stroke-dashoffset:18}}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body><script src="https://albertchang1008-alt.github.io/115-1-AP2/materials/course-learning.js"></script><script>window.CourseLearning=window.CourseLearning||{explore(){},nodeTime(){},answer(){},complete(){}};</script><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=rows=>[...rows].sort(()=>Math.random()-.5);
function render(content,figures){const stage=(rows,kind)=>rows.map((q,i)=>`<article class="stage" data-kind="${kind}" data-index="${i}" ${i?'hidden':''}><h3>${esc(q.stem)}</h3><div class="options">${shuffle(q.options.map((text,answer)=>({text,answer}))).map(o=>`<button data-answer="${o.answer}">${esc(o.text)}</button>`).join('')}</div><p class="feedback" aria-live="polite"></p></article>`).join('');return `<main class="kit" data-slug="${content.slug}"><header class="hero"><p>${esc(content.label)}</p><h1>${esc(content.title)}</h1><p>${esc(content.subtitle)}</p></header><section class="stats">${content.stats.map(x=>`<div class="tile"><strong>${esc(x.value)}</strong>${esc(x.label)}</div>`).join('')}</section><section class="lab"><h2>${esc(content.lab.title)}</h2><p>${esc(content.lab.intro)}</p><div class="state-figure" data-lab-state="${content.lab.states[0].id}">${figures[content.lab.figure]}</div><div class="state-controls">${content.lab.states.map((x,i)=>`<button data-lab-state="${x.id}" aria-pressed="${!i}">${esc(x.label)}</button>`).join('')}</div><p class="state-explain" aria-live="polite">${esc(content.lab.states[0].explain)}</p><h3>${esc(content.lab.predict.question)}</h3><div class="options predict">${content.lab.predict.options.map((o,i)=>`<button data-answer="${i}">${esc(o)}</button>`).join('')}</div><p class="feedback" aria-live="polite"></p></section><section><h2>知識節點</h2><div class="nodes">${content.nodes.map(n=>`<button class="node-button" data-node="${n.id}" aria-expanded="false" aria-controls="detail-${n.id}"><img alt="" src="data:image/svg+xml,${encodeURIComponent(figures[n.figure])}"><strong>${esc(n.title)}</strong><br>${esc(n.summary)}</button>`).join('')}</div>${content.nodes.map(n=>`<article class="node-detail" id="detail-${n.id}" data-node-id="${n.id}" hidden><img class="node-figure" alt="${esc(n.title)} 示意圖" src="data:image/svg+xml,${encodeURIComponent(figures[n.figure])}"><h2>${esc(n.title)}</h2><p>${esc(n.concept)}</p><ul>${n.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><div class="clinical"><strong>${esc(n.clinical.title)}</strong><br>${esc(n.clinical.text)}</div></article>`).join('')}</section><section class="quiz"><h2>第一關｜先備知識</h2>${stage(content.foundation,'foundation')}<h2>第二關｜情境應用</h2>${stage(content.cases,'case').replace('data-index="0"','data-index="0" hidden')}</section><footer class="credits">${(content.credits||[]).map(esc).join('<br>')}</footer></main>`}
function mount(content,figures){document.body.innerHTML=render(content,figures);const CL=window.CourseLearning||{explore(){},nodeTime(){},answer(){},hint(){},complete(){}};const opened=new Map;document.querySelectorAll('[data-node]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.node,d=document.querySelector('#detail-'+id),was=d.hidden;d.hidden=!was;b.setAttribute('aria-expanded',String(was));if(was){if(!opened.has(id))CL.explore(id);opened.set(id,performance.now())}else{const start=opened.get(id);if(start)CL.nodeTime(id,(performance.now()-start)/1000);opened.delete(id)}}));document.addEventListener('visibilitychange',()=>{if(document.hidden){for(const [id,start] of opened)CL.nodeTime(id,(performance.now()-start)/1000);opened.clear()}});document.querySelectorAll('button[data-lab-state]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.labState;document.querySelector('.state-figure').dataset.labState=id;document.querySelectorAll('button[data-lab-state]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('.state-explain').textContent=content.lab.states.find(x=>x.id===id).explain}));document.querySelector('.predict').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const ok=+b.dataset.answer===content.lab.predict.answer;b.parentElement.nextElementSibling.textContent=ok?content.lab.predict.feedback:'再比對圖中的狀態與箭頭。'});let foundation=0,cases=0;document.querySelectorAll('.stage').forEach(stage=>stage.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const kind=stage.dataset.kind,rows=kind==='foundation'?content.foundation:content.cases,index=kind==='foundation'?foundation:cases,q=rows[index],ok=+b.dataset.answer===q.answer;CL.answer(q.id,ok);const feedback=stage.querySelector('.feedback');if(!ok){CL.hint?.(q.id);feedback.textContent=`提示：${q.hint}`;return}feedback.textContent='答對，繼續下一題。';stage.querySelectorAll('button').forEach(x=>x.disabled=true);setTimeout(()=>{stage.hidden=true;if(kind==='foundation'){foundation++;const next=document.querySelector(`[data-kind="foundation"][data-index="${foundation}"]`);if(next)next.hidden=false;else document.querySelector('[data-kind="case"][data-index="0"]').hidden=false}else{cases++;const next=document.querySelector(`[data-kind="case"][data-index="${cases}"]`);if(next)next.hidden=false;else CL.complete()}},250)}));}
document.addEventListener('click',event=>{const button=event.target.closest('button[data-lab-state]');if(!button)return;const figure=document.querySelector('.state-figure'),state=button.dataset.labState;if(!figure)return;figure.querySelectorAll('.slow,.rest,.fast').forEach(group=>{group.style.display=group.classList.contains(state)?'block':'none'});});
document.addEventListener('DOMContentLoaded',()=>{const figure=document.querySelector('.state-figure');figure?.querySelector('.slow')?.style.setProperty('display','block');});

concept":"R-R 間期是相鄰 R 波、也就是相鄰心室去極化之間的時間。","points":["規則節律可用 HR = 60 ÷ R-R（秒）估算。","交感興奮常使竇房結放電加快。","呼吸可伴隨正常的心率變異。"],"clinical":{"title":"判讀界線","text":"僅憑心率數字不能判定個人的心律診斷。"}},{"id":"ecg-basics-node-06","tag":"導程","title":"10 電極與 12 導程","summary":"電極貼片建立不同觀測角度。","figure":"ecg-wave.svg","concept":"標準十二導程 ECG 使用十個電極：四肢電極與六個胸前電極，建立十二個觀測角度。","points":["三個標準肢導程：I、II、III。","三個加壓肢導程：aVR、aVL、aVF。","六個胸前導程：V1–V6。"],"clinical":{"title":"安全提醒","text":"貼片定位與檢查操作應依合格人員與臨床規範執行。"}}],"foundation":[{"id":"ecg-basics-foundation-q01","stem":"P 波主要反映何種電活動？","options":["心房去極化","心室去極化","心室再極化","心房收縮本身"],"answer":0,"hint":"想想 ECG 記錄的是電活動。","nodeId":"ecg-basics-node-01"},{"id":"ecg-basics-foundation-q02","stem":"PR 間隔的量測起訖為何？","options":["P 波起點到 QRS 起點","QRS 起點到 T 波終點","R 波到下一個 R 波","P 波終點到 T 波終點"],"answer":0,"hint":"它包含 P 波開始到心室開始去極化。","nodeId":"ecg-basics-node-02"},{"id":"ecg-basics-foundation-q03","stem":"QRS 群波主要代表？","options":["心室去極化","心房去極化","心室再極化","心房機械收縮"],"answer":0,"hint":"這是快速且通常振幅較大的心室電活動。","nodeId":"ecg-basics-node-03"},{"id":"ecg-basics-foundation-q04","stem":"T 波主要反映？","options":["心室再極化","心房去極化","心室去極化","房室交界延遲"],"answer":0,"hint":"想想心室細胞回復膜電位的過程。","nodeId":"ecg-basics-node-04"},{"id":"ecg-basics-foundation-q05","stem":"規則節律的 R-R 間期縮短，心率通常？","options":["增加","降低","不變","無法計算"],"answer":0,"hint":"將較小的 R-R 代入 60 ÷ R-R。","nodeId":"ecg-basics-node-05"},{"id":"ecg-basics-foundation-q06","stem":"標準十二導程 ECG 使用幾個電極？","options":["10 個","12 個","6 個","4 個"],"answer":0,"hint":"導程是觀測角度，不等同貼片數。","nodeId":"ecg-basics-node-06"}],"cases":[{"id":"ecg-basics-case-q01","stem":"規則節律中，R-R 由 1.0 秒縮短為 0.75 秒，心率趨勢為何？","options":["增加","降低","不變","無法估算"],"answer":0,"hint":"比較 60 ÷ 1.0 與 60 ÷ 0.75。","nodeId":"ecg-basics-node-05"},{"id":"ecg-basics-case-q02","stem":"學生說「P 波就是心房收縮」。最合宜的修正是？","options":["P 波是心房去極化，收縮通常在其後發生","P 波是心室去極化","P 波是心室再極化","P 波只代表貼片雜訊"],"answer":0,"hint":"區分電活動與機械活動。","nodeId":"ecg-basics-node-01"},{"id":"ecg-basics-case-q03","stem":"為何正常 ECG 常看不到獨立的心房再極化波？","options":["常被同時期較大的 QRS 波群
