function svg(k){if(k==='ecg')return '<svg viewBox="0 0 700 260"><path d="M40 160h130q20-70 43 0h120l18 35 18-125 18 140 18-50h120q25-70 55 0h110" fill="none" stroke="#2563eb" stroke-width="7"/><text x="180" y="70" fill="#2563eb" font-size="25">P</text><text x="350" y="52" fill="#dc2626" font-size="25">QRS</text><text x="545" y="70" fill="#16a34a" font-size="25">T</text></svg>';if(k==='ap')return '<svg viewBox="0 0 700 260"><path d="M50 210h90l22-150 35 25h210l80 125h170" fill="none" stroke="#2563eb" stroke-width="8"/><text x="130" y="238" fill="#2563eb">0 去極化</text><text x="280" y="65" fill="#d97706" font-size="22">2 高原期</text><text x="490" y="145" fill="#16a34a">3 再極化</text></svg>';if(k==='cells')return '<svg viewBox="0 0 700 260"><rect x="70" y="65" width="230" height="120" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><rect x="400" y="65" width="230" height="120" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/><text x="185" y="120" text-anchor="middle" fill="#1d4ed8" font-size="25">節律細胞</text><text x="185" y="150" text-anchor="middle">自己起跑</text><text x="515" y="120" text-anchor="middle" fill="#15803d" font-size="25">工作心肌</text><text x="515" y="150" text-anchor="middle">負責收縮</text></svg>';let c={sa:'#dc2626',av:'#d97706',his:'#7c3aed',purkinje:'#16a34a'}[k]||'#2563eb';return `<svg viewBox="0 0 700 260"><path d="M175 55c-80-35-110 90-35 110-35 75 100 80 210 50 110 30 245 25 210-50 75-20 45-145-35-110-35-45-110-20-175 28-65-48-140-73-175-28z" fill="#fff4f2" stroke="#e58a7f" stroke-width="4"/><circle cx="250" cy="85" r="15" fill="${c}"/><circle cx="350" cy="135" r="17" fill="${c}"/><path d="M265 90q50 10 70 35m30 20q70 22 140 60" fill="none" stroke="${c}" stroke-width="8" stroke-dasharray="12 8"/></svg>`}
function fifthChapterHeart(kind){const panel={map:['0%','電傳導全景'],sa:['0%','竇房結起跑'],atria:['0%','心房傳導'],av:['33.333%','房室結暫緩'],his:['66.666%','希氏束與束支'],purkinje:['100%','浦金氏纖維分送']}[kind];return panel?`<div class="heart-photo" style="--panel:${panel[0]}"><span>⚡ ${panel[1]}</span></div>`:svg(kind)}
function ecgTimeline(){return `<div class="ecg-timeline"><svg class="ecg-wave" viewBox="0 0 760 180" role="img" aria-label="P、QRS、ST、T 波形與對照區段"><path d="M25 112h105q18-55 40 0h135l18 30 18-105 18 120 18-45h160q22-55 48 0h160" fill="none" stroke="#94a3b8" stroke-width="7"/><path d="M25 112h105q18-55 40 0h35" fill="none" stroke="#2563eb" stroke-width="7"/><path d="M205 112h100" stroke="#f59e0b" stroke-width="7"/><path d="M305 112l18 30 18-105 18 120 18-45h25" fill="none" stroke="#dc2626" stroke-width="7"/><path d="M402 112h135" stroke="#d97706" stroke-width="7"/><path d="M537 112q22-55 48 0h160" fill="none" stroke="#16a34a" stroke-width="7"/><text x="145" y="35" fill="#2563eb" font-size="24" font-weight="800">P</text><text x="245" y="145" fill="#d97706" font-size="20" font-weight="800">PR</text><text x="330" y="27" fill="#dc2626" font-size="24" font-weight="800">QRS</text><text x="447" y="145" fill="#d97706" font-size="20" font-weight="800">ST</text><text x="560" y="35" fill="#16a34a" font-size="24" font-weight="800">T</text></svg><div class="ecg-events"><div class="ecg-event" style="--c:#2563eb;--panel:0%"><b>P／PR</b><small>心房去極化<br>隨後心房收縮</small><div class="heart-mini"></div><em>訊號：竇房結 → 心房 → 房室結</em></div><div class="ecg-event" style="--c:#dc2626;--panel:66.666%"><b>QRS</b><small>心室去極化<br>隨後心室收縮</small><div class="heart-mini"></div><em>訊號沿希氏束與束支下傳</em></div><div class="ecg-event" style="--c:#d97706;--panel:100%"><b>ST</b><small>心室高原期<br>維持收縮狀態</small><div class="heart-mini"></div><em>L 型 Ca²⁺ 內流 ≈ K⁺ 外流</em></div><div class="ecg-event" style="--c:#16a34a;--panel:100%"><b>T</b><small>心室再極化<br>心室準備放鬆</small><div class="heart-mini"></div><em>K⁺ 外流使膜電位回復</em></div></div></div>`}
/* 平台紀錄：節點只在學生點選時送 explore；每題作答送 answer；第二關本輪全對才送 complete。 */
const ID='cardiac-electrical',seen=new Set();
const CL=()=>window.CourseLearning||{};
const $=id=>document.getElementById(id);
const nodeId=i=>`${ID}-node-${String(i+1).padStart(2,'0')}`;
function explore(i){const id=nodeId(i);if(seen.has(id))return;seen.add(id);CL().explore?.(id)}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const PHOTO=['map','sa','atria','av','his','purkinje'];
const visual=kind=>kind==='ecg'?ecgTimeline():PHOTO.includes(kind)?fifthChapterHeart(kind):svg(kind);

/* 知識節點 */
const vis=$('vis'),cap=$('cap'),exp=$('exp'),nodesBox=$('nodes');
function show(i,byStudent){
  const n=N[i];if(byStudent)explore(i);
  nodesBox.querySelectorAll('.node').forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-pressed',String(i===j))});
  vis.innerHTML=visual(n.kind);
  cap.textContent=n.kind==='ecg'?'由左往右讀：波形 → 電性活動 → 心臟正在做的事':`已選：${i+1}. ${n.title}`;
  exp.innerHTML=`<span class="tag">${n.tag}</span><h2>${i+1}. ${n.title}</h2><p class="concept">${n.concept}</p><div class="facts">${n.f.map(([h,x])=>`<div><b>${h}</b>${x}</div>`).join('')}</div>`;
}
N.forEach((n,i)=>{const b=document.createElement('button');b.type='button';b.className='node';b.setAttribute('aria-controls','exp');b.innerHTML=`<b>${i+1}. ${n.title}</b><small>${n.tag}</small>`;b.addEventListener('click',()=>{show(i,true);if(matchMedia('(max-width:899px)').matches)vis.scrollIntoView({behavior:'smooth',block:'nearest'})});nodesBox.append(b)});
show(0,false); // 預設顯示第一個節點，但不算學生已探索

/* 情境實驗室 */
const steps=[['竇房結起跑','訊號從右心房的竇房結開始。','sa'],['心房傳導','訊號擴散到兩個心房；對應 P 波。','atria'],['房室結暫緩','心房先完成送血入心室。','av'],['心室快速啟動','束支與浦金氏纖維快速分送訊號。','purkinje'],['ECG 對照','P、QRS、T 對應不同電性事件。','ecg']];
const lab=$('lab'),labv=$('labv'),labn=$('labn');let labTimer=null;
function selectLab(i){lab.querySelectorAll('.lab-step').forEach((x,j)=>{x.classList.toggle('active',j===i);x.setAttribute('aria-pressed',String(j===i))});const k=steps[i][2];labv.innerHTML=k==='ecg'?svg('ecg'):fifthChapterHeart(k);labn.textContent=steps[i][1]}
const autoLab=document.createElement('button');autoLab.type='button';autoLab.className='lab-auto';autoLab.textContent='▶ 自動播放';
function stopLab(){clearInterval(labTimer);labTimer=null;autoLab.textContent='▶ 自動播放'}
autoLab.addEventListener('click',()=>{if(labTimer)return stopLab();let i=0;selectLab(i);autoLab.textContent='⏸ 暫停';labTimer=setInterval(()=>{i++;if(i===steps.length){selectLab(0);stopLab()}else selectLab(i)},1200)});
lab.append(autoLab);
steps.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='lab-step';b.textContent=`${i+1}. ${s[0]}`;b.addEventListener('click',()=>{stopLab();selectLab(i)});lab.append(b)});
selectLab(0);
const predict=document.querySelector('.predict'),pf=$('pf');
predict.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.ok==='1'){b.classList.add('correct');predict.querySelectorAll('button').forEach(x=>x.disabled=true);pf.textContent='✅ 答對了！房室結暫緩讓心房先完成收縮與心室充血。'}else{b.classList.add('wrong');b.disabled=true;pf.textContent='❌ 再想一想：誰要先完成送血？'}}));

/* 分頁 */
const tabInfo=$('info'),tabQuiz=$('quiz'),pinfo=$('pinfo'),pquiz=$('pquiz'),qEl=$('q');
function mode(qz){tabInfo.classList.toggle('active',!qz);tabQuiz.classList.toggle('active',qz);pinfo.classList.toggle('active',!qz);pquiz.classList.toggle('active',qz);if(qz)setTimeout(()=>qEl.scrollIntoView({behavior:'smooth',block:'start'}),0)}
tabInfo.addEventListener('click',()=>mode(false));tabQuiz.addEventListener('click',()=>mode(true));

/* 兩階段診斷：題目 [id, 題幹, 選項(第一個為正解), 提示, 解析, 第二關對應節點] */
const qt=$('qt'),prog=$('prog'),opts=$('opts'),fb=$('fb'),next=$('next'),qbody=$('qbody'),pass=$('pass'),fail=$('fail'),failtxt=$('failtxt'),failLinks=$('failLinks');
let stage=1,idx=0,list=A,ok=0,lock=false,hadWrong=false;const missed=new Set(),wrongQ=new Set();
function render(){
  lock=false;const x=list[idx];
  qt.textContent=stage===1?'第一關｜先備知識':'第二關｜生活情境應用';
  prog.textContent=`${stage===1?'第一關':'第二關'} ${idx+1}／${list.length}`;
  qEl.textContent=x[1];opts.innerHTML='';fb.className='feedback';fb.textContent='';next.disabled=true;
  shuffle(x[2].map((t,i)=>[t,i])).forEach(([t,i])=>{
    const b=document.createElement('button');b.type='button';b.textContent=t;
    b.addEventListener('click',()=>{
      if(lock)return;const good=i===0;CL().answer?.(x[0],good);
      if(good){lock=true;if(stage===2)ok++;b.className='correct';fb.innerHTML=`<b>答對了！</b>${x[4]}`;fb.className='feedback show';next.disabled=false;opts.querySelectorAll('button').forEach(z=>z.disabled=true)}
      else{if(stage===2){hadWrong=true;missed.add(x[5]);wrongQ.add(x[0])}b.className='wrong';b.disabled=true;fb.textContent=`再想一想：${x[3]}`;fb.className='feedback show'}
    });opts.append(b)});
}
function showReviewLinks(){failLinks.innerHTML='';[...missed].sort((a,b)=>a-b).forEach(i=>{const b=document.createElement('button');b.type='button';b.textContent=`復習：${i+1}. ${N[i].title}`;b.addEventListener('click',()=>{mode(false);show(i,true);setTimeout(()=>vis.scrollIntoView({behavior:'smooth',block:'start'}),0)});failLinks.append(b)})}
next.addEventListener('click',()=>{
  idx++;if(idx<list.length)return render();
  if(stage===1){stage=2;idx=0;ok=0;hadWrong=false;missed.clear();wrongQ.clear();list=shuffle(B);return render()}
  qbody.style.display='none';
  if(ok===list.length&&!hadWrong){pass.style.display='block';CL().complete?.()}
  else{fail.style.display='block';failtxt.textContent=`本輪第一次就答對 ${list.length-wrongQ.size}／${list.length} 題；請回讀本次答錯的節點再試。`;showReviewLinks()}
});
function reset(all){pass.style.display=fail.style.display='none';failLinks.innerHTML='';qbody.style.display='block';stage=all?1:2;idx=0;ok=0;hadWrong=false;missed.clear();wrongQ.clear();list=stage===1?A:shuffle(B);render()}
$('restart').addEventListener('click',()=>reset(true));$('retry').addEventListener('click',()=>reset(false));
render();

</script></body></html>
